<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>widget selfcheck</title>
<style>
  html,body{margin:0;padding:0;background:#faf8f5;
    font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#2d2a26}
  /* the modal the widget really opens in: a white card with 1.1rem padding */
  #stage{--accent:#8a6a4f;background:#fff;padding:1.1rem;box-sizing:border-box}
  #verdict{white-space:pre}
</style>
</head>
<body>
<!-- canaries: real page furniture OUTSIDE the widget. If the widget's
     CSS reaches these, it is leaking into the lesson page. -->
<div id="sv-canary"><button class="a11y-btn">Dark mode</button><input type="range"><p>A paragraph of lesson prose.</p></div>
<div id="stage"><div id="mount"></div></div>
<!--WIDGET-->
<pre id="verdict">PENDING</pre>
<script>
/* Measures the widget at each width and writes one JSON verdict into
   #verdict, which the runner extracts with --dump-dom. Everything here
   runs in a real layout engine, so the heights are the heights a student
   would get — not an estimate. */
(function () {
  var WIDTHS = [360, 420, 560, 700, 900];
  var BUDGET = { 360: 640, 420: 640, 560: 600, 700: 560, 900: 560 };
  var out = { ok: true, widths: {}, problems: [], info: {} };

  function fail(msg) { out.ok = false; out.problems.push(msg); }

  function findWidget() {
    if (window.SVWidget && window.SVWidget.mount) return window.SVWidget;
    return null;
  }

  function measureAt(w) {
    var stage = document.getElementById('stage');
    stage.style.width = w + 'px';
    var mount = document.getElementById('mount');
    mount.innerHTML = '';
    var W = findWidget();
    var err = null;
    try {
      W.mount(mount, { accent: '#8a6a4f', reducedMotion: false });
    } catch (e) {
      err = String(e && e.message || e);
    }
    /* force layout */
    var h = Math.round(stage.getBoundingClientRect().height);
    var overflowX = stage.scrollWidth > stage.clientWidth + 1;
    var scrollers = [];
    var all = stage.querySelectorAll('*');
    for (var i = 0; i < all.length; i++) {
      var el = all[i], cs = getComputedStyle(el);
      if ((cs.overflowY === 'auto' || cs.overflowY === 'scroll') &&
          el.scrollHeight > el.clientHeight + 2) {
        scrollers.push((el.className || el.tagName).toString().slice(0, 40));
      }
    }
    /* prose lines too narrow to read */
    var narrow = 0;
    var textish = stage.querySelectorAll('p,li,div,span,button');
    for (var j = 0; j < textish.length; j++) {
      var t = textish[j];
      if (t.children.length) continue;
      var txt = (t.textContent || '').trim();
      if (txt.length < 45) continue;
      var box = t.getBoundingClientRect();
      var fs = parseFloat(getComputedStyle(t).fontSize) || 14;
      if (box.width / (fs * 0.5) < 32) narrow++;   /* < ~32 chars per line */
    }
    return { height: h, budget: BUDGET[w], over: h > BUDGET[w],
             overflowX: overflowX, innerScrollers: scrollers,
             narrowProse: narrow, mountError: err };
  }

  /* Real page furniture lives outside the widget in this harness. If the
     widget's CSS reaches it, the widget is leaking into the lesson page -
     which is how an earlier build restyled the accessibility toolbar. */
  function canarySnapshot() {
    var out = [];
    var els = document.querySelectorAll('#sv-canary *');
    for (var i = 0; i < els.length; i++) {
      var cs = getComputedStyle(els[i]);
      out.push([els[i].tagName, cs.color, cs.backgroundColor, cs.font,
                cs.padding, cs.border, cs.borderRadius, cs.accentColor].join('|'));
    }
    return out;
  }

  function run() {
    var W = findWidget();
    var canaryBefore = canarySnapshot();
    if (!W) { out.ok = false; out.problems.push('window.SVWidget.mount was never set'); done(); return; }
    out.info.id = (W.meta && W.meta.id) || null;
    out.info.title = (W.meta && W.meta.title) || null;
    if (!W.meta || !W.meta.id) fail('meta.id missing');

    WIDTHS.forEach(function (w) {
      var m = measureAt(w);
      out.widths[w] = m;
      if (m.mountError) fail('mount threw at ' + w + 'px: ' + m.mountError);
      if (m.over) fail('height ' + m.height + 'px exceeds ' + m.budget + 'px budget at ' + w + 'px');
      if (m.overflowX) fail('horizontal overflow at ' + w + 'px');
      if (m.innerScrollers.length) fail('internal scrolling at ' + w + 'px: ' + m.innerScrollers.join(', '));
      if (m.narrowProse) fail(m.narrowProse + ' text block(s) under ~32 characters per line at ' + w + 'px');
    });

    /* remount at a normal width for the interaction checks */
    var mount = document.getElementById('mount');
    document.getElementById('stage').style.width = '700px';
    mount.innerHTML = '';
    try { W.mount(mount, { accent: '#8a6a4f', reducedMotion: false }); } catch (e) {}

    /* the widget may stamp state on the element it was handed, or on a
       root it created inside it - accept either */
    var root = (mount.dataset && mount.dataset.svState) ? mount
             : (mount.querySelector('[data-sv-state]') || mount.firstElementChild || mount);
    out.info.exposesState = !!(root && root.dataset && root.dataset.svState);
    if (!out.info.exposesState) fail('root.dataset.svState is never set (the gate cannot read behaviour)');

    var buttons = mount.querySelectorAll('button');
    var focusables = mount.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])');
    out.info.buttons = buttons.length;
    out.info.focusables = focusables.length;
    if (!focusables.length) fail('nothing is keyboard reachable');

    /* a commit control: the guide requires one wherever there is a right answer */
    var labels = [];
    for (var b = 0; b < buttons.length; b++) labels.push((buttons[b].textContent || '').trim());
    out.info.buttonLabels = labels.slice(0, 12);
    out.info.hasCommit = labels.some(function (l) {
      return /^(check|run|test|see|reveal|commit|submit|go)\b/i.test(l);
    });

    /* every control must move something: click each button, watch state */
    var before = root && root.dataset ? root.dataset.svState : '';
    var moved = 0;
    for (var k = 0; k < buttons.length && k < 8; k++) {
      try { buttons[k].click(); } catch (e) {}
      var after = root && root.dataset ? root.dataset.svState : '';
      if (after !== before) { moved++; before = after; }
    }
    out.info.buttonsThatChangedState = moved;

    /* did the widget's styles escape its own root? */
    var canaryAfter = canarySnapshot();
    var leaked = [];
    for (var q = 0; q < canaryAfter.length; q++) {
      if (canaryAfter[q] !== canaryBefore[q]) {
        leaked.push(canaryAfter[q].split('|')[0]);
      }
    }
    if (leaked.length) {
      fail('CSS leaked out of the widget and restyled page furniture: ' +
           leaked.join(', ') + ' - scope every selector under your root class');
    }
    if (buttons.length && moved === 0) {
      fail('clicking buttons never changed dataset.svState - controls may be inert');
    }
    done();
  }

  function done() {
    document.getElementById('verdict').textContent = 'SVCHECK' + JSON.stringify(out) + 'ENDSVCHECK';
  }

  window.addEventListener('error', function (e) {
    fail('uncaught error: ' + (e.message || 'unknown'));
  });
  /* the widget script is injected by the runner before this file's inline
     script runs, so it is already registered by now */
  try { run(); } catch (e) { fail('harness crashed: ' + e.message); done(); }
})();
</script>
</body>
</html>
