  /**
   * stipple(ctx, clip, opts) : seeded dots on a jittered hex grid.
   *   spacing  7.5      mean px between dots at density 1 (about 0.02 dots per px2)
   *   r        [1.0, 2.2] dot radius range (bigger where density is higher)
   *   density  1 or fn(x,y) => 0..1
   *   jitter   0.45     fraction of spacing
   *   color    pal.ink
   *   alpha    0.9
   *   boilAmp  0.35     px shimmer per boil drawing
   *   clip     true     polygons: skip dots outside; functions/Path2D always hard-clip
   *   seed     13
   */
  function stipple(ctx, clip, o = {}) {
    const shape = shapeOf(clip, o);
    const seed = seedInt(o.seed === undefined ? 13 : o.seed);
    const sp = Math.max(1, o.spacing || 7.5);
    const rr = o.r || [1.0, 2.2];
    const density = o.density != null ? o.density : 1;
    const densFn = typeof density === 'function' ? density : null;
    const jit = (o.jitter != null ? o.jitter : 0.45) * sp;
    const boilAmp = o.boil === false ? 0 : o.boilAmp != null ? o.boilAmp : 0.35;
    const bi = boilIndex(o);
    const B = shape.bounds;
    const rowH = sp * 0.866;
    const p = new Path2D();
    const i0 = Math.floor(B.y / rowH) - 1, i1 = Math.ceil((B.y + B.h) / rowH) + 1;
    const j0 = Math.floor(B.x / sp) - 1, j1 = Math.ceil((B.x + B.w) / sp) + 1;
    for (let i = i0; i <= i1; i++) {
      const off = i & 1 ? sp * 0.5 : 0;
      for (let j = j0; j <= j1; j++) {
        const a = h3(i, j, seed);
        const b = h3(j, i, seed + 1);
        const c = h3(i + 7, j - 3, seed + 2);
        let x = j * sp + off + (a - 0.5) * 2 * jit;
        let y = i * rowH + (b - 0.5) * 2 * jit;
        if (x < B.x || x > B.x + B.w || y < B.y || y > B.y + B.h) continue;
        const dAt = densFn ? clamp(densFn(x, y)) : density;
        if (c >= dAt) continue;
        if (shape.polys && !polysContain(shape.polys, x, y)) continue;
        if (boilAmp) {
          x += (h3(i, j, seed + bi * 31 + 5) - 0.5) * 2 * boilAmp;
          y += (h3(j, i, seed + bi * 37 + 6) - 0.5) * 2 * boilAmp;
        }
        const rad = lerp(rr[0], rr[1], clamp(h3(j, i, seed + 3) * 0.55 + dAt * 0.45));
        p.moveTo(x + rad, y);
        p.arc(x, y, rad, 0, TAU);
      }
    }
    ctx.save();
    if (shape.apply && !shape.polys) shape.apply(ctx);
    ctx.globalAlpha *= o.alpha != null ? o.alpha : 0.9;
    ctx.fillStyle = o.color || pal.ink;
    ctx.fill(p);
    ctx.restore();
  }
  lib.stipple = stipple;

  // ===========================================================================
  // Backgrounds: paper, blueprint, stripes
  // ===========================================================================

  function renderScale() {
    return FILM.S || 1;
  }

  /**
   * paper(ctx, opts) : cream paper with mottling, grain and fibres. Cached by size, seed and options.
   *   x, y, w, h   0, 0, 1080, 1920
   *   color        pal.paper
   *   seed         3
   *   grain        1      fine grain strength
   *   fibres       1      fibre count multiplier
   *   mottle       1      large soft blotches
   *   vignette     0.35   darkened edges
   */
  function paper(ctx, o = {}) {
    const x = o.x || 0, y = o.y || 0;
    const w = o.w || W(), h = o.h || H();
    const S = renderScale();
    const color = o.color || pal.paper;
    const seed = seedInt(o.seed === undefined ? 3 : o.seed);
    const grain = o.grain != null ? o.grain : 1;
    const fibres = o.fibres != null ? o.fibres : 1;
    const mottle = o.mottle != null ? o.mottle : 1;
    const vignette = o.vignette != null ? o.vignette : 0.35;
    const key = ['paper', w, h, S, color, seed, grain, fibres, mottle, vignette].join('|');
    const c = cached(key, () => makePaper(Math.max(1, Math.round(w * S)), Math.max(1, Math.round(h * S)), S, color, seed, grain, fibres, mottle, vignette));
    ctx.drawImage(c, x, y, w, h);
  }

  function makePaper(cw, ch, S, color, seed, grain, fibres, mottle, vignette) {
    const c = newCanvas(cw, ch);
    const g = c.getContext('2d');
    const [br, bg, bb] = parseColor(color);
    // mottling from a low-resolution noise field, upscaled smooth
    const mw = Math.max(4, Math.ceil(cw / 18)), mh = Math.max(4, Math.ceil(ch / 18));
    const mf = new Float32Array(mw * mh);
    for (let j = 0; j < mh; j++) {
      for (let i = 0; i < mw; i++) {
        mf[j * mw + i] = lib.fbm2(i * 0.11, j * 0.11, seed, 4) * 0.8 + noise2(i * 0.5, j * 0.5, seed + 9) * 0.2;
      }
    }
    const img = g.createImageData(cw, ch);
    const d = img.data;
    const fx = (mw - 1) / cw, fy = (mh - 1) / ch;
    const cxv = cw / 2, cyv = ch / 2;
    const vr = Math.hypot(cxv, cyv);
    for (let py = 0; py < ch; py++) {
      const my = py * fy;
      const jy = Math.floor(my), ty = my - jy;
      const jy1 = Math.min(mh - 1, jy + 1);
      for (let px = 0; px < cw; px++) {
        const mx = px * fx;
        const ix = Math.floor(mx), tx = mx - ix;
        const ix1 = Math.min(mw - 1, ix + 1);
        const m =
          lerp(lerp(mf[jy * mw + ix], mf[jy * mw + ix1], tx), lerp(mf[jy1 * mw + ix], mf[jy1 * mw + ix1], tx), ty);
        const n = h3(px, py, seed + 77);
        const n2 = h3(px >> 1, py >> 1, seed + 78);
        const gr = ((n - 0.5) * 0.6 + (n2 - 0.5) * 0.4) * 0.07 * grain;
        const dxv = (px - cxv) / vr, dyv = (py - cyv) / vr;
        const vig = vignette * Math.max(0, dxv * dxv + dyv * dyv - 0.35) * 0.18;
        const k = 1 + m * 0.055 * mottle + gr - vig;
        const i = (py * cw + px) * 4;
        // darker areas go slightly warmer, like aged paper
        d[i] = br * k;
        d[i + 1] = bg * (k - (1 - k) * 0.12);
        d[i + 2] = bb * (k - (1 - k) * 0.35);
        d[i + 3] = 255;
      }
    }
    g.putImageData(img, 0, 0);
    // fibres
    const r = rng(seed + 5);
    const count = Math.round(((cw * ch) / (S * S)) / 1500 * fibres);
    const dark = new Path2D(), light = new Path2D();
    for (let i = 0; i < count; i++) {
      const x = r() * cw, y = r() * ch;
      const L = r.range(5, 26) * S * (r() < 0.08 ? 2.5 : 1);
      const a = r() * TAU;
      const bend = r.range(-0.5, 0.5) * L;
      const p = r() < 0.55 ? dark : light;
      const ex = x + Math.cos(a) * L, ey = y + Math.sin(a) * L;
      p.moveTo(x, y);
      p.quadraticCurveTo((x + ex) / 2 - Math.sin(a) * bend, (y + ey) / 2 + Math.cos(a) * bend, ex, ey);
    }
    g.lineCap = 'round';
    g.lineWidth = 0.7 * S;
    g.strokeStyle = lib.rgba(pal.inkSoft, 0.07);
    g.stroke(dark);
    g.lineWidth = 1.1 * S;
    g.strokeStyle = 'rgba(255,252,242,0.22)';
    g.stroke(light);
    // specks and faint foxing spots
    const specks = new Path2D();
    for (let i = 0; i < count * 0.08; i++) {
      const x = r() * cw, y = r() * ch, rad = r.range(0.3, 1.1) * S;
      specks.moveTo(x + rad, y);
      specks.arc(x, y, rad, 0, TAU);
    }
    g.fillStyle = lib.rgba(pal.inkSoft, 0.22);
    g.fill(specks);
    for (let i = 0; i < 6 * mottle; i++) {
      const x = r() * cw, y = r() * ch, rad = r.range(30, 120) * S;
      const gr = g.createRadialGradient(x, y, 0, x, y, rad);
      gr.addColorStop(0, lib.rgba(pal.paperDeep, 0.07));
      gr.addColorStop(1, lib.rgba(pal.paperDeep, 0));
      g.fillStyle = gr;
      g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
    }
    return c;
  }
  lib.paper = paper;

  /**
   * blueprint(ctx, opts) : navy plate with faint grid, big guide circles, long diagonals and noise.
   * Cached by size, seed and options.
   *   x, y, w, h   0, 0, 1080, 1920
   *   color        pal.navy
   *   seed         5
   *   grid         60      grid pitch (px); 0 turns the grid off
   *   major        5       every Nth grid line is stronger
   *   center       [0.5w, 0.44h]  centre of the guide circles
   *   circles      4
   *   diagonals    5
   *   noise        1
   *   marks        true    corner registration marks
   */
  function blueprint(ctx, o = {}) {
    const x = o.x || 0, y = o.y || 0;
    const w = o.w || W(), h = o.h || H();
    const S = renderScale();
    const opt = {
      color: o.color || pal.navy,
      seed: seedInt(o.seed === undefined ? 5 : o.seed),
      grid: o.grid != null ? o.grid : 60,
      major: o.major || 5,
      center: o.center || [w * 0.5, h * 0.44],
      circles: o.circles != null ? o.circles : 4,
      diagonals: o.diagonals != null ? o.diagonals : 5,
      noise: o.noise != null ? o.noise : 1,
      marks: o.marks !== false,
      line: o.line || pal.lavender,
    };
    const key = ['blueprint', w, h, S, JSON.stringify(opt)].join('|');
    const c = cached(key, () => makeBlueprint(w, h, S, opt));
    ctx.drawImage(c, x, y, w, h);
  }

  function makeBlueprint(w, h, S, o) {
    const cw = Math.max(1, Math.round(w * S)), ch = Math.max(1, Math.round(h * S));
    const c = newCanvas(cw, ch);
    const g = c.getContext('2d');
    const [br, bgc, bb] = parseColor(o.color);
    const [dr, dg, db] = parseColor(pal.navyDeep);
    const [lr, lg, lb] = parseColor(pal.navyLight);
    const img = g.createImageData(cw, ch);
    const d = img.data;
    const ccx = o.center[0] * S, ccy = o.center[1] * S;
    const R = Math.hypot(cw, ch) * 0.62;
    for (let py = 0; py < ch; py++) {
      for (let px = 0; px < cw; px++) {
        const rd = Math.min(1, Math.hypot(px - ccx, py - ccy) / R);
        // light centre falling to deep edges
        const t = rd * rd;
        let r = rd < 0.35 ? lerp(lr, br, rd / 0.35) : lerp(br, dr, (t - 0.1225) / 0.8775);
        let gg = rd < 0.35 ? lerp(lg, bgc, rd / 0.35) : lerp(bgc, dg, (t - 0.1225) / 0.8775);
        let b = rd < 0.35 ? lerp(lb, bb, rd / 0.35) : lerp(bb, db, (t - 0.1225) / 0.8775);
        const n = (h3(px, py, o.seed + 3) - 0.5) * 9 * o.noise + (h3(px >> 2, py >> 2, o.seed + 4) - 0.5) * 5 * o.noise;
        const i = (py * cw + px) * 4;
        d[i] = r + n * 0.8;
        d[i + 1] = gg + n * 0.85;
        d[i + 2] = b + n;
        d[i + 3] = 255;
      }
    }
    g.putImageData(img, 0, 0);
    g.scale(S, S);
    const r = rng(o.seed);
    const line = o.line;
    // grid
    if (o.grid > 0) {
      const minor = new Path2D(), major = new Path2D();
      let k = 0;
      for (let gx = (w / 2) % o.grid; gx <= w; gx += o.grid, k++) {
        const p = Math.round((gx - w / 2) / o.grid) % o.major === 0 ? major : minor;
        p.moveTo(gx, 0);
        p.lineTo(gx, h);
      }
      for (let gy = (h / 2) % o.grid; gy <= h; gy += o.grid) {
        const p = Math.round((gy - h / 2) / o.grid) % o.major === 0 ? major : minor;
        p.moveTo(0, gy);
        p.lineTo(w, gy);
      }
      g.lineWidth = 1;
      g.strokeStyle = lib.rgba(pal.grid, 0.3);
      g.stroke(minor);
      g.strokeStyle = lib.rgba(pal.grid, 0.5);
      g.stroke(major);
    }
    // long diagonals
    const [cx, cy] = o.center;
    for (let i = 0; i < o.diagonals; i++) {
      const a = r.range(0, Math.PI);
      const ox = cx + r.range(-0.35, 0.35) * w, oy = cy + r.range(-0.3, 0.3) * h;
      const L = Math.hypot(w, h);
      g.beginPath();
      g.moveTo(ox - Math.cos(a) * L, oy - Math.sin(a) * L);
      g.lineTo(ox + Math.cos(a) * L, oy + Math.sin(a) * L);
      g.lineWidth = r.range(0.8, 1.3);
      g.strokeStyle = lib.rgba(line, r.range(0.07, 0.14));
      if (r() < 0.35) g.setLineDash([r.range(6, 14), r.range(6, 12)]);
      else g.setLineDash([]);
      g.stroke();
    }
    g.setLineDash([]);
    // guide circles
    const minDim = Math.min(w, h);
    for (let i = 0; i < o.circles; i++) {
      const rad = minDim * (0.2 + i * 0.17) * r.range(0.95, 1.05);
      g.beginPath();
      g.arc(cx, cy, rad, 0, TAU);
      g.lineWidth = i === o.circles - 1 ? 1.4 : 1;
      g.strokeStyle = lib.rgba(line, i % 2 ? 0.1 : 0.16);
      if (i === 1) g.setLineDash([2, 7]);
      else g.setLineDash([]);
      g.stroke();
    }
    g.setLineDash([]);
    if (o.circles > 0) {
      const rad = minDim * (0.2 + (o.circles - 1) * 0.17);
      ticksImpl(g, cx, cy, { r: rad, n: 120, len: 7, major: 10, majorLen: 16, color: line, alpha: 0.2, width: 1 });
      // off-centre satellite circle
      const a = r.range(0, TAU);
      const sr = minDim * r.range(0.07, 0.12);
      g.beginPath();
      g.arc(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad, sr, 0, TAU);
      g.lineWidth = 1;
      g.strokeStyle = lib.rgba(line, 0.14);
      g.stroke();
      // centre crosshair
      g.beginPath();
      g.moveTo(cx - 18, cy);
      g.lineTo(cx + 18, cy);
      g.moveTo(cx, cy - 18);
      g.lineTo(cx, cy + 18);
      g.strokeStyle = lib.rgba(line, 0.22);
      g.stroke();
    }
    // corner registration marks
    if (o.marks) {
      g.strokeStyle = lib.rgba(line, 0.32);
      g.lineWidth = 1.2;
      const m = 34, s = 22;
      for (const [mx, my, sx, sy] of [[m, m, 1, 1], [w - m, m, -1, 1], [m, h - m, 1, -1], [w - m, h - m, -1, -1]]) {
        g.beginPath();
        g.moveTo(mx, my + sy * s);
        g.lineTo(mx, my);
        g.lineTo(mx + sx * s, my);
        g.stroke();
      }
    }
    // faint scattered star specks
    const sp = new Path2D();
    for (let i = 0; i < (w * h) / 5000 * o.noise; i++) {
      const x = r() * w, y = r() * h, rad = r.range(0.4, 1.1);
      sp.moveTo(x + rad, y);
      sp.arc(x, y, rad, 0, TAU);
    }
    g.fillStyle = lib.rgba(pal.lineWhite, 0.22);
    g.fill(sp);
    return c;
  }
  lib.blueprint = blueprint;

  /**
   * stripes(ctx, opts) : the wide diagonal stripe background with softly irregular edges.
   *   colors   [pal.stripeCream, pal.stripeYellow]
   *   width    140     band width (px); both colours use it
   *   angle    -0.52   stripe direction (radians): 30 degrees rising left to right
   *   offset   0       scroll along the normal (animate this)
   *   wobble   1.4     edge irregularity (px)
   *   bounds   frame
   *   seed     21
   */
  function stripes(ctx, o = {}) {
    const B = normBounds(o.bounds);
    const cols = o.colors || [pal.stripeCream, pal.stripeYellow];
    const sw = o.width || 140;
    const angle = o.angle != null ? o.angle : -0.52;
    const offset = o.offset || 0;
    const wobble = o.wobble != null ? o.wobble : 1.4;
    const seed = seedInt(o.seed === undefined ? 21 : o.seed);
    const dx = Math.cos(angle), dy = Math.sin(angle);
    const nx = -dy, ny = dx;
    const cx = B.x + B.w / 2, cy = B.y + B.h / 2;
    const half = Math.hypot(B.w, B.h) / 2 + sw * 2;
    ctx.save();
    ctx.beginPath();
    ctx.rect(B.x, B.y, B.w, B.h);
    ctx.clip();
    ctx.fillStyle = cols[0];
    ctx.fillRect(B.x, B.y, B.w, B.h);
    const period = sw * cols.length;
    const shift = ((offset % period) + period) % period;
    const edge = (v, k, forward) => {
      const pts = [];
      const n = Math.ceil((half * 2) / 40);
      for (let i = 0; i <= n; i++) {
        const u = -half + (i / n) * half * 2;
        const vv = v + wobble * noise1(u * 0.012 + k * 3.7, seed) + wobble * 0.3 * noise1(u * 0.05, seed + k);
        pts.push([cx + dx * u + nx * vv, cy + dy * u + ny * vv]);
      }
      if (!forward) pts.reverse();
      return pts;
    };
    for (let ci = 1; ci < cols.length; ci++) {
      const p = new Path2D();
      const first = Math.floor((-half - shift) / period) - 1;
      const last = Math.ceil((half - shift) / period) + 1;
      for (let k = first; k <= last; k++) {
        const v0 = k * period + shift + sw * ci - half * 0;
        const a = edge(v0, k * 2 + ci, true);
        const b = edge(v0 + sw, k * 2 + ci + 1, false);
        a.forEach((pt, i) => (i === 0 ? p.moveTo(pt[0], pt[1]) : p.lineTo(pt[0], pt[1])));
        b.forEach((pt) => p.lineTo(pt[0], pt[1]));
        p.closePath();
      }
      ctx.fillStyle = cols[ci];
      ctx.fill(p);
    }
    ctx.restore();
  }
  lib.stripes = stripes;

  // ===========================================================================
  // Schematic helpers
  // ===========================================================================

  /**
   * hexLattice(ctx, clip, opts) : hexagonal cell lattice with shared, slightly irregular vertices.
   *   r         16       cell circumradius (px)
   *   pointy    true     pointy-top cells (false = flat-top)
   *   width     1
   *   color     pal.lavender
   *   alpha     0.35
   *   jitter    1.0      vertex irregularity (px), shared by neighbouring cells
   *   inset     0        >0 draws each cell as its own hexagon shrunk by this many px
   *   cellFn    null     fn(cx, cy, i, j) => false (skip) | true | { fill, alpha, stroke }
   *   dots      0        radius of a dot at each cell centre (0 = none)
   *   boilAmp   0.35
   *   clip      true     hard-clip to the shape
   *   bounds    frame    when clip is a function, Path2D or null
   *   seed      17
   */
  function hexLattice(ctx, clip, o = {}) {
    const shape = shapeOf(clip, Object.assign({ pad: (o.r || 16) * 2 }, o));
    const R = o.r || 16;
    const pointy = o.pointy !== false;
    const seed = seedInt(o.seed === undefined ? 17 : o.seed);
    const jitter = o.jitter != null ? o.jitter : 1.0;
    const boilAmp = o.boil === false ? 0 : o.boilAmp != null ? o.boilAmp : 0.35;
    const bi = boilIndex(o);
    const inset = o.inset || 0;
    const B = shape.bounds;
    const sq3 = Math.sqrt(3);
    const colW = pointy ? sq3 * R : 1.5 * R;
    const rowH = pointy ? 1.5 * R : sq3 * R;
    const vtx = (x, y) => {
      const kx = Math.round(x * 4), ky = Math.round(y * 4);
      const jx = (h3(kx, ky, seed) - 0.5) * 2 * jitter + (boilAmp ? (h3(kx, ky, seed + bi * 13 + 1) - 0.5) * 2 * boilAmp : 0);
      const jy = (h3(ky, kx, seed + 2) - 0.5) * 2 * jitter + (boilAmp ? (h3(ky, kx, seed + bi * 17 + 3) - 0.5) * 2 * boilAmp : 0);
      return [x + jx, y + jy];
    };
    const edges = new Path2D();
    const dots = new Path2D();
    const fills = [];
    const i0 = Math.floor(B.y / rowH) - 1, i1 = Math.ceil((B.y + B.h) / rowH) + 1;
    const j0 = Math.floor(B.x / colW) - 1, j1 = Math.ceil((B.x + B.w) / colW) + 1;
    for (let i = i0; i <= i1; i++) {
      for (let j = j0; j <= j1; j++) {
        let cx, cy;
        if (pointy) {
          cx = j * colW + (i & 1 ? colW / 2 : 0);
          cy = i * rowH;
        } else {
          cx = j * colW;
          cy = i * rowH + (j & 1 ? rowH / 2 : 0);
        }
        if (shape.polys && !polysContain(shape.polys, cx, cy)) {
          // keep cells that straddle the edge so the hard clip cuts them cleanly
          let near = false;
          for (let k = 0; k < 6 && !near; k++) {
            const a = (k / 6) * TAU + (pointy ? Math.PI / 6 : 0);
            near = polysContain(shape.polys, cx + Math.cos(a) * R, cy + Math.sin(a) * R);
          }
          if (!near) continue;
        }
        let cell = true;
        if (o.cellFn) {
          cell = o.cellFn(cx, cy, i, j);
          if (!cell) continue;
        }
        const V = [];
        for (let k = 0; k < 6; k++) {
          const a = (k / 6) * TAU + (pointy ? Math.PI / 6 : 0);
          V.push(vtx(cx + Math.cos(a) * R, cy + Math.sin(a) * R));
        }
        if (typeof cell === 'object' && cell.fill) fills.push([V, cell]);
        if (inset > 0) {
          for (let k = 0; k < 6; k++) {
            const v = V[k];
            const f = Math.max(0, 1 - inset / R);
            const x = cx + (v[0] - cx) * f, y = cy + (v[1] - cy) * f;
            if (k === 0) edges.moveTo(x, y);
            else edges.lineTo(x, y);
          }
          edges.closePath();
        } else {
          // three edges per cell so shared edges are drawn once
          const ks = pointy ? [5, 0, 1] : [0, 1, 2];
          for (const k of ks) {
            edges.moveTo(V[k][0], V[k][1]);
            edges.lineTo(V[(k + 1) % 6][0], V[(k + 1) % 6][1]);
          }
          // cells on the left/top border of the drawn set need their other edges
          if (o.cellFn || shape.polys) {
            for (const k of pointy ? [2, 3, 4] : [3, 4, 5]) {
              edges.moveTo(V[k][0], V[k][1]);
              edges.lineTo(V[(k + 1) % 6][0], V[(k + 1) % 6][1]);
            }
          }
        }
        if (o.dots) {
          dots.moveTo(cx + o.dots, cy);
          dots.arc(cx, cy, o.dots, 0, TAU);
        }
      }
    }
    ctx.save();
    if (shape.apply && o.clip !== false) shape.apply(ctx);
    const color = o.color || pal.lavender;
    const alpha = o.alpha != null ? o.alpha : 0.35;
    for (const [V, cell] of fills) {
      ctx.beginPath();
      lib.tracePath(ctx, V, true);
      ctx.globalAlpha = cell.alpha != null ? cell.alpha : 0.35;
      ctx.fillStyle = cell.fill;
      ctx.fill();
    }
    ctx.globalAlpha = alpha;
    ctx.lineWidth = o.width != null ? o.width : 1;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.strokeStyle = color;
    ctx.stroke(edges);
    if (o.dots) {
      ctx.fillStyle = color;
      ctx.fill(dots);
    }
    ctx.restore();
  }
  lib.hexLattice = hexLattice;

  function needle(p, x0, y0, x1, y1, w0, w1) {
    const dx = x1 - x0, dy = y1 - y0;
    const L = Math.hypot(dx, dy) || 1;
    const nx = -dy / L, ny = dx / L;
    p.moveTo(x0 + nx * w0, y0 + ny * w0);
    p.lineTo(x1 + nx * w1, y1 + ny * w1);
    p.lineTo(x1 - nx * w1, y1 - ny * w1);
    p.lineTo(x0 - nx * w0, y0 - ny * w0);
    p.closePath();
  }

  /**
   * glowDot(ctx, x, y, r, opts) : soft glow, hot core and star rays (a nucleus, a spark, a star).
   *   color     pal.glow    glow colour
   *   core      '#ffffff'
   *   rays      8           ray count (0 = none); long and short alternate
   *   rayLen    3.4         ray length as a multiple of r
   *   rayWidth  0.22        ray base width as a multiple of r
   *   rot       0
   *   glow      4.5         glow radius as a multiple of r
   *   intensity 1
   *   twinkle   0.18        per boil drawing flicker
   *   additive  true        'lighter' blending (use false on paper)
   *   seed      19
   */
  function glowDot(ctx, x, y, r, o = {}) {
    const seed = seedInt(o.seed === undefined ? 19 : o.seed);
    const bi = boilIndex(o);
    const tw = o.twinkle != null ? o.twinkle : 0.18;
    const k = (o.intensity != null ? o.intensity : 1) * (1 - tw + tw * 2 * h3(bi, seed, 23));
    const color = o.color || pal.glow;
    const glowR = r * (o.glow != null ? o.glow : 4.5);
    ctx.save();
    if (o.additive !== false) ctx.globalCompositeOperation = 'lighter';
    const base = ctx.globalAlpha;
    const g = ctx.createRadialGradient(x, y, 0, x, y, glowR);
    g.addColorStop(0, lib.rgba(color, 0.55 * k));
    g.addColorStop(0.18, lib.rgba(color, 0.22 * k));
    g.addColorStop(0.5, lib.rgba(color, 0.06 * k));
    g.addColorStop(1, lib.rgba(color, 0));
    ctx.fillStyle = g;
    ctx.fillRect(x - glowR, y - glowR, glowR * 2, glowR * 2);
    const rays = o.rays != null ? o.rays : 8;
    if (rays > 0) {
      const p = new Path2D();
      const rot = o.rot || 0;
      const rl = r * (o.rayLen != null ? o.rayLen : 3.4);
      const rw = r * (o.rayWidth != null ? o.rayWidth : 0.22);
      for (let i = 0; i < rays; i++) {
        const a = rot + (i / rays) * TAU;
        const L = (i % 2 ? 0.52 : 1) * rl * (0.9 + 0.2 * h3(i, bi, seed));
        needle(p, x, y, x + Math.cos(a) * L, y + Math.sin(a) * L, rw, 0.05);
      }
      ctx.globalAlpha = base * Math.min(1, 0.85 * k);
      ctx.fillStyle = o.core || '#ffffff';
      ctx.fill(p);
    }
    ctx.globalAlpha = base * Math.min(1, k);
    const cg = ctx.createRadialGradient(x, y, 0, x, y, r);
    cg.addColorStop(0, o.core || '#ffffff');
    cg.addColorStop(0.55, lib.rgba(o.core || '#ffffff', 0.9));
    cg.addColorStop(1, lib.rgba(color, 0));
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
  lib.glowDot = glowDot;

  function ticksImpl(ctx, x, y, o) {
    const p = new Path2D();
    const pm = new Path2D();
    const n = o.n || 24;
    const len = o.len != null ? o.len : 12;
    const major = o.major || 0;
    const majorLen = o.majorLen != null ? o.majorLen : len * 1.8;
    const prog = o.p != null ? clamp(o.p) : 1;
    const count = Math.round(n * prog);
    if (o.kind === 'linear' || (o.r == null && o.length != null)) {
      const L = o.length || 300;
      const a = o.angle || 0;
      const dx = Math.cos(a), dy = Math.sin(a);
      const side = o.side || 1;
      const nx = -dy * side, ny = dx * side;
      for (let i = 0; i <= Math.round(n * prog); i++) {
        const u = (i / n) * L;
        const isMajor = major && i % major === 0;
        const l = isMajor ? majorLen : len;
        const tgt = isMajor ? pm : p;
        tgt.moveTo(x + dx * u, y + dy * u);
        tgt.lineTo(x + dx * u + nx * l, y + dy * u + ny * l);
      }
      if (o.baseline !== false) {
        pm.moveTo(x, y);
        pm.lineTo(x + dx * L * prog, y + dy * L * prog);
      }
    } else {
      const r = o.r != null ? o.r : 40;
      const a0 = (o.start || 0) + (o.rot || 0);
      const span = o.span != null ? o.span : TAU;
      const full = Math.abs(span - TAU) < 1e-6;
      const dir = o.inward ? -1 : 1;
      for (let i = 0; i < count; i++) {
        const a = a0 + (i / (full ? n : Math.max(1, n - 1))) * span;
        const isMajor = major && i % major === 0;
        const l = (isMajor ? majorLen : len) * dir;
        const tgt = isMajor ? pm : p;
        const c = Math.cos(a), s = Math.sin(a);
        tgt.moveTo(x + c * r, y + s * r);
        tgt.lineTo(x + c * (r + l), y + s * (r + l));
      }
    }
    ctx.save();
    ctx.lineCap = 'round';
    ctx.strokeStyle = o.color || pal.lineWhite;
    ctx.globalAlpha *= o.alpha != null ? o.alpha : 0.6;
    ctx.lineWidth = o.width != null ? o.width : 1.5;
    ctx.stroke(p);
    ctx.lineWidth = (o.width != null ? o.width : 1.5) * 1.35;
    ctx.stroke(pm);
    ctx.restore();
  }

  /**
   * ticks(ctx, x, y, opts) : radial ticks around a circle, or a linear ruler.
   * Radial (default):  r 40, n 24, len 12, start 0, span TAU, major 0, majorLen len*1.8, inward false, rot 0
   * Linear (kind 'linear' or length given): length 300, angle 0, n 24, len 12, major 0, side 1, baseline true
   * Both: color pal.lineWhite, alpha 0.6, width 1.5, p 1 (draw-on progress)
   */
  lib.ticks = (ctx, x, y, o = {}) => ticksImpl(ctx, x, y, o);

  function labelAt(ctx, str, x, y, o) {
    lib.text(ctx, str, x, y, {
      size: o.labelSize || 22,
      color: o.labelColor || o.color,
      alpha: o.alpha != null ? o.alpha : 0.9,
      align: o.labelAlign || 'center',
      baseline: 'middle',
      weight: 400,
      tracking: 1,
    });
  }

  /**
   * bracket(ctx, x1, y1, x2, y2, opts) : a measurement bracket between two points.
   *   style    'dim'    'dim' = dimension line with end bars and arrow ticks, 'square' = [ shape
   *   offset   0        perpendicular offset of the bracket from the measured points (px)
   *   cap      16       end bar length
   *   color    pal.lavender
   *   alpha    0.6
   *   width    1.5
   *   label    null     text at the middle
   *   p        1        draw-on progress
   */
  lib.bracket = (ctx, x1, y1, x2, y2, o = {}) => {
    const dx = x2 - x1, dy = y2 - y1;
    const L = Math.hypot(dx, dy) || 1;
    const ux = dx / L, uy = dy / L;
    const nx = -uy, ny = ux;
    const off = o.offset || 0;
    const cap = o.cap != null ? o.cap : 16;
    const prog = o.p != null ? clamp(o.p) : 1;
    const ax = x1 + nx * off, ay = y1 + ny * off;
    const bx = x2 + nx * off, by = y2 + ny * off;
    const mx = (ax + bx) / 2, my = (ay + by) / 2;
    const h = (L / 2) * prog;
    const p = new Path2D();
    const style = o.style || 'dim';
    const labelGap = o.label ? Math.min(h * 0.9, (String(o.label).length * (o.labelSize || 22)) * 0.34 + 10) : 0;
    const sx = mx - ux * h, sy = my - uy * h, ex = mx + ux * h, ey = my + uy * h;
    if (style === 'square') {
      const sgn = off >= 0 ? -1 : 1;
      p.moveTo(sx + nx * cap * sgn, sy + ny * cap * sgn);
      p.lineTo(sx, sy);
      p.lineTo(mx - ux * labelGap, my - uy * labelGap);
      p.moveTo(mx + ux * labelGap, my + uy * labelGap);
      p.lineTo(ex, ey);
      p.lineTo(ex + nx * cap * sgn, ey + ny * cap * sgn);
    } else {
      p.moveTo(sx, sy);
      p.lineTo(mx - ux * labelGap, my - uy * labelGap);
      p.moveTo(mx + ux * labelGap, my + uy * labelGap);
      p.lineTo(ex, ey);
      p.moveTo(sx - nx * cap * 0.5, sy - ny * cap * 0.5);
      p.lineTo(sx + nx * cap * 0.5, sy + ny * cap * 0.5);
      p.moveTo(ex - nx * cap * 0.5, ey - ny * cap * 0.5);
      p.lineTo(ex + nx * cap * 0.5, ey + ny * cap * 0.5);
      const ah = Math.min(9, h * 0.3);
      p.moveTo(sx + ux * ah + nx * ah * 0.5, sy + uy * ah + ny * ah * 0.5);
      p.lineTo(sx, sy);
      p.lineTo(sx + ux * ah - nx * ah * 0.5, sy + uy * ah - ny * ah * 0.5);
      p.moveTo(ex - ux * ah + nx * ah * 0.5, ey - uy * ah + ny * ah * 0.5);
      p.lineTo(ex, ey);
      p.lineTo(ex - ux * ah - nx * ah * 0.5, ey - uy * ah - ny * ah * 0.5);
      if (off) {
        // extension lines back to the measured points
        p.moveTo(x1 + nx * Math.sign(off) * 4, y1 + ny * Math.sign(off) * 4);
        p.lineTo(ax + nx * Math.sign(off) * cap * 0.6, ay + ny * Math.sign(off) * cap * 0.6);
        p.moveTo(x2 + nx * Math.sign(off) * 4, y2 + ny * Math.sign(off) * 4);
        p.lineTo(bx + nx * Math.sign(off) * cap * 0.6, by + ny * Math.sign(off) * cap * 0.6);
      }
    }
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = o.color || pal.lavender;
    ctx.globalAlpha *= o.alpha != null ? o.alpha : 0.6;
    ctx.lineWidth = o.width != null ? o.width : 1.5;
    ctx.stroke(p);
    ctx.restore();
    if (o.label && prog > 0.6) {
      ctx.save();
      ctx.translate(mx, my);
      let a = Math.atan2(uy, ux);
      if (a > Math.PI / 2 || a < -Math.PI / 2) a += Math.PI;
      ctx.rotate(a);
      ctx.globalAlpha *= clamp((prog - 0.6) / 0.4);
      labelAt(ctx, o.label, 0, 0, Object.assign({ color: o.color || pal.lavender }, o));
      ctx.restore();
    }
  };

  /**
   * guideCircle(ctx, cx, cy, r, opts) : a faint construction circle.
   *   color pal.lavender, alpha 0.15, width 1.5, dash null ([on, off]),
   *   p 1 (draw-on progress), start -PI/2, cross 0 (centre crosshair half-size),
   *   quadrants 0 (tick length at the four quadrant points), ink false (hand-drawn via inkPath), seed
   */
  lib.guideCircle = (ctx, cx, cy, r, o = {}) => {
    const prog = o.p != null ? clamp(o.p) : 1;
    if (prog <= 0) return;
    const start = o.start != null ? o.start : -Math.PI / 2;
    const color = o.color || pal.lavender;
    const alpha = o.alpha != null ? o.alpha : 0.15;
    const width = o.width != null ? o.width : 1.5;
    ctx.save();
    if (o.ink) {
      const n = Math.max(12, Math.ceil(r * TAU * prog / 10));
      const pts = [];
      for (let i = 0; i <= n; i++) {
        const a = start + (i / n) * TAU * prog;
        pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
      }
      inkPath(ctx, pts, { closed: prog >= 1, width: width * 1.4, color, alpha, seed: o.seed, taper: [6, 12], wobble: 1.2 });
    } else {
      ctx.beginPath();
      ctx.arc(cx, cy, r, start, start + TAU * prog);
      ctx.strokeStyle = color;
      ctx.globalAlpha *= alpha;
      ctx.lineWidth = width;
      ctx.lineCap = 'round';
      if (o.dash) ctx.setLineDash(o.dash);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    if (o.cross || o.quadrants) {
      const p = new Path2D();
      if (o.cross) {
        p.moveTo(cx - o.cross, cy);
        p.lineTo(cx + o.cross, cy);
        p.moveTo(cx, cy - o.cross);
        p.lineTo(cx, cy + o.cross);
      }
      if (o.quadrants) {
        for (let k = 0; k < 4; k++) {
          const a = (k * Math.PI) / 2;
          const c = Math.cos(a), s = Math.sin(a);
          p.moveTo(cx + c * (r - o.quadrants), cy + s * (r - o.quadrants));
          p.lineTo(cx + c * (r + o.quadrants), cy + s * (r + o.quadrants));
        }
      }
      if (o.ink) {
        ctx.strokeStyle = color;
        ctx.globalAlpha *= alpha;
      }
      ctx.lineWidth = width;
      ctx.stroke(p);
    }
    ctx.restore();
  };

  /**
   * arcAnnotation(ctx, cx, cy, r, a0, a1, opts) : a thin coloured arc over an illustration
   * (flight paths, sound, attention), with an arrowhead and an origin dot.
   *   color pal.annMagenta, width 2, alpha 1, p 1 (draw-on progress), endTicks 8 (0 = none),
   *   arrow 0 (arrowhead size), dot 0 (origin dot radius), dash null, label null, labelOffset 26
   */
  lib.arcAnnotation = (ctx, cx, cy, r, a0, a1, o = {}) => {
    const prog = o.p != null ? clamp(o.p) : 1;
    if (prog <= 0) return;
    const color = o.color || pal.annMagenta;
    const width = o.width != null ? o.width : 2;
    const ae = a0 + (a1 - a0) * prog;
    const ccw = a1 < a0;
    ctx.save();
    ctx.globalAlpha *= o.alpha != null ? o.alpha : 1;
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    if (o.dash) ctx.setLineDash(o.dash);
    ctx.beginPath();
    ctx.arc(cx, cy, r, a0, ae, ccw);
    ctx.stroke();
    ctx.setLineDash([]);
    const et = o.endTicks != null ? o.endTicks : 8;
    if (et) {
      ctx.beginPath();
      for (const a of prog >= 1 ? [a0, ae] : [a0]) {
        ctx.moveTo(cx + Math.cos(a) * (r - et / 2), cy + Math.sin(a) * (r - et / 2));
        ctx.lineTo(cx + Math.cos(a) * (r + et / 2), cy + Math.sin(a) * (r + et / 2));
      }
      ctx.stroke();
    }
    const dot = o.dot != null ? o.dot : 0;
    if (dot) {
      ctx.beginPath();
      ctx.arc(cx + Math.cos(a0) * r, cy + Math.sin(a0) * r, dot, 0, TAU);
      ctx.fill();
    }
    const ah = o.arrow != null ? o.arrow : 0;
    if (ah) {
      const ex = cx + Math.cos(ae) * r, ey = cy + Math.sin(ae) * r;
      const tdir = ae + (ccw ? -Math.PI / 2 : Math.PI / 2);
      const tx = Math.cos(tdir), ty = Math.sin(tdir);
      const nx = -ty, ny = tx;
      ctx.beginPath();
      ctx.moveTo(ex + tx * ah * 0.35, ey + ty * ah * 0.35);
      ctx.lineTo(ex - tx * ah * 0.75 + nx * ah * 0.45, ey - ty * ah * 0.75 + ny * ah * 0.45);
      ctx.lineTo(ex - tx * ah * 0.45, ey - ty * ah * 0.45);
      ctx.lineTo(ex - tx * ah * 0.75 - nx * ah * 0.45, ey - ty * ah * 0.75 - ny * ah * 0.45);
      ctx.closePath();
      ctx.fill();
    }
    if (o.label) {
      const am = (a0 + ae) / 2;
      const lo = o.labelOffset != null ? o.labelOffset : 26;
      lib.text(ctx, o.label, cx + Math.cos(am) * (r + lo), cy + Math.sin(am) * (r + lo), {
        size: o.labelSize || 24,
        color,
        align: 'center',
        baseline: 'middle',
        weight: 500,
      });
    }
    ctx.restore();
  };

  // ===========================================================================
  // Camera and text
  // ===========================================================================

  /**
   * camera(ctx, { x, y, zoom, rot }, fn) : draws fn(ctx) with world point (x, y) at the frame centre,
   * scaled by zoom and rotated by rot. Defaults: the frame centre, zoom 1, rot 0.
   */
  lib.camera = (ctx, cam, fn) => {
    const c = cam || {};
    const x = c.x != null ? c.x : W() / 2;
    const y = c.y != null ? c.y : H() / 2;
    ctx.save();
    ctx.translate(W() / 2, H() / 2);
    if (c.rot) ctx.rotate(c.rot);
    if (c.zoom != null && c.zoom !== 1) ctx.scale(c.zoom, c.zoom);
    ctx.translate(-x, -y);
    let out;
    try {
      out = fn(ctx);
    } finally {
      ctx.restore();
    }
    return out;
  };

  const FONT_STACK = '"SF Pro Rounded", ui-rounded, "Helvetica Neue", system-ui, -apple-system, "Segoe UI", Arial, sans-serif';

  /**
   * text(ctx, str, x, y, opts) : a thin single-line wordmark in the system sans-serif (no font files).
   *   size 42, weight 300, color pal.ink, alpha 1, align 'left', baseline 'alphabetic',
   *   tracking 0 (px number, or a css length such as '0.12em'; letterSpacing is an alias),
   *   family (system stack), p 1 (typewriter reveal fraction), italic false
   */
  lib.text = (ctx, str, x, y, o = {}) => {
    let s = String(str);
    if (o.p != null) s = s.slice(0, Math.round(s.length * clamp(o.p)));
    if (!s) return;
    ctx.save();
    ctx.font = `${o.italic ? 'italic ' : ''}${o.weight || 300} ${o.size || 42}px ${o.family || FONT_STACK}`;
    ctx.fillStyle = o.color || pal.ink;
    ctx.globalAlpha *= o.alpha != null ? o.alpha : 1;
    ctx.textAlign = o.align || 'left';
    ctx.textBaseline = o.baseline || 'alphabetic';
    if ('letterSpacing' in ctx) {
      const tr = o.letterSpacing != null ? o.letterSpacing : o.tracking;
      ctx.letterSpacing = typeof tr === 'string' ? tr : `${tr || 0}px`;
    }
    ctx.fillText(s, x, y);
    ctx.restore();
  };

  // ===========================================================================
  // Read-only
  // ===========================================================================

  // A scene that changed lib, lib.pal or lib.ease would leak into every shot drawn after it, in
  // whatever order frames happen to be drawn (and differently in each render worker). So all of
  // it is frozen:
  //   - lib itself is a plain frozen object: a write throws in strict code and is ignored in
  //     non-strict code, so nothing leaks, and reading lib.fn in a hot loop stays at full speed.
  //   - pal and ease are also wrapped so a write throws even from non-strict scene code (core
  //     records it as a draw error, tools/check.cjs reports it). The wrapper makes each read about
  //     20 ns slower, so hoist colours out of per-point loops (const ink = P.ink). Code inside lib
  //     uses the raw objects and pays nothing.
  function readOnly(target, name) {
    const fail = (verb, prop) => {
      throw new TypeError(
        `${name} is read-only: a scene cannot ${verb} '${String(prop)}' (it would leak into other shots). ` +
          `Make a local copy instead, for example const P = Object.assign({}, FILM.lib.pal, { ink: '#000' }).`
      );
    };
    return new Proxy(Object.freeze(target), {
      set: (t, prop) => fail('set', prop),
      defineProperty: (t, prop) => fail('define', prop),
      deleteProperty: (t, prop) => fail('delete', prop),
      setPrototypeOf: () => fail('change the prototype of', name),
    });
  }
  for (const key of Object.keys(ease)) Object.freeze(ease[key]);
  lib.pal = readOnly(pal, 'FILM.lib.pal');
  lib.ease = readOnly(ease, 'FILM.lib.ease');
  for (const key of Object.keys(lib)) {
    const v = Object.getOwnPropertyDescriptor(lib, key).value;
    if (typeof v === 'function') Object.freeze(v);
  }
  Object.defineProperty(FILM, 'lib', { value: Object.freeze(lib), writable: false, enumerable: true, configurable: false });
})();

<script>
// ---- src\scenes\01-hero-cell.js
// 01 hero-cell : Cold open, one body cell among many.
//
// T 0.0 to 2.0, illustrated (paper plate). Enters on the film start and on the loop replay from 11.
// One generic animal body cell sits on the storyboard's G1 geometry, huge in a tall frame, with
// neighbour cells cut by the four edges so the field reads as living tissue. Inside the membrane:
// cytoplasm with directional hatching near the rim, ribosome stipple, six bean mitochondria, and one
// nucleus holding four loose worm chromosomes (two pairs: chromoA long blue, chromoB short rust).
//
// Frame 0 is the full pose. The cell breathes on the 0.5 s beat (membrane 380 to 392 and back over
// three drawings) while a magenta and a yellow ring burst from the nucleus; smaller breaths land on
// T 1.0 and T 1.5. The camera pushes in from zoom 1.00 to 1.04 with inOutSine.
//
// Layers, back to front:
//   0  the paper plate
//   1  stripes (screen-fixed, full bleed, drifting 1 px per frame)
//   2  neighbour cells, quiet, cut by the frame edges
//   3  the hero's contact shade on the tissue, lower right only
//   4  construction geometry: guide circles, the 45 degree diameters, the square, registration marks
//   5  the hero cell: cytoplasm, hatching, ribosomes, mitochondria, nucleus, nucleolus, chromosomes,
//      then the doubled ink membrane on top
//   6  overlays: the annBlue ring band (r 400 to 440), the annYellow 90 degree ruler arc over the
//      top, and the burst rings on the beats
//   7  the shared cycle glyph, screen-fixed, always last
//
// Match cut: 02 cuts onto this outline, so every number in the G1 block below is copied verbatim
// from docs/storyboard.md "Shared geometry / G1". A sibling shot that needs the same wobbled
// outline must seed it the same way: LIB.hash('hero-cell', 'membrane') and 'nucleus'.
//
// Biology held to (art bible 10.1, 10.2, 10.7): an irregular near-circle, no cell wall, no
// chloroplasts, no vacuole; exactly four chromosomes in two equal-length pairs, drawn (never hidden)
// as long thin threads because the DNA has not been copied yet; mitochondria with folded inner
// ridges; ribosomes as stipple; a nucleolus inside the nuclear membrane.
(function () {
  'use strict';

  const ID = 'hero-cell';
  const LIB = FILM.lib;
  const TAU = Math.PI * 2;
  const DEG = Math.PI / 180;

  // ---------------------------------------------------------------------------
  // small maths
  // ---------------------------------------------------------------------------

  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (v, lo = 0, hi = 1) => (v < lo ? lo : v > hi ? hi : v);
  const sstep = (a, b, x) => {
    const t = clamp((x - a) / (b - a || 1e-6));
    return t * t * (3 - 2 * t);
  };
  // every seed in this file derives from the shot id, so the drawing is identical on every render
  const sd = (...k) => LIB.hash(ID, ...k) & 0x7fffffff;

  function trace(ctx, pts, closed = true) {
    for (let i = 0; i < pts.length; i++) {
      if (i === 0) ctx.moveTo(pts[i][0], pts[i][1]);
      else ctx.lineTo(pts[i][0], pts[i][1]);
    }
    if (closed) ctx.closePath();
  }

  function fillPoly(ctx, pts, color, alpha = 1) {
    ctx.save();
    ctx.globalAlpha *= alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    trace(ctx, pts, true);
    ctx.fill();
    ctx.restore();
  }

  // A closed rod around a centreline: both flanks offset by halfW, with true half-disc ends, so a
  // chromosome thread or a mitochondrion reads as a tube and not as a lens.
  function rodPoly(line, halfW) {
    const n = line.length;
    if (n < 2) return line.slice();
    let total = 0;
    for (let i = 1; i < n; i++) total += Math.hypot(line[i][0] - line[i - 1][0], line[i][1] - line[i - 1][1]);
    const capF = clamp(halfW / Math.max(1e-3, total), 0.02, 0.45);
    const left = [], right = [];
    for (let i = 0; i < n; i++) {
      const a = line[Math.max(0, i - 1)], b = line[Math.min(n - 1, i + 1)];
      let tx = b[0] - a[0], ty = b[1] - a[1];
      const l = Math.hypot(tx, ty) || 1;
      tx /= l;
      ty /= l;
      const u = i / (n - 1);
      const e = Math.min(u, 1 - u);
      const kk = e >= capF ? 1 : Math.sqrt(Math.max(0, 1 - Math.pow(1 - e / capF, 2)));
      const w = halfW * kk;
      left.push([line[i][0] - ty * w, line[i][1] + tx * w]);
      right.push([line[i][0] + ty * w, line[i][1] - tx * w]);
    }
    return left.concat(right.reverse());
  }

  // A closed, seeded, organic near-circle. Four harmonics, so the loop joins itself exactly and the
  // shape reads as a living cell rather than a compass circle. The low harmonics carry most of the
  // amplitude, which flattens one flank and bulges another, the way a cell pressed by its neighbours
  // actually sits.
  function lumpy(seed) {
    const r = LIB.rng(seed);
    const p1 = r.range(0, TAU), p2 = r.range(0, TAU), p3 = r.range(0, TAU), p4 = r.range(0, TAU);
    const w1 = r.range(0.52, 0.66), w2 = r.range(0.3, 0.42), w3 = r.range(0.14, 0.22), w4 = r.range(0.07, 0.12);
    const norm = w1 + w2 + w3 + w4;
    return (a) =>
      (w1 * Math.sin(2 * a + p1) + w2 * Math.sin(3 * a + p2) + w3 * Math.sin(5 * a + p3) + w4 * Math.sin(8 * a + p4)) / norm;
  }

  function lumpyRing(cx, cy, R, amp, n, shape) {
    const out = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU;
      const rr = R + amp * shape(a);
      out.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]);
    }
    return out;
  }

  // ---------------------------------------------------------------------------
  // G1: the hero cell (docs/storyboard.md, Shared geometry). 02, 03 and 11 land on these numbers.
  // ---------------------------------------------------------------------------

  const CX = 540;          // cell centre x
  const CY = 900;          // cell centre y
  const R0 = 380;          // mean membrane radius at rest
  const NR0 = 170;         // mean nuclear radius

  const MEM_SHAPE = lumpy(sd('membrane'));
  const NUC_SHAPE = lumpy(sd('nucleus'));

  // 40-point polyline, radius R + 14 * noise (storyboard G1). The wobble shape is fixed; only R breathes.
  const membranePts = (R) => lumpyRing(CX, CY, R, 14, 40, MEM_SHAPE);
  // the nucleus is a near-circle too, a little quieter than the membrane
  const nucleusPts = (R) => lumpyRing(CX, CY, R, 8, 32, NUC_SHAPE);

  // Four chromosomes, two pairs. Both members of a pair are the same length, width and colour; the
  // two pairs differ. Tilted 20 degrees, alternately left and right (storyboard G1). They are long
  // and thin here because the DNA has not been copied yet (art bible 10.2).
  const CHROMO = [
    { key: 'A1', c: [470, 850], len: 130, deg: -20, half: 10, fill: 'chromoA', deep: 'chromoADeep' },
    { key: 'A2', c: [610, 850], len: 130, deg: 20, half: 10, fill: 'chromoA', deep: 'chromoADeep' },
    { key: 'B1', c: [480, 955], len: 85, deg: -20, half: 8.5, fill: 'chromoB', deep: 'chromoBDeep' },
    { key: 'B2', c: [600, 955], len: 85, deg: 20, half: 8.5, fill: 'chromoB', deep: 'chromoBDeep' },
  ];

  // The nucleolus: a denser disc inside the nucleus (general cell biology), drawn under the
  // chromosomes so nothing in the count of four is hidden by it.
  const NUCLEOLUS = { x: 500, y: 870, r: 27 };

  // Six mitochondria, 60 by 28 px, at the storyboard's G1 positions. Rotations and sizes are
  // hand-set so no two lie parallel and none crowds the nucleus.
  const MITO = [
    { x: 300, y: 700, rot: 0.55, s: 1.0 },
    { x: 760, y: 720, rot: -0.5, s: 0.94 },
    { x: 280, y: 1060, rot: -0.35, s: 1.06 },
    { x: 790, y: 1080, rot: 0.62, s: 0.97 },
    { x: 420, y: 1190, rot: 0.15, s: 1.03 },
    { x: 660, y: 640, rot: -0.8, s: 0.92 },
  ];

  // Neighbour cells: partial circles cut by the frame edge, radius 300 to 360 (storyboard G1), drawn
  // in the same style but quiet, so the hero keeps the frame. They carry no chromosomes: the film
  // asks the viewer to count four, and four is all that may be countable.
  const NEIGH = [
    { x: 60, y: 380, r: 318, k: 1 },
    { x: 1020, y: 420, r: 330, k: 2 },
    { x: 40, y: 1420, r: 326, k: 3 },
    { x: 1040, y: 1400, r: 336, k: 4 },
    { x: 540, y: 1690, r: 344, k: 5 },
  ];

  // ---------------------------------------------------------------------------
  // Static geometry, built once. Everything here is strictly t-independent.
  // ---------------------------------------------------------------------------

  // A mitochondrion in its own coordinates: a 56 px rod bent 6 px so it reads as a bean, with the
  // convex side up (toward the light) and cristae folding in from alternate flanks.
  const MITO_GEO = (() => {
    const line = [];
    const N = 24;
    for (let i = 0; i <= N; i++) {
      const u = i / N - 0.5;
      line.push([u * 56, -6 * (1 - 4 * u * u) + 3]);
    }
    const centre = LIB.smoothPts(line, false, 2.5);
    const outline = rodPoly(centre, 12.5);
    // cristae: seven folds of the inner membrane, alternating sides, each crossing about 70 per cent
    const cristae = [];
    for (let j = 0; j < 7; j++) {
      const u = -0.33 + j * 0.11;
      const i = Math.round((u + 0.5) * (centre.length - 1));
      const p = centre[Math.min(centre.length - 1, Math.max(0, i))];
      const a = centre[Math.max(0, i - 2)], b = centre[Math.min(centre.length - 1, i + 2)];
      let tx = b[0] - a[0], ty = b[1] - a[1];
      const l = Math.hypot(tx, ty) || 1;
      tx /= l;
      ty /= l;
      const nx = -ty, ny = tx;
      const s = j % 2 ? 1 : -1;
      const w = 11.2;
      const o0 = [p[0] + nx * w * s, p[1] + ny * w * s];
      const o1 = [p[0] - nx * w * 0.36 * s + tx * 3.4 * s, p[1] - ny * w * 0.36 * s + ty * 3.4 * s];
      const mid = [(o0[0] + o1[0]) / 2 + tx * 2.8 * s, (o0[1] + o1[1]) / 2 + ty * 2.8 * s];
      cristae.push([o0, mid, o1]);
    }
    // the inner membrane runs just inside the outer one, so the folds have something to leave from
    const inner = rodPoly(centre, 9.6);
    return { centre, outline, inner, cristae };
  })();

  // Each neighbour cell: its wobbled membrane, a nucleus leaning toward the frame centre, a
  // nucleolus and two mitochondria, all fixed for the life of the film.
  const NEIGH_GEO = NEIGH.map((N) => {
    const seed = sd('neigh', N.k);
    const pts = lumpyRing(N.x, N.y, N.r, 15, 36, lumpy(seed));
    let dx = CX - N.x, dy = CY - N.y;
    const dl = Math.hypot(dx, dy) || 1;
    dx /= dl;
    dy /= dl;
    const nx = N.x + dx * N.r * 0.32;
    const ny = N.y + dy * N.r * 0.32;
    const nr = N.r * 0.28;
    const npts = lumpyRing(nx, ny, nr, 9, 26, lumpy(seed + 11));
    // the clip the interior work uses: pulled in so no stroke lands outside the wandering pen line
    const ptsIn = lumpyRing(N.x, N.y, N.r - 6, 15, 36, lumpy(seed));
    const r = LIB.rng(seed + 31);
    const mitos = [];
    // four mitochondria each, kept clear of the nucleus, so a neighbour reads as a working cell
    for (let j = 0; j < 4; j++) {
      let a = 0, rad = 0, px = 0, py = 0, tries = 0;
      do {
        a = r.range(0, TAU);
        rad = N.r * r.range(0.42, 0.72);
        px = N.x + Math.cos(a) * rad;
        py = N.y + Math.sin(a) * rad;
        tries++;
      } while (Math.hypot(px - nx, py - ny) < nr + 34 && tries < 8);
      mitos.push({ x: px, y: py, rot: r.range(-1.2, 1.2), s: 0.8 });
    }
    const nucleolus = { x: nx - nr * 0.26, y: ny - nr * 0.2, r: nr * 0.3 };
    return { N, pts, ptsIn, nx, ny, nr, npts, nucleolus, mitos };
  });

  // Registration crosses on the G1 points a later shot has to hit.
  const MARKS = (() => {
    const out = [[CX, CY], [NUCLEOLUS.x, NUCLEOLUS.y]];
    for (const c of CHROMO) out.push(c.c);
    for (const m of MITO) out.push([m.x, m.y]);
    out.push([CX - R0, CY], [CX + R0, CY], [CX, CY - R0], [CX, CY + R0]);
    return out;
  })();

  // Nuclear pores: short paired ticks straddling the nuclear membrane. Fixed angles, so they sit on
  // the rim wherever the rim's own wobble puts it.
  const PORE_A = (() => {
    const out = [];
    const r = LIB.rng(sd('pores'));
    for (let i = 0; i < 20; i++) out.push((i / 20) * TAU + r.range(-0.045, 0.045));
    return out;
  })();

  // ---------------------------------------------------------------------------
  // Chromosome threads
  // ---------------------------------------------------------------------------

  // A loose, uncondensed chromosome: a slack thread that drifts off its own axis. `k` is the drawing
  // index on twos, so the thread trembles twelve times a second and holds between.
  function wormCentre(c, len, deg, seed, k, trem) {
    const a = deg * DEG;
    const ca = Math.cos(a), sa = Math.sin(a);
    const N = 20;
    const raw = [];
    const off = (u) => len * 0.16 * LIB.noise1(u * 2.6 + 1.7, seed) + len * 0.07 * LIB.noise1(u * 6.1 + 0.3, seed + 3);
    const v0 = off(0);
    for (let i = 0; i <= N; i++) {
      const u = i / N - 0.5;
      const s = u * len;
      // the ends are free to swing, the middle barely moves: a thread, not a rigid bar
      const swing = trem * (0.35 + 1.5 * u * u);
      const v = off(u) - v0 + (LIB.h3(i * 7 + 1, k, seed) - 0.5) * 2 * swing;
      raw.push([c[0] + s * ca - v * sa, c[1] + s * sa + v * ca]);
    }
    return LIB.smoothPts(raw, false, 3);
  }

  function drawWorm(ctx, L, P, spec, seed, k, opts) {
    const o = opts || {};
    const alpha = o.alpha != null ? o.alpha : 1;
    const line = wormCentre(spec.c, spec.len, spec.deg, seed, k, o.trem != null ? o.trem : 2.6);
    const halfW = spec.half;
    const poly = rodPoly(line, halfW);
    const fill = P[spec.fill];
    const deep = P[spec.deep];
    ctx.save();
    ctx.globalAlpha *= alpha;
    // 1. the body, filled and outlined in one hand-inked pass
    L.inkPath(ctx, poly, {
      closed: true,
      width: o.line != null ? o.line : 2.4,
      color: P.ink,
      fill,
      seed: seed + 1,
      wobble: 0.9,
      tremble: 0.35,
      taper: [6, 10],
    });
    // 2. contour hatching across the tube, on the shadow flank only (art bible 4.1: cylinders)
    if (o.hatch !== false) {
      const a = spec.deg * DEG;
      const nx = -Math.sin(a), ny = Math.cos(a);
      const s = nx * 0.7071 + ny * 0.7071 >= 0 ? 1 : -1;
      const cx = spec.c[0], cy = spec.c[1];
      L.hatch(ctx, poly, {
        angle: a + Math.PI / 2,
        spacing: 6,
        width: 1.3,
        color: deep,
        alpha: 0.9,
        length: [5, 17],
        gap: [1.2, 3],
        inset: 1.2,
        overshoot: 1,
        bend: 1.4,
        seed: seed + 2,
        density: (x, y) => sstep(-0.2, 0.75, (s * ((x - cx) * nx + (y - cy) * ny)) / halfW),
      });
    }
    // 3. a chromatin line down the middle so the thread reads as coiled, not solid
    if (o.core !== false) {
      L.inkPath(ctx, line, {
        width: 1.5,
        color: deep,
        alpha: 0.5,
        seed: seed + 4,
        taper: [halfW * 1.8, halfW * 2.4],
        wobble: 0.6,
        swell: 0,
      });
    }
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // Mitochondria
  // ---------------------------------------------------------------------------

  // `plain` drops the cristae and the tone: the neighbours' mitochondria are only a hint of one.
  function drawMito(ctx, L, P, x, y, rot, seed, scale, plain) {
    const s = scale || 1;
    const ca = Math.cos(rot), sa = Math.sin(rot);
    const M = (p) => [x + (p[0] * ca - p[1] * sa) * s, y + (p[0] * sa + p[1] * ca) * s];
    const outline = MITO_GEO.outline.map(M);
    L.inkPath(ctx, outline, {
      closed: true,
      width: 2.8 * s,
      color: P.ink,
      fill: P.mito,
      seed: seed + 1,
      wobble: 0.9,
      tremble: 0.3,
      taper: [6, 10],
    });
    if (plain) {
      // one folded ridge, so even the small ones read as mitochondria and not as beans of jelly
      L.inkPath(ctx, MITO_GEO.cristae[3].map(M), {
        width: 1.8 * s,
        color: P.mitoDeep,
        alpha: 0.9,
        seed: seed + 9,
        taper: [2, 4],
        wobble: 0.4,
        step: 2,
      });
      return;
    }
    // the inner membrane, running just inside the outer one
    L.inkPath(ctx, MITO_GEO.inner.map(M), {
      closed: true,
      width: 1.5 * s,
      color: P.mitoDeep,
      alpha: 0.65,
      seed: seed + 2,
      wobble: 0.5,
      taper: [8, 14],
    });
    // cristae: the folded inner membrane, drawn as separate short strokes
    for (let j = 0; j < MITO_GEO.cristae.length; j++) {
      const c = MITO_GEO.cristae[j].map(M);
      L.inkPath(ctx, c, {
        width: 2.1 * s,
        color: P.mitoDeep,
        alpha: 1,
        seed: seed + 10 + j,
        taper: [2, 4],
        wobble: 0.4,
        swell: 0.12,
        step: 2,
      });
    }
    // tone: the lower-right half of the bean turns from the light
    L.hatch(ctx, outline, {
      angle: -Math.PI / 4,
      spacing: 4.4 * s,
      width: 1.2,
      color: P.mitoDeep,
      alpha: 0.85,
      length: [5, 15],
      gap: [1.5, 4],
      inset: 1.2,
      overshoot: 1,
      seed: seed + 3,
      density: (px, py) => sstep(-0.1, 0.9, ((px - x) * 0.7071 + (py - y) * 0.7071) / (14 * s)),
    });
  }

  // ---------------------------------------------------------------------------
  // Neighbour cells: the tissue the hero sits in
  // ---------------------------------------------------------------------------

  // one pen setting for every neighbour membrane, so the fill pass and the line pass coincide
  const NEIGH_PEN = { closed: true, width: 4.2, wobble: 3, wobbleFreq: 1 / 190, tremble: 0.5 };

  function drawNeighbour(ctx, L, P, G) {
    const seed = sd('neighdraw', G.N.k);
    const N = G.N;
    // 1. cytoplasm, filled along this cell's own inked outline
    L.inkPath(ctx, G.pts, Object.assign({ fill: P.neighbour, alpha: 0.001 }, NEIGH_PEN, { seed: seed + 6 }));
    // 2. a single band of tone near the rim, heavier on the lower right
    L.hatch(ctx, [G.ptsIn, G.npts], {
      angle: -Math.PI / 4,
      spacing: 12,
      width: 1.3,
      color: P.cytoHatch,
      alpha: 0.6,
      length: [14, 38],
      inset: 5,
      overshoot: 2,
      seed: seed + 1,
      density: (x, y) => {
        const d = Math.hypot(x - N.x, y - N.y) / N.r;
        const lit = ((x - N.x) + (y - N.y)) / (N.r * 1.414);
        return sstep(0.5, 0.99, d) * lerp(0.25, 1, sstep(-0.8, 0.8, lit));
      },
    });
    // 3. ribosomes, sparser than the hero's so the eye stays on the middle of the frame
    L.stipple(ctx, [G.ptsIn, G.npts], {
      spacing: 13,
      density: 0.2,
      r: [1.0, 1.9],
      color: P.ribosome,
      alpha: 0.6,
      seed: seed + 2,
    });
    // 4. two mitochondria, drawn plain
    for (let j = 0; j < G.mitos.length; j++) {
      const m = G.mitos[j];
      drawMito(ctx, L, P, m.x, m.y, m.rot, seed + 20 + j * 13, m.s, true);
    }
    // 5. nucleus: a soft disc with its own rim, chromatin texture, shading and an off-centre nucleolus
    L.inkPath(ctx, G.npts, {
      closed: true,
      width: 3.2,
      color: P.nucleusRim,
      alpha: 0.9,
      fill: P.neighbourNucleus,
      seed: seed + 3,
      wobble: 1.4,
    });
    L.stipple(ctx, G.npts, {
      spacing: 9,
      density: 0.26,
      r: [0.8, 1.4],
      color: P.nucleusDeep,
      alpha: 0.45,
      seed: seed + 7,
    });
    L.hatch(ctx, G.npts, {
      angle: -Math.PI / 4,
      spacing: 7.5,
      width: 1.25,
      color: P.nucleusDeep,
      alpha: 0.55,
      length: [8, 24],
      inset: 3,
      seed: seed + 4,
      density: (x, y) => sstep(-0.4, 0.95, ((x - G.nx) + (y - G.ny)) / (G.nr * 1.414)),
    });
    L.inkCircle(ctx, G.nucleolus.x, G.nucleolus.y, G.nucleolus.r, {
      width: 1.8,
      color: P.nucleusRim,
      alpha: 0.8,
      fill: P.nucleusDeep,
      fillAlpha: 0.85,
      seed: seed + 5,
      wobble: 0.8,
      ry: G.nucleolus.r * 0.9,
    });
    // 6. the membrane last, so it stays crisp over everything inside
    L.inkPath(ctx, G.pts, Object.assign({ color: P.ink, alpha: 0.82, double: { width: 0.3, offset: 3, alpha: 0.25 } }, NEIGH_PEN, { seed: seed + 6 }));
  }

  // ---------------------------------------------------------------------------
  // Construction geometry, in inkFaint, behind the hero cell
  // ---------------------------------------------------------------------------

  function drawConstruction(ctx, L, P) {
    const faint = { width: 1.5, color: P.inkFaint, alpha: 0.3, taper: [0, 0], wobble: 1.5, smooth: false, step: 9 };
    ctx.save();
    // the two 45 degree diameters, running well past the cell
    for (const a of [-Math.PI / 4, Math.PI / 4]) {
      const c = Math.cos(a), s = Math.sin(a);
      L.inkPath(ctx, [[CX - c * 640, CY - s * 640], [CX + c * 640, CY + s * 640]], Object.assign({ seed: sd('diag', a > 0 ? 1 : 0) }, faint));
    }
    // the upright and level axes, quieter still
    L.inkPath(ctx, [[CX, CY - 700], [CX, CY + 760]], Object.assign({}, faint, { seed: sd('axisV'), alpha: 0.2 }));
    L.inkPath(ctx, [[CX - 620, CY], [CX + 620, CY]], Object.assign({}, faint, { seed: sd('axisH'), alpha: 0.2 }));
    // a faint square around the cell, drawn as four separate pen strokes so the corners stay open
    const x0 = CX - R0, x1 = CX + R0, y0 = CY - R0, y1 = CY + R0;
    const sq = [
      [[x0, y0], [x1, y0]],
      [[x1, y0], [x1, y1]],
      [[x1, y1], [x0, y1]],
      [[x0, y1], [x0, y0]],
    ];
    for (let i = 0; i < 4; i++) L.inkPath(ctx, sq[i], Object.assign({ seed: sd('square', i) }, faint));
    // guide circles: the nucleus, and one wide circle the overlay ring sits inside
    L.guideCircle(ctx, CX, CY, NR0, { color: P.inkFaint, alpha: 0.3, width: 1.5, dash: [3, 8] });
    L.guideCircle(ctx, CX, CY, 600, { color: P.inkFaint, alpha: 0.2, width: 1.5 });
    // a degree scale over the top of the cell, as in the reference's cold open
    {
      const minor = new Path2D(), major = new Path2D();
      for (let a = -175; a <= -5; a += 5) {
        const c = Math.cos(a * DEG), s = Math.sin(a * DEG);
        const p = a % 15 === 0 ? major : minor;
        const len = a % 15 === 0 ? 18 : 9;
        p.moveTo(CX + c * R0, CY + s * R0);
        p.lineTo(CX + c * (R0 + len), CY + s * (R0 + len));
      }
      ctx.save();
      ctx.strokeStyle = P.inkFaint;
      ctx.lineCap = 'round';
      ctx.lineWidth = 1.5;
      ctx.globalAlpha = 0.34;
      ctx.stroke(minor);
      ctx.globalAlpha = 0.5;
      ctx.stroke(major);
      ctx.restore();
    }
    // registration crosses on the points a later shot must hit
    {
      const marks = new Path2D();
      for (const [x, y] of MARKS) {
        marks.moveTo(x - 9, y);
        marks.lineTo(x + 9, y);
        marks.moveTo(x, y - 9);
        marks.lineTo(x, y + 9);
      }
      ctx.save();
      ctx.strokeStyle = P.inkFaint;
      ctx.globalAlpha = 0.5;
      ctx.lineWidth = 1.5;
      ctx.stroke(marks);
      ctx.restore();
    }
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // Timing
  // ---------------------------------------------------------------------------

  const B_BREATH1 = 0.5;   // T 0.5, the beat: the big breath and the ring burst
  const B_BREATH2 = 1.0;   // T 1.0
  const B_BREATH3 = 1.5;   // T 1.5

  // A breath is a three-drawing pop with a small overshoot, then a two-drawing settle.
  const BREATH_PROFILE = [0.5, 1.0, 0.62, 0.24, 0.07];
  const BREATHS = [[B_BREATH1, 12], [B_BREATH2, 7], [B_BREATH3, 5]];

  function breathAt(t) {
    let v = 0;
    for (let i = 0; i < BREATHS.length; i++) {
      const a = BREATHS[i][0], amp = BREATHS[i][1];
      if (t < a - 1e-6) continue;
      const d = Math.floor((t - a) * 12 + 1e-6);
      if (d >= 0 && d < BREATH_PROFILE.length) v += amp * BREATH_PROFILE[d];
    }
    return v;
  }

  // ---------------------------------------------------------------------------
  // Overlays
  // ---------------------------------------------------------------------------

  // A ring leaving the nucleus. `delay` is in frames after the beat; the ring is drawn on the beat
  // frame itself, starting exactly on the nuclear rim.
  function burstRing(ctx, P, E, t, beat, color, delay, r0, r1, frames, fade, ticks, width) {
    const f = (t - beat) * 24 - delay;
    if (f < -1e-6 || f > fade + 2) return;
    const r = lerp(r0, r1, E.outExpo(clamp(f / frames)));
    const alpha = 1 - clamp((f - 2) / fade);
    if (alpha <= 0) return;
    const p = new Path2D();
    p.moveTo(CX + r, CY);
    p.arc(CX, CY, r, 0, TAU);
    if (ticks) {
      for (let q = 0; q < 4; q++) {
        const a = Math.PI / 4 + (q * Math.PI) / 2;
        p.moveTo(CX + Math.cos(a) * (r - 10), CY + Math.sin(a) * (r - 10));
        p.lineTo(CX + Math.cos(a) * (r + 10), CY + Math.sin(a) * (r + 10));
      }
    }
    ctx.save();
    ctx.lineCap = 'round';
    // an ink underlay so the ring still reads where it crosses the yellow stripes
    ctx.strokeStyle = P.ink;
    ctx.lineWidth = width + 3;
    ctx.globalAlpha = alpha * 0.22;
    ctx.stroke(p);
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.globalAlpha = alpha;
    ctx.stroke(p);
    ctx.restore();
  }

  function drawOverlays(ctx, L, P, E, t, R) {
    // 1. the annBlue ring band, radius 400 to 440, with four radial ties on the diagonals
    ctx.save();
    ctx.lineCap = 'round';
    ctx.strokeStyle = P.annBlue;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(CX, CY, 400, 0, TAU);
    ctx.stroke();
    ctx.globalAlpha = 0.55;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(CX, CY, 440, 0, TAU);
    ctx.stroke();
    const ties = new Path2D();
    for (let q = 0; q < 4; q++) {
      const a = Math.PI / 4 + (q * Math.PI) / 2;
      ties.moveTo(CX + Math.cos(a) * 400, CY + Math.sin(a) * 400);
      ties.lineTo(CX + Math.cos(a) * 440, CY + Math.sin(a) * 440);
    }
    ctx.globalAlpha = 0.8;
    ctx.lineWidth = 2;
    ctx.stroke(ties);
    // the origin mark where the band crosses the upright axis
    ctx.globalAlpha = 1;
    ctx.fillStyle = P.annBlue;
    ctx.beginPath();
    ctx.arc(CX, CY + 440, 4, 0, TAU);
    ctx.fill();
    ctx.restore();

    // 2. the annYellow 90 degree arc with its ruler, over the top of the cell
    const a0 = -135 * DEG, a1 = -45 * DEG;
    L.ticks(ctx, CX, CY, {
      r: 470,
      n: 19,
      start: a0,
      span: a1 - a0,
      len: 13,
      major: 3,
      majorLen: 30,
      color: P.annYellow,
      alpha: 1,
      width: 2.2,
    });
    L.arcAnnotation(ctx, CX, CY, 470, a0, a1, {
      color: P.annYellow,
      width: 2.5,
      endTicks: 12,
      alpha: 1,
    });
    // a dotted leader from the crown of the arc down to the crown of the membrane, so the ruler
    // reads as measuring this cell and not as decoration
    ctx.save();
    ctx.fillStyle = P.annYellow;
    ctx.beginPath();
    ctx.arc(CX, CY - 470, 5, 0, TAU);
    ctx.fill();
    const dots = new Path2D();
    for (let y = CY - 452; y < CY - R0 - 14; y += 15) {
      dots.moveTo(CX + 2.6, y);
      dots.arc(CX, y, 2.6, 0, TAU);
    }
    ctx.globalAlpha = 0.85;
    ctx.fill(dots);
    ctx.restore();

    // 3. the burst on the beat: magenta leads, yellow follows two frames later
    burstRing(ctx, P, E, t, B_BREATH1, P.annMagenta, 0, NR0, 520, 6, 12, false, 3);
    burstRing(ctx, P, E, t, B_BREATH1, P.annYellow, 2, NR0, 520, 6, 12, true, 3);
    // the smaller breaths carry a single quiet yellow echo each
    burstRing(ctx, P, E, t, B_BREATH2, P.annYellow, 0, NR0, 330, 5, 8, false, 2);
    burstRing(ctx, P, E, t, B_BREATH3, P.annYellow, 0, NR0, 320, 5, 8, false, 2);
  }

  // ---------------------------------------------------------------------------
  // The hero cell
  // ---------------------------------------------------------------------------

  // A band of tone in the intercellular space on the lower right of the hero, so the cell lifts off
  // the tissue behind it. Light comes from the upper left.
  function drawContactShade(ctx, L, P, R) {
    const inner = membranePts(R + 3);
    const outer = membranePts(R + 62);
    L.hatch(ctx, [outer, inner], {
      angle: -Math.PI / 4,
      spacing: 5,
      width: 1.4,
      color: P.paperDeep,
      alpha: 0.75,
      length: [8, 26],
      inset: 2,
      overshoot: 2,
      seed: sd('contact'),
      density: (x, y) => sstep(0.05, 0.85, ((x - CX) + (y - CY)) / (R * 1.414)),
    });
  }

  // The membrane is inked twice with the same seed, so both passes land on the same wandering line:
  // once under everything to lay the cytoplasm down inside the drawn outline, once on top.
  const MEM_PEN = {
    closed: true,
    width: 6,
    seed: sd('mem'),
    wobble: 4,
    wobbleFreq: 1 / 210,
    tremble: 0.7,
  };

  function drawHeroCell(ctx, L, P, R, k) {
    const mem = membranePts(R);
    // everything inside clips to a slightly tighter ring, so no hatch stroke can land outside the
    // wandering pen line
    const memIn = membranePts(R - 5);
    const nuc = nucleusPts(NR0);

    // 1. cytoplasm, filled along the membrane's own inked outline
    L.inkPath(ctx, mem, Object.assign({ color: P.membrane, fill: P.cytoplasm, alpha: 0.001 }, MEM_PEN));

    // 2. a very light overall tone across the whole cytoplasm, so the fill is never a flat plane
    L.hatch(ctx, [memIn, nuc], {
      angle: -Math.PI / 4,
      spacing: 16,
      width: 1.2,
      color: P.cytoHatch,
      alpha: 0.42,
      length: [20, 60],
      gap: [6, 18],
      inset: 8,
      seed: sd('cytoflat'),
      density: 0.55,
    });

    // 3. directional hatching near the membrane. Light falls from the upper left, so the band
    //    thickens around the lower right. The nucleus is a hole in the clip.
    L.hatch(ctx, [memIn, nuc], {
      angle: -Math.PI / 4,
      spacing: 7,
      width: 1.6,
      color: P.cytoHatch,
      alpha: 1,
      length: [14, 44],
      gap: [2, 7],
      inset: 5,
      overshoot: 2,
      seed: sd('cyto'),
      density: (x, y) => {
        const d = Math.hypot(x - CX, y - CY) / R;
        const lit = ((x - CX) + (y - CY)) / (R * 1.414);
        return sstep(0.32, 0.97, d) * lerp(0.3, 1, sstep(-0.85, 0.75, lit));
      },
    });
    // the cross layer, only in the deepest corner of the shadow
    L.hatch(ctx, [memIn, nuc], {
      angle: -Math.PI / 4 - Math.PI / 3,
      spacing: 7.5,
      width: 1.4,
      color: P.cytoHatch,
      alpha: 0.85,
      length: [10, 32],
      inset: 5,
      overshoot: 1,
      seed: sd('cyto2'),
      density: (x, y) => {
        const d = Math.hypot(x - CX, y - CY) / R;
        const lit = ((x - CX) + (y - CY)) / (R * 1.414);
        return sstep(0.44, 0.99, d) * sstep(0.1, 0.9, lit);
      },
    });
    // 4. ribosomes: fine stipple across the cytoplasm at the storyboard's density, boiling
    L.stipple(ctx, [memIn, nuc], {
      spacing: 6.8,
      density: 0.35,
      r: [0.8, 2.1],
      color: P.ribosome,
      alpha: 0.85,
      seed: sd('ribo'),
    });

    // 5. mitochondria, drifting a little with the breath so the inside of the cell feels alive
    const push = (R - R0) * 0.22;
    for (let i = 0; i < MITO.length; i++) {
      const m = MITO[i];
      const dx = m.x - CX, dy = m.y - CY;
      const dl = Math.hypot(dx, dy) || 1;
      const f = push * (dl / R0);
      drawMito(ctx, L, P, m.x + (dx / dl) * f, m.y + (dy / dl) * f, m.rot, sd('mito', i), m.s, false);
    }

    // 6. the nucleus: fill, chromatin stipple, shading that wraps the lower half
    fillPoly(ctx, nuc, P.nucleus);
    L.stipple(ctx, nuc, {
      spacing: 8,
      density: 0.3,
      r: [0.8, 1.5],
      color: P.nucleusDeep,
      alpha: 0.5,
      seed: sd('chromatin'),
    });
    L.crossHatch(ctx, nuc, {
      spacing: 6.5,
      crossSpacing: 8.5,
      width: 1.35,
      color: P.nucleusDeep,
      alpha: 0.66,
      layers: 2,
      length: [10, 30],
      gap: [2, 6],
      inset: 4,
      seed: sd('nucx'),
      density: (x, y) => sstep(-0.55, 0.95, ((x - CX) + (y - CY)) / (NR0 * 1.414)),
    });

    // 7. the nucleolus, a denser disc, drawn under the chromosomes so the count of four stays clear
    {
      const np = L.ellipsePts(NUCLEOLUS.x, NUCLEOLUS.y, NUCLEOLUS.r, NUCLEOLUS.r * 0.93, 28, 0.4);
      L.inkPath(ctx, np, {
        closed: true,
        width: 2.8,
        color: P.nucleusRim,
        alpha: 1,
        fill: P.nucleusDeep,
        seed: sd('nucleolus'),
        wobble: 1,
      });
      L.stipple(ctx, np, {
        spacing: 4.6,
        density: 0.55,
        r: [0.9, 1.6],
        color: P.nucleusRim,
        alpha: 0.5,
        seed: sd('nucleolusDots'),
      });
      // a single highlight crescent on the lit side
      ctx.save();
      ctx.beginPath();
      ctx.arc(NUCLEOLUS.x - 2, NUCLEOLUS.y - 2, NUCLEOLUS.r - 7, Math.PI * 1.05, Math.PI * 1.55);
      ctx.strokeStyle = P.nucleus;
      ctx.globalAlpha = 0.5;
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.stroke();
      ctx.restore();
    }

    // 8. the four chromosomes: two pairs, drawn every frame so the count can always be followed
    for (let i = 0; i < CHROMO.length; i++) {
      drawWorm(ctx, L, P, CHROMO[i], sd('chromo', CHROMO[i].key), k, {});
    }

    // 9. the nuclear membrane, over the chromosomes, 4 px inkSoft, with its pores
    L.inkPath(ctx, nuc, {
      closed: true,
      width: 4,
      color: P.nucleusRim,
      seed: sd('nucrim'),
      wobble: 1.3,
      double: { width: 0.34, offset: 3, alpha: 0.3 },
    });
    {
      const pores = new Path2D();
      for (let i = 0; i < PORE_A.length; i++) {
        const a = PORE_A[i];
        const rr = NR0 + 8 * NUC_SHAPE(a);
        const c = Math.cos(a), s = Math.sin(a);
        // a short bar across the rim at each pore, tangent to it
        pores.moveTo(CX + c * rr - s * 6, CY + s * rr + c * 6);
        pores.lineTo(CX + c * rr + s * 6, CY + s * rr - c * 6);
      }
      ctx.save();
      ctx.strokeStyle = P.nucleus;
      ctx.globalAlpha = 0.85;
      ctx.lineWidth = 3.6;
      ctx.lineCap = 'butt';
      ctx.stroke(pores);
      ctx.restore();
    }

    // 10. the cell membrane last: 6 px ink, one continuous line, with an occasional doubled retrace.
    //     The pen wanders 4 px either way over long arcs, so the boundary is drawn, never compassed.
    L.inkPath(ctx, mem, Object.assign({ color: P.membrane, double: { width: 0.25, offset: 3.5, alpha: 0.4 } }, MEM_PEN));
  }

  // ---------------------------------------------------------------------------
  // Scene
  // ---------------------------------------------------------------------------

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib;
      const P = L.pal;
      const E = L.ease;
      // a transition can ask for t past the end: hold the final pose
      const t = clamp(tIn, 0, info.dur);
      const k = Math.floor(t * 12 + 1e-6); // the drawing index: characters move on twos

      // --- 0. the cream paper plate. The stripes cover every pixel of it, so it is drawn through a
      //        one-pixel clip: what matters is that lib's cached paper canvas exists before any of
      //        this shot's line work. That cached plate is the page's first offscreen canvas, and
      //        Chromium rasterises the main canvas differently before and after one exists, so
      //        without this the shot drew one way cold and another way after the rest of the film.
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, 1, 1);
      ctx.clip();
      L.paper(ctx);
      ctx.restore();

      // --- 1. stripes, full bleed and screen-fixed, drifting 1 px per frame ---
      L.stripes(ctx, {
        colors: [P.stripeCream, P.stripeYellow],
        width: 140,
        angle: -0.52,
        offset: 24 * info.T,
        seed: sd('stripes'),
      });

      // --- camera: a locked push-in from zoom 1.00 to 1.04 that keeps the cell centre on (540, 900) ---
      const zoom = 1 + 0.04 * E.inOutSine(info.dur > 0 ? t / info.dur : 0);
      const cam = { x: CX, y: CY + 60 / zoom, zoom };

      // --- the breathing radius (frame 0 sits exactly on G1) ---
      const R = R0 + breathAt(t);

      L.camera(ctx, cam, (ctx) => {
        // --- 2. neighbour cells, behind everything, quiet ---
        ctx.save();
        ctx.globalAlpha = 0.62;
        for (let i = 0; i < NEIGH_GEO.length; i++) drawNeighbour(ctx, L, P, NEIGH_GEO[i]);
        ctx.restore();

        // --- 3. the hero's contact shade on the tissue ---
        drawContactShade(ctx, L, P, R);

        // --- 4. construction geometry, over the tissue and under the hero ---
        drawConstruction(ctx, L, P);

        // --- 5. the hero cell ---
        drawHeroCell(ctx, L, P, R, k);

        // --- 6. overlays ---
        drawOverlays(ctx, L, P, E, t, R);
      });

      // --- 7. the shared cycle glyph: screen-fixed, always the last thing drawn ---
      L.cycleGlyph(ctx, info.T, 'illustrated');
    },
  });
})();

</script>
<script>
// ---- src\scenes\02-cell-blueprint.js
// 02 cell-blueprint : "Inside — nucleus, 23 pairs, the cycle" (schematic, global T 2.0 to 4.5)
//
// The match cut from 01 lands on G1, so the cell outline, the nucleus, the four chromosomes, the
// six mitochondria and the neighbours are the storyboard's Shared geometry numbers, built with the
// wobble helpers 01-hero-cell.js publishes for its siblings (lumpy / lumpyRing / wormCentre, seeded
// LIB.hash('hero-cell', ...)), so the blueprint lands on the paper drawing's exact pixels.
// Camera locked at zoom 1; no text anywhere (art bible section 5).
//
// Layers, back to front:
//   1  near-black navyDeep, the dust the spark lights, then the blueprint plate fading in from T 2.25
//   2  guide geometry: circles r 470 and 640 at (540, 900) turning 6 degrees across the shot,
//      corner diagonals, construction axes, registration crosses, concentric cytoplasm arcs
//   3  measurement: height bracket x 900 (y 520 to 1280), width bracket y 1345 (x 160 to 920),
//      left tick scale x 60, an arc annotation on the nuclear rim — each popping on its own 16th
//   4  top specimen strip y 118 to 212: a row of cells in section, three of them mid-division
//   5  neighbour cells on G1, cut by the frame edges, lattice fragments below the safe area
//   6  the G1 cell: navy fill, ribosome stipple sweeping out, six mitochondria with cristae,
//      the double lavender outline drawing round from 12 o'clock
//   7  the nucleus: hex lattice at 18 px sweeping out from the centre, envelope with pore ticks,
//      the nucleolus, and the four lattice worm chromosomes (A long, B short) with glow-dot centres
//   8  the tally: 46 lineWhite ticks in 23 pairs along the r 300 arc, one magenta ring per pair
//   9  node glyphs: the nuclear envelope in section (left), one uncopied chromosome thread (right)
//  10  the opening spark, then the cycle glyph G5 (FILM.lib.cycleGlyph, the canonical helper)
//      arriving on T 4.0 behind a magenta ring
(function () {
  'use strict';

  const ID = 'cell-blueprint';
  const REF = 'hero-cell'; // G1 seeds come from shot 01, so the outline boils the same across the cut
  const TAU = Math.PI * 2;
  const DEG = Math.PI / 180;
  const FR = 1 / 24;

  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, u) => a + (b - a) * u;
  const sstep = (a, b, x) => {
    const u = clamp((x - a) / (b - a));
    return u * u * (3 - 2 * u);
  };

  // ---------------------------------------------------------------------------
  // Shared geometry G1 (docs/storyboard.md) — copied exactly
  // ---------------------------------------------------------------------------

  const CX = 540, CY = 900;
  const R_CELL = 380;  // mean radius, 40-point polyline with r = 380 + 14 * noise
  const R_NUC = 170;   // nucleus mean radius, same centre

  // Four chromosomes, two pairs: A long (130 px), B short (85 px); both members of a pair identical.
  // 20 degrees off horizontal, alternating left and right, so each pair mirrors about x = 540.
  const CHROMO = [
    { key: 'A1', x: 470, y: 850, len: 130, hw: 10.0, tilt: -20, pair: 0 },
    { key: 'A2', x: 610, y: 850, len: 130, hw: 10.0, tilt: 20, pair: 0 },
    { key: 'B1', x: 480, y: 955, len: 85, hw: 8.5, tilt: -20, pair: 1 },
    { key: 'B2', x: 600, y: 955, len: 85, hw: 8.5, tilt: 20, pair: 1 },
  ];

  // Six mitochondria, 60 by 28 px beans
  const MITO = [[300, 700], [760, 720], [280, 1060], [790, 1080], [420, 1190], [660, 640]];
  const MITO_W = 60, MITO_H = 28;

  // Nucleolus: the denser disc 01 draws at (500, 870), radius 27
  const NUCLEOLUS = [500, 870, 27];

  // Neighbour cells: partial circles cut by the frame edge, radius 300 to 360.
  // Centres, radii and the seed index k are 01's, so the field does not shift at the cut.
  const NEIGH = [
    [60, 380, 318, 1], [1020, 420, 330, 2], [40, 1420, 326, 3], [1040, 1400, 336, 4], [540, 1690, 344, 5],
  ];

  // The tally: 46 ticks in 23 pairs on an arc of radius 300 around the nucleus,
  // from 8 o'clock clockwise (over the top) to 4 o'clock — a 240 degree sweep.
  const TAL = { r: 300, a0: 150 * DEG, span: 240 * DEG, n: 23, gap: 3.5 * DEG, len: 21 };

  // Network node glyphs, 116 px across, inside the safe area
  const NODE_L = { cx: 182, cy: 1452, r: 58, sr: 36 };
  const NODE_R = { cx: 878, cy: 1452, r: 58, sr: 40 };

  // ---------------------------------------------------------------------------
  // Geometry, built once: a pure function of the constants above
  // ---------------------------------------------------------------------------

  function cumLen(pts) {
    const c = new Float64Array(pts.length);
