<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocab Match — Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: #faf8f5;
    color: #2d2a26;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
  }

  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    max-width: 600px;
    width: 100%;
    overflow: hidden;
  }

  .card-header {
    background: #dc2626;
    color: #fff;
    padding: 1.25rem 1.5rem;
  }
  .card-header h2 { font-size: 1.1rem; font-weight: 600; }
  .card-header p { font-size: 0.85rem; opacity: 0.85; margin-top: 0.25rem; }

  .card-body { padding: 1.5rem; }

  .match-area {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem 1.5rem;
  }

  .match-col { display: flex; flex-direction: column; gap: 0.625rem; }
  .match-col-label {
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #9a938b;
    margin-bottom: 0.25rem;
  }

  .match-item {
    padding: 0.75rem 1rem;
    border: 2px solid #e8e4df;
    border-radius: 12px;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.2s ease;
    user-select: none;
    -webkit-user-select: none;
    position: relative;
  }
  .match-item:hover { border-color: #c5bfb8; background: #fdfcfb; }
  .match-item.selected {
    border-color: #dc2626;
    background: #fef2f2;
    box-shadow: 0 0 0 3px rgba(220,38,38,0.12);
  }
  .match-item.correct {
    border-color: #16a34a;
    background: #f0fdf4;
    animation: matchPop 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .match-item.wrong {
    animation: shake 0.4s ease;
  }
  .match-item.matched {
    opacity: 0;
    transform: scale(0.9);
    pointer-events: none;
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes matchPop {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 1.25rem;
    padding-top: 1rem;
    border-top: 1px solid #f0ece7;
  }
  .status-bar .score {
    font-size: 0.9rem;
    font-weight: 600;
    color: #6b6560;
  }
  .status-bar .score span { color: #dc2626; }
  .status-bar .timer {
    font-size: 0.85rem;
    color: #9a938b;
    font-variant-numeric: tabular-nums;
  }

  .matched-pairs {
    margin-top: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .matched-pair {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.5rem 0.75rem;
    background: #f0fdf4;
    border-radius: 10px;
    font-size: 0.85rem;
    animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .matched-pair .tick {
    width: 20px; height: 20px;
    background: #16a34a;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 0.7rem; flex-shrink: 0;
  }
  .matched-pair .es { font-weight: 600; color: #dc2626; }
  .matched-pair .arrow { color: #9a938b; }
  .matched-pair .en { color: #2d2a26; }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .complete-msg {
    text-align: center;
    padding: 2rem 1rem;
    animation: slideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .complete-msg h3 { font-size: 1.2rem; color: #16a34a; margin-bottom: 0.5rem; }
  .complete-msg p { color: #6b6560; font-size: 0.9rem; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.6rem 1.25rem;
    border: none;
    border-radius: 10px;
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .btn-outline {
    background: #fff;
    color: #dc2626;
    border: 2px solid #dc2626;
  }
  .btn-outline:hover { background: #fef2f2; }

  .meta {
    max-width: 600px;
    width: 100%;
    margin-bottom: 1.5rem;
  }
  .meta h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.25rem; }
  .meta p { color: #6b6560; font-size: 0.9rem; }
  .badge {
    display: inline-block;
    padding: 0.2rem 0.6rem;
    background: #fef3c7;
    color: #b45309;
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: 600;
    margin-bottom: 0.75rem;
  }

  @media (max-width: 480px) {
    .match-area { gap: 0.5rem 0.75rem; }
    .match-item { padding: 0.6rem 0.75rem; font-size: 0.875rem; }
  }
</style>
</head>
<body>

<div class="meta">
  <span class="badge">BRONZE</span>
  <h1>vocab_match</h1>
  <p>Tap a Spanish word, then tap its English meaning. Matched pairs disappear.</p>
</div>

<div class="card">
  <div class="card-header">
    <h2>Match the vocabulary</h2>
    <p>Lesson 1 — Holidays and Travel Plans</p>
  </div>
  <div class="card-body">
    <div class="match-area">
      <div class="match-col" id="col-left">
        <div class="match-col-label">Spanish</div>
      </div>
      <div class="match-col" id="col-right">
        <div class="match-col-label">English</div>
      </div>
    </div>

    <div class="matched-pairs" id="matched-pairs"></div>

    <div class="status-bar">
      <div class="score">Matched: <span id="score">0</span> / <span id="total">0</span></div>
      <div class="timer" id="timer">0:00</div>
    </div>
  </div>
</div>

<script>
const PAIRS = [
  { es: 'las vacaciones', en: 'the holidays' },
  { es: 'la playa', en: 'the beach' },
  { es: 'el vuelo', en: 'the flight' },
  { es: 'el equipaje', en: 'the luggage' },
  { es: 'tomar el sol', en: 'to sunbathe' },
  { es: 'el alojamiento', en: 'the accommodation' },
];

let selectedLeft = null;
let selectedRight = null;
let matched = 0;
let startTime = Date.now();
let timerInterval;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function init() {
  const colL = document.getElementById('col-left');
  const colR = document.getElementById('col-right');
  document.getElementById('total').textContent = PAIRS.length;

  const leftOrder = shuffle(PAIRS);
  const rightOrder = shuffle(PAIRS);

  leftOrder.forEach(p => {
    const el = document.createElement('div');
    el.className = 'match-item';
    el.textContent = p.es;
    el.dataset.id = p.es;
    el.dataset.side = 'left';
    el.addEventListener('click', () => handleClick(el, 'left'));
    colL.appendChild(el);
  });

  rightOrder.forEach(p => {
    const el = document.createElement('div');
    el.className = 'match-item';
    el.textContent = p.en;
    el.dataset.id = p.es;
    el.dataset.side = 'right';
    el.addEventListener('click', () => handleClick(el, 'right'));
    colR.appendChild(el);
  });

  timerInterval = setInterval(updateTimer, 1000);
}

function handleClick(el, side) {
  if (el.classList.contains('matched')) return;

  if (side === 'left') {
    if (selectedLeft) selectedLeft.classList.remove('selected');
    selectedLeft = el;
    el.classList.add('selected');
  } else {
    if (selectedRight) selectedRight.classList.remove('selected');
    selectedRight = el;
    el.classList.add('selected');
  }

  if (selectedLeft && selectedRight) {
    checkMatch();
  }
}

function checkMatch() {
  const isCorrect = selectedLeft.dataset.id === selectedRight.dataset.id;

  if (isCorrect) {
    selectedLeft.classList.add('correct');
    selectedRight.classList.add('correct');

    const pair = PAIRS.find(p => p.es === selectedLeft.dataset.id);
    const l = selectedLeft;
    const r = selectedRight;

    setTimeout(() => {
      l.classList.add('matched');
      r.classList.add('matched');
      addMatchedPair(pair);
      matched++;
      document.getElementById('score').textContent = matched;

      if (matched === PAIRS.length) {
        clearInterval(timerInterval);
        showComplete();
      }
    }, 500);
  } else {
    selectedLeft.classList.add('wrong');
    selectedRight.classList.add('wrong');
    const l = selectedLeft;
    const r = selectedRight;
    setTimeout(() => {
      l.classList.remove('wrong', 'selected');
      r.classList.remove('wrong', 'selected');
    }, 500);
  }

  selectedLeft = null;
  selectedRight = null;
}

function addMatchedPair(pair) {
  const container = document.getElementById('matched-pairs');
  const div = document.createElement('div');
  div.className = 'matched-pair';
  div.innerHTML = `<div class="tick">&#10003;</div>
    <span class="es">${pair.es}</span>
    <span class="arrow">&rarr;</span>
    <span class="en">${pair.en}</span>`;
  container.appendChild(div);
}

function updateTimer() {
  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  const mins = Math.floor(elapsed / 60);
  const secs = String(elapsed % 60).padStart(2, '0');
  document.getElementById('timer').textContent = `${mins}:${secs}`;
}

function showComplete() {
  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  const mins = Math.floor(elapsed / 60);
  const secs = String(elapsed % 60).padStart(2, '0');
  const area = document.querySelector('.match-area');
  area.innerHTML = `<div class="complete-msg" style="grid-column:1/-1">
    <h3>All matched!</h3>
    <p>Completed in ${mins}:${secs}</p>
    <br>
    <button class="btn btn-outline" onclick="location.reload()">Try again</button>
  </div>`;
}

init();
</script>
</body>
</html>
