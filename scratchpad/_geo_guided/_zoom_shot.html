<!doctype html><meta charset="utf-8"><title>zoom shot</title>
<style>html,body{margin:0}iframe{border:0;display:block}</style>
<iframe id="f" src="/practice/geography-aqa/geographical-skills/11" style="width:390px;height:780px"></iframe>
<script>
var f=document.getElementById('f'),t=0;
function d(){return f.contentDocument;} function w(){return f.contentWindow;}
(function tick(){
  var ok=false;try{ok=typeof w().lightboxOpen==='function';}catch(e){}
  if(ok&&t>130){
    w().lightboxOpen('https://pub-aeb94e100e5a48f4a133be5bf206aecb.r2.dev/geography/os-maps/pendle-hill-z16-final.jpg');
    setTimeout(function(){
      var ov=d().querySelector('.lb-overlay');
      var inB=ov.querySelector('[data-act="in"]');
      inB.click();inB.click();inB.click();inB.click();
      setTimeout(function(){document.title='SHOT READY';},900);
    },1800);
    return;}
  if(t>700){document.title='TIMEOUT';return;}
  t++;setTimeout(tick,50);})();
</script>
