<!doctype html>
<meta charset="utf-8"><title>dark audit</title>
<pre id="log" style="font:11px ui-monospace,monospace"></pre>
<iframe id="f" src="/practice/geography-aqa/geographical-skills/8" style="width:1300px;height:900px"></iframe>
<script>
var L=document.getElementById('log'),f=document.getElementById('f'),t=0;
function d(){return f.contentDocument;} function w(){return f.contentWindow;}
function lum(c){var m=c.match(/\d+/g);if(!m)return null;var r=+m[0],g=+m[1],b=+m[2];
  var a=[r,g,b].map(function(v){v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);});
  return 0.2126*a[0]+0.7152*a[1]+0.0722*a[2];}
function ratio(f1,b1){var L1=lum(f1),L2=lum(b1);if(L1==null||L2==null)return null;
  var hi=Math.max(L1,L2),lo=Math.min(L1,L2);return +((hi+0.05)/(lo+0.05)).toFixed(2);}
(function tick(){
  var ok=false; try{ok=!!d().getElementById('dark-mode-toggle');}catch(e){}
  if(ok&&t>90){
    d().getElementById('dark-mode-toggle').click();
    setTimeout(function(){
      var sels=['.practice-score-bar','.score-bar-tier-badge','.score-bar-score','.score-bar-examples-btn',
                '.dark-mode-toggle','.lesson-pill','.guided-card','.guided-input','.guided-go',
                '.problem-input','.method-card','.practice-panel','.page-header','.bugr-fab','.sv-tour-replay'];
      var out=[];
      sels.forEach(function(s){
        var el=d().querySelector(s);
        if(!el){out.push(s+'  (absent)');return;}
        var cs=d().defaultView.getComputedStyle(el);
        var bg=cs.backgroundColor, fg=cs.color;
        out.push([s.padEnd(26), 'bg='+bg.padEnd(22), 'fg='+fg.padEnd(22), 'contrast='+ratio(fg,bg)].join(' '));
      });
      L.textContent=out.join(String.fromCharCode(10));
      document.title='AUDIT DONE';
    },900);
    return;
  }
  if(t>600){document.title='TIMEOUT';return;}
  t++;setTimeout(tick,50);
})();
</script>
