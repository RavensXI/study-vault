<!doctype html>
<meta charset="utf-8">
<title>L09 guided-walk driver</title>
<pre id="log">starting…</pre>
<iframe id="f" style="width:1200px;height:900px"></iframe>
<script>
// Drive any lesson: ?path=/practice/maths-edexcel/number/3 (default: the L09 pilot)
document.getElementById('f').src =
  new URLSearchParams(location.search).get('path') || '/practice/maths-edexcel/algebra/9';
</script>
<script>
var LOG = document.getElementById('log');
function log(m) { LOG.textContent += '\n' + m; }
var f = document.getElementById('f');

function until(name, cond, cb, tries) {
  tries = tries || 0;
  var ok = false;
  try { ok = cond(); } catch (e) { ok = false; }
  if (ok) { cb(); return; }
  if (tries > 900) { log('FAIL timeout: ' + name); document.title = 'DRIVER FAILED'; return; }
  setTimeout(function() { until(name, cond, cb, tries + 1); }, 50);
}

function doc() { return f.contentDocument; }
function win() { return f.contentWindow; }
function visible(el) { return el && el.style.display !== 'none'; }

// Walk a guided sequence; fills each new live box with the expected answer.
// wrongFirstOn: index to deliberately flub once (exercises the hint path).
function walk(name, stepsArr, wrongFirstOn, onButtons) {
  var wrongDone = false;
  function tick() {
    var rows = doc().querySelectorAll('#guided-steps .guided-step');
    var btns = doc().querySelectorAll('#guided-actions button');
    if (btns.length) { log('PASS ' + name + ' — walk complete, ' + btns.length + ' button(s)'); onButtons(btns); return; }
    if (!rows.length) { setTimeout(tick, 50); return; }
    var idx = rows.length - 1;
    var st = stepsArr[idx];
    if (!st) { setTimeout(tick, 50); return; }
    var row = rows[idx];
    var input = row.querySelector('.guided-input');
    if (st.answer === undefined || st.answer === null || !input) { setTimeout(tick, 60); return; }
    if (input.disabled) { setTimeout(tick, 60); return; }
    if (idx === wrongFirstOn && !wrongDone) {
      wrongDone = true;
      input.value = String(Number(st.answer) + 7);
      row.querySelector('.guided-go').click();
      var hint = row.querySelector('.guided-hint');
      if (hint && hint.style.display !== 'none') log('PASS ' + name + ' — hint shown on wrong try');
      else log('WARN ' + name + ' — no hint after wrong try (step ' + idx + ')');
      setTimeout(tick, 80);
      return;
    }
    input.value = String(st.answer);
    row.querySelector('.guided-go').click();
    setTimeout(tick, 80);
  }
  tick();
}

until('lesson + guided data loaded', function() {
  return win()._guided && doc().getElementById('guided-card') &&
         visible(doc().getElementById('guided-card'));
}, function() {
  log('PASS boot — guided opener visible, problem card hidden: ' +
      (doc().getElementById('current-problem-card').style.display === 'none'));

  // PHASE 1: coffee opener (hint path on step 0), ends at two doors
  walk('P1 opener', win()._guided.opener.steps, 0, function(btns) {
    if (btns.length !== 2) log('WARN P1 — expected 2 door buttons, got ' + btns.length);
    log('  doors: [' + btns[0].textContent + '] / [' + btns[1].textContent + ']');
    var openerDisp = doc().getElementById('guided-display').innerHTML;
    btns[0].click(); // Walk me through one

    // PHASE 2: bronze teaching walk (detected by the display changing)
    until('teach bronze shown', function() {
      return visible(doc().getElementById('guided-card')) &&
             doc().getElementById('guided-display').innerHTML !== openerDisp;
    }, function() {
      walk('P2 teach-bronze', win()._guided.teach.bronze.steps, -1, function(btns2) {
        btns2[0].click(); // Your turn →

        // PHASE 3: completion problem — first bank question arrives half-worked
        var q1 = win()._problemBank.bronze[0];
        until('completion card shown', function() {
          return visible(doc().getElementById('guided-card')) &&
                 doc().getElementById('guided-label').textContent.indexOf('finish it') !== -1;
        }, function() {
          var pre = doc().querySelectorAll('.guided-step-prefilled').length;
          log('PASS P3 — completion card shown, ' + pre + ' steps pre-worked: ' + q1.display.slice(6, 50));
          if (!pre) log('WARN P3 — expected pre-worked steps');
          walk('P3 completion', q1.guided_steps, -1, function(btns3) {
            btns3[0].click(); // Next problem →

            // PHASE 4: bare Q2 with the pre-answer walk link; get it wrong → rescue
            until('bare Q2', function() {
              return visible(doc().getElementById('current-problem-card')) &&
                     doc().getElementById('problem-number-label').textContent === 'Q2' &&
                     doc().querySelector('#problem-inputs-area .problem-input, #problem-inputs-area .mc-option');
            }, function() {
              var link = doc().getElementById('problem-walk-link');
              log('PASS P4 — Q2 bare, walk link visible: ' + (link && link.style.display !== 'none'));
              var p2 = win()._currentProblem;
              // Fill whatever inputs this problem type renders with a wrong value
              doc().querySelectorAll('#problem-inputs-area input:not([type=hidden])').forEach(function(inp) { inp.value = '999'; });
              var mc = doc().querySelector('#problem-inputs-area .mc-option');
              if (mc) mc.click();
              doc().getElementById('problem-check-btn').click();
              until('rescue link', function() { return doc().getElementById('fb-do-with-me'); }, function() {
                log('PASS P4 — wrong answer offers rescue');
                doc().getElementById('fb-do-with-me').click();
                until('rescue walk', function() { return visible(doc().getElementById('guided-card')); }, function() {
                  walk('P4 rescue', p2.guided_steps, -1, function(btns4) {
                    btns4[0].click();

                    // PHASE 5: Q3 — use the pre-answer walk link directly
                    until('bare Q3', function() {
                      return visible(doc().getElementById('current-problem-card')) &&
                             doc().getElementById('problem-number-label').textContent === 'Q3';
                    }, function() {
                      var p3 = win()._currentProblem;
                      var l3 = doc().getElementById('problem-walk-link');
                      if (!l3 || l3.style.display === 'none') { log('FAIL P5 — no walk link on Q3'); document.title = 'DRIVER FAILED'; return; }
                      l3.click();
                      until('pre-answer walk', function() { return visible(doc().getElementById('guided-card')); }, function() {
                        log('PASS P5 — pre-answer walk opened without failing first');
                        walk('P5 walk-instead', p3.guided_steps, -1, function(btns5) {
                          btns5[0].click();
                          until('advanced to Q4', function() {
                            return visible(doc().getElementById('current-problem-card')) &&
                                   doc().getElementById('problem-number-label').textContent === 'Q4';
                          }, function() {
                            log('PASS P5 — advanced to Q4');
                            log('ALL PHASES PASSED');
                            document.title = 'DRIVER DONE';
                          });
                        });
                      });
                    });
                  });
                });
              });
            });
          });
        });
      });
    });
  });
});
</script>
