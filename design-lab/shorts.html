<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StudyVault — Shorts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..800&family=Literata:ital,opsz,wght@0,7..72,400..600;1,7..72,400..500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f2efe9; --card:#ffffff; --ink:#1d1c1a; --sec:#54524d; --mut:#7f7c75; --line:#e7e3dc;
    --r:16px; --acc:#566a72;
    --font-head:'Schibsted Grotesk',system-ui,sans-serif;
    --font-read:'Literata',Georgia,serif;
    --shadow:0 1px 2px rgba(29,28,26,.05), 0 30px 60px -34px rgba(29,28,26,.55);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);font-family:var(--font-head);color:var(--ink);overscroll-behavior:none}

  /* soft brand rail top-left, doesn't fight the feed */
  .brand{position:fixed;top:14px;left:20px;z-index:30;font-family:var(--font-head);font-weight:500;font-size:1.05rem;color:var(--ink);opacity:.9;pointer-events:none}
  .brand b{font-weight:800}
  .brand .lock{display:inline-block;width:9px;height:11px;border:1.6px solid currentColor;border-radius:2px;position:relative;margin-left:1px;vertical-align:-1px}
  .brand .lock::before{content:"";position:absolute;left:1px;top:-4px;width:5px;height:5px;border:1.6px solid currentColor;border-bottom:none;border-radius:3px 3px 0 0}

  .feed{height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
  .feed::-webkit-scrollbar{display:none}
  .slide{height:100dvh;scroll-snap-align:start;display:grid;place-items:center;padding:2.4vh 1rem}

  /* ---- a short: framed portrait card floating on the warm ground ---- */
  .short{position:relative;height:100%;aspect-ratio:9/16;max-width:min(94vw,52vh);border-radius:var(--r);overflow:hidden;
    background:#0d0d0f;box-shadow:var(--shadow);border:1px solid color-mix(in srgb,var(--acc) 34%,var(--line))}
  .short video{width:100%;height:100%;object-fit:cover;display:block;background:#0d0d0f}
  .short .scrim{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(to top,rgba(0,0,0,.72) 0%,rgba(0,0,0,.18) 30%,transparent 52%,transparent 100%)}
  .short .prog{position:absolute;top:0;left:0;right:0;height:3px;background:rgba(255,255,255,.22)}
  .short .prog i{display:block;height:100%;width:0;background:var(--acc)}
  .short .meta{position:absolute;left:1rem;right:4rem;bottom:1.1rem;color:#fff}
  .short .subj{display:inline-flex;align-items:center;gap:.35rem;font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;
    background:color-mix(in srgb,var(--acc) 92%,#000);padding:.24rem .55rem;border-radius:6px;margin-bottom:.55rem}
  .short .topic{font-weight:700;font-size:1.2rem;line-height:1.14;text-shadow:0 1px 10px rgba(0,0,0,.55)}
  .short .lesson{font-family:var(--font-read);font-size:.82rem;color:rgba(255,255,255,.86);margin-top:.25rem;text-shadow:0 1px 8px rgba(0,0,0,.55)}
  .short .rail{position:absolute;right:.75rem;bottom:1.2rem;display:flex;flex-direction:column;gap:1rem;align-items:center}
  .railbtn{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.13);backdrop-filter:blur(7px);
    border:1px solid rgba(255,255,255,.22);color:#fff;display:grid;place-items:center;cursor:pointer;transition:transform .15s,background .15s}
  .railbtn:hover{background:rgba(255,255,255,.24);transform:scale(1.06)}
  .railbtn:active{transform:scale(.94)}
  .railbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .railbtn.on{background:var(--acc);border-color:var(--acc)}
  .rail small{display:block;text-align:center;font-size:.56rem;font-weight:600;color:rgba(255,255,255,.8);margin-top:.25rem;text-shadow:0 1px 4px rgba(0,0,0,.6)}
  .railwrap{display:flex;flex-direction:column;align-items:center}
  .tap-hint{position:absolute;inset:auto 0 42%;text-align:center;color:#fff;font-size:.8rem;opacity:0;transition:opacity .3s;pointer-events:none;text-shadow:0 1px 8px rgba(0,0,0,.6)}
  .short.muted .tap-hint{opacity:.9}

  /* ---- a recall check: native warm card in the same scroll ---- */
  .check{position:relative;height:100%;aspect-ratio:9/16;max-width:min(94vw,52vh);border-radius:var(--r);
    background:var(--card);box-shadow:var(--shadow);border:1px solid var(--line);
    display:flex;flex-direction:column;padding:1.9rem 1.5rem}
  .check .kick{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--acc);display:flex;align-items:center;gap:.4rem}
  .check .from{font-family:var(--font-read);font-size:.82rem;color:var(--mut);margin:.15rem 0 1.2rem}
  .check .q{font-family:var(--font-read);font-size:1.3rem;line-height:1.32;color:var(--ink);margin-bottom:1.3rem}
  .opt{font-family:var(--font-head);font-weight:500;font-size:.98rem;text-align:left;width:100%;background:var(--bg);
    border:1px solid var(--line);border-radius:11px;padding:.85rem .95rem;margin-bottom:.65rem;cursor:pointer;color:var(--ink);
    transition:border-color .15s,background .15s,transform .1s}
  .opt:hover{border-color:color-mix(in srgb,var(--acc) 45%,var(--line))}
  .opt:active{transform:scale(.99)}
  .opt.correct{border-color:#2f7d57;background:#edf6f0;color:#1e5b3e;font-weight:600}
  .opt.wrong{border-color:#c0533a;background:#fbeee9;color:#9a3a25}
  .check .foot{margin-top:auto;font-family:var(--font-read);font-size:.82rem;color:var(--mut);min-height:1.2em}
  .check .foot b{color:var(--ink)}
  .swipe{position:absolute;left:0;right:0;bottom:.7rem;text-align:center;font-size:.72rem;color:var(--mut);opacity:0;transition:opacity .3s}
  .check.answered .swipe{opacity:1}

  /* ---- done for today ---- */
  .done{height:100%;aspect-ratio:9/16;max-width:min(94vw,52vh);border-radius:var(--r);background:var(--card);
    box-shadow:var(--shadow);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:2rem;gap:.2rem}
  .done .flame{font-size:2.4rem}
  .done h2{font-family:var(--font-head);font-weight:800;font-size:1.6rem;margin:.4rem 0 .1rem;color:var(--ink)}
  .done p{font-family:var(--font-read);font-size:1rem;color:var(--sec);max-width:22ch;line-height:1.4;margin:.2rem 0 1.3rem}
  .done .stat{display:flex;gap:1.6rem;margin-bottom:1.6rem}
  .done .stat div{font-family:var(--font-head)} .done .stat b{display:block;font-size:1.5rem;font-weight:800;color:var(--acc)}
  .done .stat small{font-size:.72rem;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
  .done button{font-family:var(--font-head);font-weight:600;font-size:.92rem;background:transparent;color:var(--sec);border:1px solid var(--line);border-radius:10px;padding:.7rem 1.3rem;cursor:pointer}
</style>
</head>
<body>
  <div class="brand"><span>Study<b>Vault</b><span class="lock"></span></span></div>
  <div class="feed" id="feed"></div>

<script>
const MANIFEST = "/scripts/_shorts_manifest.json";
const CHECK_EVERY = 5;

const ICON = {
  book:'<svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16l-7-3-7 3z"/><path d="M18 3a2 2 0 0 1 2 2v14"/></svg>',
  save:'<svg viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>',
  mute:'<svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M22 9l-6 6M16 9l6 6"/></svg>',
  vol:'<svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M16 8a5 5 0 0 1 0 8M19 5a9 9 0 0 1 0 14"/></svg>',
};

function subjName(slug){
  return slug.replace(/^l12-/,'').replace(/-(aqa|ocr|edexcel|eduqas|wjec)$/,'')
    .split('-').map(w=>w[0].toUpperCase()+w.slice(1)).join(' ').replace(/\bAnd\b/,'&');
}
function accent(slug){ let h=0; for(const c of slug) h=(h*31+c.charCodeAt(0))>>>0; return `hsl(${h%360} 30% 40%)`; }
function titleCase(s){ return s.replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase()); }
// poster frame mirrors the R2 key under /design-lab/_posters/, .mp4 -> .jpg
function posterFor(url){ const m=url.split('.r2.dev/'); if(m.length<2) return ''; return '/design-lab/_posters/'+m[1].replace(/\.mp4$/,'.jpg'); }

// interleave shorts across subjects so the feed is mixed
function interleave(items){
  const by={}; items.forEach(e=>{ (by[e.subject]=by[e.subject]||[]).push(e); });
  const queues=Object.values(by); const out=[];
  while(queues.some(q=>q.length)) for(const q of queues) if(q.length) out.push(q.shift());
  return out;
}

// placeholder recall question (real ones get mapped from the lesson's QA'd bank later)
function sampleCheck(short){
  return { q:`Which of these is the key idea of “${short.topic}”?`,
    opts:['The correct exam-critical point from this short','A plausible-but-wrong distractor','Another distractor','A third distractor'],
    correct:0 };
}

let slides=[], current=-1;

function render(items){
  const feed=document.getElementById('feed');
  const mixed=interleave(items);
  let sinceCheck=0;
  mixed.forEach((s,i)=>{
    feed.appendChild(makeShort(s));
    if(++sinceCheck>=CHECK_EVERY && i<mixed.length-1){ feed.appendChild(makeCheck(mixed[i-2]||s)); sinceCheck=0; }
  });
  feed.appendChild(makeDone(mixed));
  slides=[].slice.call(feed.children);
  setupAutoplay();
}

function makeShort(s){
  const acc=accent(s.subject);
  const el=document.createElement('div'); el.className='slide';
  el.innerHTML=`<div class="short muted" style="--acc:${acc}">
    <video src="${s.url}" poster="${posterFor(s.url)}" muted loop playsinline preload="metadata"></video>
    <div class="scrim"></div>
    <div class="prog"><i></i></div>
    <div class="tap-hint">tap for sound</div>
    <div class="meta">
      <span class="subj">${subjName(s.subject)}</span>
      <div class="topic">${s.topic||titleCase(s.unit)}</div>
      <div class="lesson">${s.title} · Lesson ${s.lesson_number}</div>
    </div>
    <div class="rail">
      <div class="railwrap"><button class="railbtn r-lesson" title="Open the full lesson">${ICON.book}</button><small>Lesson</small></div>
      <div class="railwrap"><button class="railbtn r-save" title="Save to revise">${ICON.save}</button><small>Save</small></div>
      <div class="railwrap"><button class="railbtn r-mute" title="Sound">${ICON.mute}</button><small>Sound</small></div>
    </div>
  </div>`;
  const short=el.querySelector('.short'), vid=el.querySelector('video');
  vid.addEventListener('timeupdate',()=>{ if(vid.duration) el.querySelector('.prog i').style.width=(vid.currentTime/vid.duration*100)+'%'; });
  const unmute=()=>{ vid.muted=!vid.muted; short.classList.toggle('muted',vid.muted);
    const b=el.querySelector('.r-mute'); b.innerHTML=vid.muted?ICON.mute:ICON.vol; b.classList.toggle('on',!vid.muted); };
  vid.addEventListener('click',unmute); el.querySelector('.r-mute').addEventListener('click',e=>{e.stopPropagation();unmute();});
  el.querySelector('.r-save').addEventListener('click',e=>{e.stopPropagation();e.currentTarget.classList.toggle('on');});
  return el;
}

function makeCheck(s){
  const acc=accent(s.subject), c=sampleCheck(s);
  const el=document.createElement('div'); el.className='slide';
  el.innerHTML=`<div class="check" style="--acc:${acc}">
    <div class="kick">◆ Quick check</div>
    <div class="from">from a short you just watched — ${subjName(s.subject)} · ${s.topic}</div>
    <div class="q">${c.q}</div>
    <div class="opts">${c.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}</div>
    <div class="foot">Answer to keep your streak going.</div>
    <div class="swipe">swipe up to continue ↑</div>
  </div>`;
  const check=el.querySelector('.check');
  el.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
    if(check.classList.contains('answered'))return;
    check.classList.add('answered');
    const ok=+b.dataset.i===c.correct;
    b.classList.add(ok?'correct':'wrong');
    if(!ok) el.querySelector(`.opt[data-i="${c.correct}"]`).classList.add('correct');
    el.querySelector('.foot').innerHTML= ok?'<b>Nice — that one stuck.</b>':'<b>Worth another look.</b> This topic comes back soon.';
  }));
  return el;
}

function makeDone(mixed){
  const subs=new Set(mixed.map(m=>m.subject));
  const el=document.createElement('div'); el.className='slide';
  el.innerHTML=`<div class="done" style="--acc:${accent('geography-ocr')}">
    <div class="flame">🔥</div>
    <h2>Done for today</h2>
    <p>You revised ${mixed.length} topics across ${subs.size} subjects.</p>
    <div class="stat">
      <div><b>${mixed.length}</b><small>topics</small></div>
      <div><b>${subs.size}</b><small>subjects</small></div>
      <div><b>5</b><small>day streak</small></div>
    </div>
    <button onclick="document.getElementById('feed').scrollTo({top:0,behavior:'smooth'})">Keep going anyway →</button>
  </div>`;
  return el;
}

function setupAutoplay(){
  const io=new IntersectionObserver(es=>{
    es.forEach(e=>{
      const v=e.target.querySelector('video'); if(!v)return;
      if(e.isIntersecting && e.intersectionRatio>0.6){ v.play().catch(()=>{}); }
      else { v.pause(); v.currentTime=0; }
    });
  },{threshold:[0,0.6,1]});
  slides.forEach(s=>{ if(s.querySelector('video')) io.observe(s); });
}

// keyboard paging for desktop demo
addEventListener('keydown',e=>{
  const feed=document.getElementById('feed'); const h=innerHeight;
  if(['ArrowDown',' ','PageDown'].includes(e.key)){ e.preventDefault(); feed.scrollBy({top:h,behavior:'smooth'}); }
  if(['ArrowUp','PageUp'].includes(e.key)){ e.preventDefault(); feed.scrollBy({top:-h,behavior:'smooth'}); }
});

fetch(MANIFEST).then(r=>r.json()).then(m=>{
  if(!m.length){ document.getElementById('feed').innerHTML='<div class="slide"><div class="check"><div class="q">No shorts banked yet.</div></div></div>'; return; }
  render(m);
}).catch(err=>{ document.getElementById('feed').innerHTML='<div class="slide"><div class="check"><div class="q">Could not load shorts.</div></div></div>'; });
</script>
</body>
</html>
