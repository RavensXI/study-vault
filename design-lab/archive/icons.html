<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudyVault — subject icons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..800&family=Literata:opsz,wght@7..72,400..600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f7f6f4;--card:#fff;--ink:#1d1c1a;--soft:#54524d;--muted:#7f7c75;--line:#e6e4e0;
    --head:'Schibsted Grotesk',system-ui,sans-serif;--read:'Literata',Georgia,serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--read);-webkit-font-smoothing:antialiased}
  header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:1rem clamp(1rem,4vw,2rem);
    display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap}
  header h1{font-family:var(--head);font-size:1.15rem;font-weight:800;letter-spacing:-.02em}
  header p{font-family:var(--head);font-size:.85rem;color:var(--muted)}
  .controls{margin-left:auto;display:flex;gap:.4rem;align-items:center;font-family:var(--head);font-size:.82rem;color:var(--soft)}
  .controls button{font-family:var(--head);font-weight:600;font-size:.82rem;padding:.4rem .8rem;border:1px solid var(--line);
    background:var(--card);color:var(--soft);border-radius:6px;cursor:pointer}
  .controls button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1px;background:var(--line);
    border-bottom:1px solid var(--line)}
  .cell{background:var(--card);padding:1.1rem 1rem 1.2rem;display:flex;flex-direction:column;align-items:center;gap:.2rem}
  .pair{display:flex;align-items:center;gap:14px}
  .pair canvas{display:block;border-radius:8px}
  .sil{background:color-mix(in srgb,var(--ink) 3%,#fff)}
  .nm{font-family:var(--head);font-weight:700;font-size:.98rem;letter-spacing:-.01em;margin-top:.7rem;text-align:center;line-height:1.2}
  .meta{font-family:var(--head);font-size:.76rem;color:var(--muted);text-align:center}
  .shared{font-family:var(--read);font-style:italic;font-size:.74rem;color:var(--muted);text-align:center;margin-top:.15rem}
  .iconkey{font-family:var(--head);font-size:.66rem;color:#b8b2a8;letter-spacing:.08em;text-transform:uppercase;margin-top:.2rem}
  footer{padding:1.4rem 2rem 3rem;font-family:var(--head);font-size:.82rem;color:var(--muted);text-align:center}
</style>
</head>
<body>
<header>
  <h1>StudyVault subject icons</h1>
  <p id="count"></p>
  <div class="controls">
    <span>view</span>
    <button id="bDots" class="on" type="button">Floaty dots</button>
    <button id="bSil" type="button">Solid</button>
    <button id="bBoth" type="button">Both</button>
  </div>
</header>
<div class="grid" id="grid"></div>
<footer>Each subject pulled live from the catalogue · dot version ≈ 210 specks (how it reads in the hero) · edit any icon in <b>_icons.js</b> and both this sheet and the homepage update.</footer>

<script src="_icons.js"></script>
<script src="_catalogue.js"></script>
<script>
(function(){
  var grid=document.getElementById('grid');
  var DOTS=210, S=104, R=120;   // canvas render size

  // sample filled pixels of an icon → normalised points
  function sample(fn){var oc=document.createElement('canvas');oc.width=S;oc.height=S;var o=oc.getContext('2d');o.fillStyle='#000';fn(o,S);
    var d=o.getImageData(0,0,S,S).data,p=[];for(var y=0;y<S;y++)for(var x=0;x<S;x++){if(d[(y*S+x)*4+3]>128)p.push([x/S,y/S]);}
    for(var a=p.length-1;a>0;a--){var b=(Math.random()*(a+1))|0,tt=p[a];p[a]=p[b];p[b]=tt;}  // shuffle → no diagonal moiré on columns
    return p;}
  function key(s){ return (s.icon && ICON_DRAW[s.icon]) ? s.icon : '_default'; }

  // group subjects that SHARE an icon so the sheet shows "also: French, German…"
  var byIcon={};
  SUBJECTS.forEach(function(s){ var k=key(s); (byIcon[k]=byIcon[k]||[]).push(s); });

  // render one cell per SUBJECT (so every live subject is visible), noting shared icons
  SUBJECTS.forEach(function(s){
    var k=key(s), col=s.a||'#566a72';
    var cell=document.createElement('div'); cell.className='cell';

    var pair=document.createElement('div'); pair.className='pair';
    // silhouette
    var c1=document.createElement('canvas'); c1.className='sil silcv'; c1.width=c1.height=R;
    var x1=c1.getContext('2d'); x1.fillStyle=col; ICON_DRAW[k](x1,R);
    // dots
    var c2=document.createElement('canvas'); c2.className='dotcv'; c2.width=c2.height=R;
    var x2=c2.getContext('2d'); var pts=sample(ICON_DRAW[k]); x2.fillStyle=col;
    for(var i=0;i<DOTS;i++){var p=pts[Math.floor(i*pts.length/DOTS)%pts.length];if(!p)continue;
      x2.globalAlpha=0.88;x2.beginPath();x2.arc(p[0]*R+(Math.random()-.5)*2.2,p[1]*R+(Math.random()-.5)*2.2,2.2,0,6.2832);x2.fill();}
    pair.appendChild(c1); pair.appendChild(c2);
    cell.appendChild(pair);

    var nm=document.createElement('div'); nm.className='nm'; nm.textContent=s.n; cell.appendChild(nm);
    var meta=document.createElement('div'); meta.className='meta';
    meta.textContent=(s.boards?s.boards.join(' · '):'')+' · '+s.L+' lessons'; cell.appendChild(meta);
    var others=byIcon[k].filter(function(o){return o.k!==s.k;});
    if(others.length){ var sh=document.createElement('div'); sh.className='shared';
      sh.textContent='shares this icon with '+others.map(function(o){return o.n;}).join(', '); cell.appendChild(sh); }
    var ik=document.createElement('div'); ik.className='iconkey'; ik.textContent=k; cell.appendChild(ik);
    grid.appendChild(cell);
  });

  document.getElementById('count').textContent=SUBJECTS.length+' subjects · '+Object.keys(byIcon).length+' distinct icons';

  // view toggle
  function setView(mode){
    document.querySelectorAll('.silcv').forEach(function(c){c.style.display=(mode==='sil'||mode==='both')?'':'none';});
    document.querySelectorAll('.dotcv').forEach(function(c){c.style.display=(mode==='dots'||mode==='both')?'':'none';});
    [['bDots','dots'],['bSil','sil'],['bBoth','both']].forEach(function(p){document.getElementById(p[0]).classList.toggle('on',p[1]===mode);});
  }
  document.getElementById('bDots').onclick=function(){setView('dots');};
  document.getElementById('bSil').onclick=function(){setView('sil');};
  document.getElementById('bBoth').onclick=function(){setView('both');};
  setView('dots');
})();
</script>
</body>
</html>
