<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyVault — background layer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f7f6f4;--ink:#1d1c1a;--soft:#54524d;--line:#e6e4e0;--accent:#3f5e78}
body{font-family:'Schibsted Grotesk',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}

/* dev toolbar (localhost only) */
.devbar{position:fixed;top:0;left:0;right:0;z-index:9999;display:flex;align-items:center;gap:.7rem;
  background:#100d16;color:#cfc9d6;padding:.5rem .9rem;font:600 12px/1 'Schibsted Grotesk'}
.devbar b{color:#e8623a;letter-spacing:.12em;text-transform:uppercase;margin-right:.5rem}
.devbar button{font:inherit;cursor:pointer;background:#241f2e;color:#cfc9d6;border:1px solid #3a3346;border-radius:7px;padding:.4rem .75rem}
.devbar button:hover{color:#fff;border-color:#6a6253}
.devbar button.on{background:#e8623a;color:#fff;border-color:#e8623a}
.devbar input[type=range]{width:120px}
.devbar .hint{margin-left:auto;color:#7d7689;font-weight:500}

/* the long scrollable canvas */
.page{position:relative;width:100%;max-width:1280px;margin:0 auto;min-height:3000px;padding-top:3rem}

/* ---- LAYER 1: the hand-sketched background (Tom's sketches) ---- */
.bg{position:absolute;inset:0;z-index:1;overflow:visible}
.doodle{position:absolute;transform-origin:center;opacity:.6;-webkit-user-select:none;user-select:none}
.doodle img{display:block;width:100%;height:auto;pointer-events:none}
body.drag .doodle{cursor:grab;outline:1px dashed rgba(63,94,120,.45);outline-offset:5px}
body.drag .doodle:active{cursor:grabbing}
body:not(.drag) .bg{pointer-events:none}

/* ---- LAYER 2 placeholder: where content will sit on top (faint guides) ---- */
.content{position:relative;z-index:2;pointer-events:none}
.zone{margin:0 1.5rem;border:1.5px dashed rgba(63,94,120,.26);border-radius:16px;display:flex;align-items:center;justify-content:center;
  flex-direction:column;color:rgba(63,94,120,.5);font-weight:700;font-size:.9rem;letter-spacing:.06em;text-transform:uppercase;background:rgba(247,246,244,.25)}
.zone small{text-transform:none;letter-spacing:0;font-weight:500;font-size:.78rem;color:rgba(63,94,120,.38);margin-top:.3rem}
.z-hero{height:560px;margin-top:2rem}
.z-subj{height:620px;margin-top:1.5rem}
.z-inside{height:560px;margin-top:1.5rem}
.z-cta{height:340px;margin-top:1.5rem;margin-bottom:3rem}
</style>
</head>
<body>
<nav class="devbar">
  <b>BG layer</b>
  <button id="dragBtn">Drag to position</button>
  <button id="exportBtn">Copy positions</button>
  <label style="display:flex;align-items:center;gap:.4rem">opacity <input type="range" id="opa" min="20" max="100" value="60"></label>
  <span class="hint">your sketches, scattered — drag to reposition, then "Copy positions"</span>
</nav>

<div class="page">
  <!-- LAYER 1 — Tom's hand-drawn sketches, scattered down the scroll -->
  <div class="bg" id="bg">
    <div class="doodle" data-id="timetable"   style="left:1.5%;top:110px;width:226px;transform:rotate(-5deg)"><img src="sketches/cut/timetable.png" alt=""></div>
    <div class="doodle" data-id="mindmap"      style="left:70%;top:80px;width:286px;transform:rotate(4deg)"><img src="sketches/cut/mindmap.png" alt=""></div>
    <div class="doodle" data-id="pen"          style="left:38%;top:64px;width:52px;transform:rotate(24deg)"><img src="sketches/cut/pen.png" alt=""></div>
    <div class="doodle" data-id="paperclips"   style="left:55%;top:250px;width:90px;transform:rotate(0deg)"><img src="sketches/cut/paperclips.png" alt=""></div>
    <div class="doodle" data-id="flashcards"   style="left:2%;top:540px;width:196px;transform:rotate(-9deg)"><img src="sketches/cut/flashcards.png" alt=""></div>
    <div class="doodle" data-id="highlighters" style="left:82%;top:510px;width:122px;transform:rotate(7deg)"><img src="sketches/cut/highlighters.png" alt=""></div>
    <div class="doodle" data-id="highlighter"  style="left:57%;top:470px;width:86px;transform:rotate(-12deg)"><img src="sketches/cut/highlighter.png" alt=""></div>
    <div class="doodle" data-id="eraser"       style="left:22%;top:820px;width:78px;transform:rotate(-4deg)"><img src="sketches/cut/eraser.png" alt=""></div>
    <div class="doodle" data-id="compass"      style="left:88%;top:800px;width:68px;transform:rotate(11deg)"><img src="sketches/cut/compass.png" alt=""></div>
    <div class="doodle" data-id="scissors"     style="left:44%;top:1080px;width:66px;transform:rotate(9deg)"><img src="sketches/cut/scissors.png" alt=""></div>
    <div class="doodle" data-id="notebook"     style="left:5%;top:1180px;width:116px;transform:rotate(-3deg)"><img src="sketches/cut/notebook.png" alt=""></div>
    <div class="doodle" data-id="ruler"        style="left:80%;top:1160px;width:108px;transform:rotate(24deg)"><img src="sketches/cut/ruler.png" alt=""></div>
    <div class="doodle" data-id="pencil"       style="left:92%;top:1500px;width:50px;transform:rotate(16deg)"><img src="sketches/cut/pencil.png" alt=""></div>
    <div class="doodle" data-id="gluestick"    style="left:2.5%;top:1580px;width:58px;transform:rotate(0deg)"><img src="sketches/cut/gluestick.png" alt=""></div>
    <div class="doodle" data-id="stapler"      style="left:73%;top:1680px;width:112px;transform:rotate(-7deg)"><img src="sketches/cut/stapler.png" alt=""></div>
    <div class="doodle" data-id="calculator"   style="left:12%;top:2060px;width:96px;transform:rotate(5deg)"><img src="sketches/cut/calculator.png" alt=""></div>
    <div class="doodle" data-id="stickynotes"  style="left:78%;top:2120px;width:190px;transform:rotate(-4deg)"><img src="sketches/cut/stickynotes.png" alt=""></div>
    <div class="doodle" data-id="flashcards2"  style="left:6%;top:2520px;width:128px;transform:rotate(8deg)"><img src="sketches/cut/flashcards2.png" alt=""></div>
  </div>

  <!-- LAYER 2 — where content will be layered later (guides only) -->
  <div class="content">
    <div class="zone z-hero">HERO<small>headline · CTA · laptop + phone mockup (layer on top)</small></div>
    <div class="zone z-subj">YOUR SUBJECTS<small>subject grid</small></div>
    <div class="zone z-inside">WHAT'S INSIDE<small>feature cards</small></div>
    <div class="zone z-cta">CLOSING CTA + FOOTER</div>
  </div>
</div>

<script>
(function(){
  if(location.hostname!=='127.0.0.1'&&location.hostname!=='localhost')return;
  var body=document.body, dragBtn=document.getElementById('dragBtn'), exportBtn=document.getElementById('exportBtn'), opa=document.getElementById('opa');
  var dragging=null, sx=0, sy=0, ox=0, oy=0;
  dragBtn.addEventListener('click',function(){body.classList.toggle('drag');dragBtn.classList.toggle('on',body.classList.contains('drag'));});
  opa.addEventListener('input',function(){[].forEach.call(document.querySelectorAll('.doodle'),function(d){d.style.opacity=opa.value/100;});});
  document.getElementById('bg').addEventListener('mousedown',function(e){
    if(!body.classList.contains('drag'))return;
    var d=e.target.closest('.doodle'); if(!d)return;
    e.preventDefault(); dragging=d;
    sx=e.clientX; sy=e.clientY; ox=d.offsetLeft; oy=d.offsetTop;
  });
  window.addEventListener('mousemove',function(e){
    if(!dragging)return;
    var pgW=document.querySelector('.page').offsetWidth;
    dragging.style.left=((ox+(e.clientX-sx))/pgW*100).toFixed(2)+'%';
    dragging.style.top=Math.round(oy+(e.clientY-sy))+'px';
  });
  window.addEventListener('mouseup',function(){dragging=null;});
  exportBtn.addEventListener('click',function(){
    var out=[].slice.call(document.querySelectorAll('.doodle')).map(function(d){
      var m=(d.style.transform||'').match(/-?\d+(\.\d+)?/);
      return {id:d.dataset.id,left:d.style.left,top:d.style.top,width:d.style.width,rot:(m?m[0]:'0')+'deg'};
    });
    var txt=JSON.stringify(out,null,2);
    if(navigator.clipboard)navigator.clipboard.writeText(txt);
    console.log('[bg positions]\n'+txt);
    exportBtn.textContent='Copied! ('+out.length+')'; setTimeout(function(){exportBtn.textContent='Copy positions';},1600);
  });
})();
</script>
</body>
</html>
