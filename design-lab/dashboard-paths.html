<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudyVault — your revision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..800&family=Literata:opsz,wght@7..72,400..600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-body:#f7f6f4; --bg-card:#fff; --text-primary:#1d1c1a; --text-secondary:#54524d; --text-muted:#6e6b64;
    --border-light:#e6e4e0; --border-lighter:#f0eeea; --anchor:#566a72; --wash:#f1efec;
    --acc:#368352; --acc-mute:#5d8a6e;
    --font-head:'Schibsted Grotesk',system-ui,sans-serif; --font-read:'Literata',Georgia,serif;
    --r:6px; --ease:cubic-bezier(.22,1,.36,1);
    --shadow-sm:0 1px 2px rgba(29,28,26,.05);
    --shadow-md:0 2px 4px -2px rgba(29,28,26,.10),0 10px 24px -14px rgba(29,28,26,.16);
    --shadow-lg:0 6px 14px -8px rgba(29,28,26,.18),0 24px 48px -28px rgba(29,28,26,.28);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg-body);color:var(--text-primary);font-family:var(--font-read);-webkit-font-smoothing:antialiased;line-height:1.5}
  h1,h2,h3,.ui,button,nav,.kicker,label,input{font-family:var(--font-head)}
  button{cursor:pointer}
  .wrap{max-width:1200px;margin:0 auto;padding:0 clamp(1rem,4vw,2.25rem)}

  /* masthead */
  .mast{display:flex;align-items:center;justify-content:space-between;gap:1rem;height:64px;border-bottom:1px solid var(--border-light);
    position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg-body) 88%,transparent);backdrop-filter:saturate(1.05) blur(7px)}
  .brand{display:inline-flex;align-items:baseline;font-family:var(--font-head);font-weight:500;font-size:1.12rem;letter-spacing:-.012em}
  .brand b{font-weight:800}
  .brand .sv-lock{height:.28em;width:.225em;margin-left:.04em;align-self:baseline;fill:currentColor;flex:none}
  .mast .right{display:flex;align-items:center;gap:.7rem}
  .chip{display:inline-flex;align-items:center;gap:.4rem;white-space:nowrap;font-family:var(--font-head);font-size:.8rem;font-weight:600;color:var(--text-secondary);
    background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--r);padding:.34rem .7rem}
  @media(max-width:620px){ .mast .right #examChip{display:none} }
  @media(max-width:420px){ .mast .right .chip{display:none} }
  .chip svg{width:14px;height:14px;color:var(--text-muted)}
  .chip b{color:var(--text-primary);font-weight:700}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--anchor);color:#fff;font-family:var(--font-head);font-weight:700;font-size:.85rem;display:grid;place-items:center;cursor:pointer}

  /* greeting */
  .hello{margin:1.5rem 0 1rem}
  .hello h1{font-size:clamp(1.5rem,2.6vw,1.95rem);font-weight:700;letter-spacing:-.02em}
  .hello p{font-family:var(--font-read);color:var(--text-secondary);font-size:1rem;margin-top:.2rem}

  /* layout */
  .layout{display:grid;grid-template-columns:340px 1fr;gap:1.1rem;align-items:start}
  @media(max-width:900px){ .layout{grid-template-columns:1fr} }
  .card{background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--r);box-shadow:var(--shadow-sm)}
  .col-left{display:flex;flex-direction:column;gap:1.1rem}

  /* continue card */
  .cont{padding:1rem 1.05rem 1.1rem}
  .cont .lbl{font-family:var(--font-head);text-transform:uppercase;letter-spacing:.1em;font-size:.64rem;font-weight:700;color:var(--text-muted);margin-bottom:.7rem}
  .cont .row{display:flex;align-items:center;gap:.7rem}
  .cont .ic{width:44px;height:44px;flex:none;border-radius:5px;display:grid;place-items:center;background:var(--border-lighter)}
  .cont .meta{min-width:0;flex:1}
  .cont .subj{display:block;font-family:var(--font-head);text-transform:uppercase;letter-spacing:.09em;font-size:.62rem;font-weight:700;color:var(--text-muted)}
  .cont .ttl{display:block;font-family:var(--font-read);font-weight:600;font-size:1.05rem;line-height:1.3;color:var(--text-primary);margin-top:.2rem}
  .cont .unit{display:block;font-family:var(--font-head);font-size:.74rem;color:var(--text-muted);margin-top:.32rem}
  .cont .bar{height:4px;border-radius:3px;background:var(--border-lighter);margin:.85rem 0 .9rem;overflow:hidden}
  .cont .bar i{display:block;height:100%;background:var(--anchor);border-radius:3px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;width:100%;padding:.62rem 1rem;border:none;border-radius:var(--r);
    background:var(--anchor);color:#fff;font-family:var(--font-head);font-weight:600;font-size:.95rem;box-shadow:var(--shadow-sm);transition:filter .18s,box-shadow .18s}
  .btn:hover{filter:brightness(.94);box-shadow:var(--shadow-md)}
  .btn svg{width:16px;height:16px;transition:transform .25s var(--ease)}
  .btn:hover svg{transform:translateX(3px)}

  /* ===== navigator (left rail) ===== */
  .nav{padding:.55rem .6rem .55rem}
  .nav-head{display:flex;justify-content:space-between;align-items:baseline;padding:.45rem .55rem .55rem;border-bottom:1px solid var(--border-lighter)}
  .nav-head .kicker{font-family:var(--font-head);text-transform:uppercase;letter-spacing:.1em;font-size:.64rem;font-weight:700;color:var(--text-muted)}
  .nav-head .tally{font-family:var(--font-head);font-size:.72rem;font-weight:600;font-variant-numeric:tabular-nums;color:var(--text-muted)}
  .nav-head .tally b{color:var(--text-secondary);font-weight:700}
  .nav-list{display:flex;flex-direction:column;padding-top:.2rem}
  .srow{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:.6rem;width:100%;padding:.55rem .55rem;border:0;background:transparent;border-radius:var(--r);text-align:left;cursor:pointer;transition:background .14s ease}
  .srow .sw{width:9px;height:9px;border-radius:50%;background:var(--acc);opacity:.82;transition:transform .2s var(--ease),opacity .2s ease}
  .srow .nm{font-family:var(--font-head);font-size:.92rem;font-weight:500;letter-spacing:-.005em;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .14s ease}
  .srow .ct{font-family:var(--font-head);font-size:.8rem;font-variant-numeric:tabular-nums;color:var(--text-muted)}
  .srow .ct b{color:var(--text-primary);font-weight:600}
  .srow .cv{width:13px;height:13px;color:var(--text-muted);transition:transform .3s var(--ease),color .14s ease}
  .srow:hover,.srow:focus-visible{background:var(--wash);outline:none}
  .srow:hover .nm,.srow[aria-expanded="true"] .nm,.srow.is-active .nm{color:var(--text-primary);font-weight:600}
  .srow:hover .sw,.srow[aria-expanded="true"] .sw,.srow.is-active .sw{opacity:1;transform:scale(1.14)}
  .srow[aria-expanded="true"] .cv{transform:rotate(90deg);color:var(--text-secondary)}
  .srow.is-active{background:var(--wash)}
  .srow:focus-visible{outline:2px solid var(--anchor);outline-offset:-2px}

  .units{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .4s var(--ease),visibility 0s linear .4s}
  .srow[aria-expanded="true"]+.units{grid-template-rows:1fr;visibility:visible;transition:grid-template-rows .4s var(--ease),visibility 0s}
  .units>.inner{overflow:hidden;min-height:0;opacity:0;transition:opacity .26s ease .04s;padding:.05rem 0 .3rem}
  .srow[aria-expanded="true"]+.units>.inner{opacity:1}
  .urow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:.4rem;width:100%;padding:.4rem .55rem .4rem 1.5rem;border:0;background:transparent;border-radius:var(--r);text-align:left;cursor:pointer;
    transform:translateY(3px);opacity:0;transition:opacity .24s ease,transform .3s var(--ease),background .14s ease}
  .srow[aria-expanded="true"]+.units .urow{opacity:1;transform:none;transition-delay:calc(var(--i)*22ms)}
  .urow .un{font-family:var(--font-read);font-size:.84rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-secondary);transition:color .14s ease}
  .urow .up{font-family:var(--font-head);font-size:.7rem;font-variant-numeric:tabular-nums;color:var(--text-muted)}
  .urow:hover,.urow:focus-visible{background:var(--wash);outline:none}
  .urow:hover .un,.urow.is-active .un{color:var(--text-primary)}
  .urow.is-active{background:var(--wash)}
  .urow.is-active .un{font-weight:600}
  .urow:focus-visible{outline:2px solid var(--anchor);outline-offset:-2px}
  .nav-loading{padding:1.1rem .55rem;font-family:var(--font-head);font-size:.84rem;color:var(--text-muted)}

  /* ===== stage (right) ===== */
  .stage{position:relative;min-height:620px}
  .screen{overflow:hidden}   /* clip the entrance slide, not the stage (keeps the sticky crumbs in flow) */
  .crumbs{display:flex;align-items:center;gap:.35rem;flex-wrap:wrap;padding:.95rem 1.15rem;border-bottom:1px solid var(--border-lighter);
    position:sticky;top:64px;background:color-mix(in srgb,var(--bg-card) 92%,transparent);backdrop-filter:blur(6px);z-index:8;min-height:48px}
  .crumbs a,.crumbs span{font-family:var(--font-head);font-size:.82rem;font-weight:600;color:var(--text-muted);text-decoration:none}
  .crumbs a{cursor:pointer}
  .crumbs a:hover{color:var(--text-primary)}
  .crumbs .sep{color:var(--border-light);font-weight:400}
  .crumbs .here{color:var(--text-primary)}
  .crumbs .swatch{width:9px;height:9px;border-radius:50%;background:var(--acc);margin-right:.15rem}
  .crumbs .right{margin-left:auto;display:flex;align-items:center;gap:.5rem}

  .screen{padding:1.15rem 1.15rem 1.5rem}
  .screen[hidden]{display:none}
  .screen.in{animation:screenIn .42s var(--ease)}
  @keyframes screenIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* subjects grid */
  .shead{display:flex;align-items:baseline;justify-content:space-between;gap:.6rem;margin:.1rem .15rem 1rem}
  .shead h2{font-family:var(--font-head);font-size:1.12rem;font-weight:700;letter-spacing:-.01em}
  .shead .hint{font-family:var(--font-head);font-size:.76rem;color:var(--text-muted)}
  .fidnote{font-family:var(--font-head);font-size:.74rem;color:var(--text-muted);margin:-.5rem .15rem 1rem;line-height:1.4}
  .subjgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.7rem}
  .subjtile{position:relative;display:flex;flex-direction:column;text-align:left;background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--r);padding:.9rem .95rem 1rem;cursor:pointer;
    transition:transform .18s var(--ease),box-shadow .18s ease,border-color .18s ease}
  .subjtile:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--border-light)}
  .subjtile:focus-visible{outline:2px solid var(--anchor);outline-offset:2px}
  .subjtile .tt{display:flex;align-items:center;gap:.45rem;margin-bottom:.7rem}
  .subjtile .sw{width:10px;height:10px;border-radius:50%;background:var(--ac);flex:none}
  .subjtile .nm{font-family:var(--font-head);font-size:.98rem;font-weight:600;letter-spacing:-.01em;color:var(--text-primary)}
  .subjtile .pbar{height:5px;border-radius:3px;background:var(--border-lighter);overflow:hidden;margin-bottom:.5rem}
  .subjtile .pbar i{display:block;height:100%;border-radius:3px;background:var(--anchor)}
  .subjtile .pm{display:flex;justify-content:space-between;font-family:var(--font-head);font-size:.74rem;color:var(--text-muted);font-variant-numeric:tabular-nums}
  .subjtile .pm b{color:var(--text-secondary);font-weight:700}
  .subjtile .pm .u{color:var(--text-muted);font-weight:500}

  /* topics grid */
  .topicgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:.85rem}
  .topictile{position:relative;text-align:left;background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;
    transition:transform .18s var(--ease),box-shadow .2s ease}
  .topictile:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
  .topictile:focus-visible{outline:2px solid var(--anchor);outline-offset:2px}
  .topictile .thumb{height:96px;background:var(--border-lighter) center/cover no-repeat;position:relative;border-bottom:1px solid var(--border-lighter)}
  .topictile .thumb .stage-pip{position:absolute;top:.5rem;right:.5rem;display:inline-flex;align-items:center;gap:.28rem;background:rgba(255,255,255,.9);
    border:1px solid var(--border-light);border-radius:20px;padding:.16rem .5rem;font-family:var(--font-head);font-size:.6rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-secondary)}
  .topictile .stage-pip i{width:6px;height:6px;border-radius:50%;background:var(--ac)}
  .topictile .body{display:flex;flex-direction:column;padding:.7rem .8rem .85rem}
  .topictile .un{font-family:var(--font-head);font-size:.92rem;font-weight:600;letter-spacing:-.005em;color:var(--text-primary);line-height:1.25}
  .topictile .nx{font-family:var(--font-read);font-size:.78rem;color:var(--text-muted);margin-top:.3rem;min-height:1.1em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topictile .pbar{height:4px;border-radius:3px;background:var(--border-lighter);overflow:hidden;margin-top:.6rem}
  .topictile .pbar i{display:block;height:100%;border-radius:3px;background:var(--anchor)}
  .topictile .pm{font-family:var(--font-head);font-size:.72rem;color:var(--text-muted);font-variant-numeric:tabular-nums;margin-top:.4rem}
  .topictile .pm b{color:var(--text-secondary);font-weight:700}

  /* ===== path screen ===== */
  .pathwrap{position:relative;scroll-margin-top:124px}
  .pathtools{display:flex;align-items:center;justify-content:center;gap:.5rem;flex-wrap:wrap;margin:.1rem 0 .3rem}
  .fidelity{display:inline-flex;align-items:center;gap:.3rem;background:var(--bg-body);border:1px solid var(--border-light);border-radius:9px;padding:3px;box-shadow:var(--shadow-sm)}
  .fidelity .flbl{font-family:var(--font-head);font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);padding:0 .45rem 0 .35rem}
  .fidelity button{font-family:var(--font-head);font-size:.72rem;font-weight:600;color:var(--text-muted);background:transparent;border:0;border-radius:6px;padding:.34rem .62rem;transition:background .12s,color .12s}
  .fidelity button:hover{background:var(--border-lighter);color:var(--text-secondary)}
  .fidelity button.on{background:var(--acc);color:#fff}
  .fidelity button.off{opacity:.34;cursor:not-allowed}
  .fidelity button.off:hover{background:transparent;color:var(--text-muted)}
  .fidelity .auto{margin-left:.1rem;border-left:1px solid var(--border-light);padding-left:.4rem}
  .prevbtn{font-family:var(--font-head);font-size:.74rem;font-weight:600;color:var(--text-secondary);background:var(--bg-card);border:1px solid var(--border-light);border-radius:9px;padding:.42rem .8rem;box-shadow:var(--shadow-sm);transition:background .14s,color .14s,border-color .14s}
  .prevbtn:hover{border-color:var(--text-muted);color:var(--text-primary)}
  .prevbtn[disabled]{opacity:.4;cursor:default}
  @media(prefers-reduced-motion:reduce){ .pbg{transition:none} }

  .pcol{max-width:540px;margin:.2rem auto 0;padding:0 .5rem}
  .pstage-host{position:relative}
  /* two stacked backdrop layers → cross-fade in place (aligned img2img states sharpen, don't morph) */
  .pbg{position:absolute;inset:0;background-position:top center;background-size:100% auto;background-repeat:repeat-y;opacity:0;transition:opacity 1.15s ease;z-index:0;pointer-events:none}
  .pbg.show{opacity:1}
  .node{position:absolute;transform:translate(-50%,-50%);cursor:pointer;z-index:2}
  .node .dot{border-radius:50%;display:grid;place-items:center;transition:transform .18s var(--ease),box-shadow .18s}
  .node:hover .dot{transform:scale(1.07)}
  .node .lt{position:absolute;top:50%;transform:translateY(-50%);font-family:var(--font-read);font-size:.78rem;line-height:1.22;max-width:150px;
    text-shadow:0 0 3px var(--bg-card),0 0 6px var(--bg-card),0 0 11px var(--bg-card),0 0 11px var(--bg-card)}
  .pstage.haspaper .node .lt{text-shadow:0 0 3px var(--bg-body),0 0 6px var(--bg-body),0 0 11px var(--bg-body),0 0 11px var(--bg-body)}
  .node.t-right .lt{left:calc(50% + 34px);text-align:left}
  .node.t-left .lt{right:calc(50% + 34px);text-align:right}
  /* the big "up next" node is 62px — push its label clear so it isn't cramped against the play button */
  .node.current.t-right .lt{left:calc(50% + 47px)}
  .node.current.t-left .lt{right:calc(50% + 47px)}
  .node.done .dot{width:46px;height:46px;background:var(--acc-mute);color:#fff;box-shadow:var(--shadow-sm)}
  .node.done .dot svg{width:22px;height:22px}
  .node.done .lt{color:var(--text-secondary)}
  .node.ahead .dot{width:42px;height:42px;background:var(--bg-card);border:2px solid var(--border-light);color:var(--text-muted);font-family:var(--font-head);font-weight:700;font-size:.9rem}
  .node.ahead .lt{color:var(--text-muted)}
  .node.current{z-index:3}
  .node.current .dot{width:62px;height:62px;background:var(--acc);color:#fff;box-shadow:0 6px 22px -6px color-mix(in srgb,var(--acc) 60%,transparent),0 0 0 6px color-mix(in srgb,var(--acc) 16%,transparent)}
  .node.current .dot svg{width:26px;height:26px}
  .node.current .lt{font-family:var(--font-head);font-weight:700;font-size:.92rem;color:var(--text-primary)}
  .node.current .pill{display:inline-block;font-family:var(--font-head);font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);margin-bottom:.18rem}
  .node.current .dot{animation:pulse 2.6s var(--ease) infinite}
  @keyframes pulse{0%,100%{box-shadow:0 6px 22px -6px color-mix(in srgb,var(--acc) 60%,transparent),0 0 0 5px color-mix(in srgb,var(--acc) 18%,transparent)}
    50%{box-shadow:0 6px 22px -6px color-mix(in srgb,var(--acc) 60%,transparent),0 0 0 11px color-mix(in srgb,var(--acc) 6%,transparent)}}
  .pfoot{display:flex;align-items:center;gap:.8rem;max-width:540px;margin:0 auto;padding:.2rem .5rem 0}
  .pfoot .line{flex:1;height:1px;background:var(--border-light)}
  .pfoot .lbl{font-family:var(--font-head);text-transform:uppercase;letter-spacing:.11em;font-size:.66rem;font-weight:700;color:var(--text-muted);white-space:nowrap}
  .pfoot .ct{font-family:var(--font-head);font-size:.66rem;font-weight:600;color:var(--text-muted);font-variant-numeric:tabular-nums}

  @media(prefers-reduced-motion:reduce){
    .node.current .dot{animation:none} .node:hover .dot{transform:none}
    .screen.in{animation:none} .units,.units>.inner,.urow{transition:none!important}
  }

  /* toast */
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(14px);background:rgba(29,28,26,.94);color:#f5f3f0;
    font-family:var(--font-head);font-size:.84rem;font-weight:600;padding:.6rem .9rem;border-radius:8px;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;
    transition:opacity .2s ease,transform .3s var(--ease);z-index:50;max-width:90vw}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast b{color:#fff}

  /* week strip */
  .week{margin:1.1rem 0 2.4rem;display:flex;align-items:center;justify-content:space-between;gap:1rem 1.4rem;flex-wrap:wrap;
    background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--r);box-shadow:var(--shadow-sm);padding:.9rem 1.5rem}
  .week .wlbl{font-family:var(--font-head);text-transform:uppercase;letter-spacing:.1em;font-size:.64rem;font-weight:700;color:var(--text-muted)}
  .week .stat{font-family:var(--font-head);font-size:.92rem;color:var(--text-secondary)}
  .week .stat b{color:var(--text-primary);font-weight:700}

  /* ===== ⓘ info popover (shared) ===== */
  .info{position:relative;display:inline-flex;flex:none}
  .info > button{width:16px;height:16px;border-radius:50%;border:1px solid var(--border-light);background:var(--bg-card);color:var(--text-muted);
    font-family:var(--font-head);font-style:italic;font-weight:700;font-size:.66rem;line-height:1;display:grid;place-items:center;cursor:pointer;transition:color .14s,border-color .14s}
  .info > button:hover{color:var(--text-secondary);border-color:var(--text-muted)}
  .info .pop{position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%) translateY(-4px);width:min(280px,72vw);z-index:40;
    background:var(--text-primary);color:#f3f1ee;font-family:var(--font-read);font-size:.78rem;line-height:1.45;padding:.7rem .8rem;border-radius:8px;box-shadow:var(--shadow-lg);
    opacity:0;visibility:hidden;transition:opacity .16s ease,transform .2s var(--ease),visibility 0s linear .16s}
  .info.open .pop{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0);transition:opacity .16s ease,transform .2s var(--ease)}
  .info .pop::before{content:"";position:absolute;bottom:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-bottom-color:var(--text-primary)}

    var gap=(n>1)?(H-topPad-footPad)/(n-1):0;
    function nodeTop(j){ return n>1 ? (H-footPad-j*gap) : Math.round(H/2); }   // lesson 1 at the BOTTOM; climb up
    var pstage=document.createElement('div'); pstage.className='pstage'; pstage.style.cssText='position:relative;width:'+W+'px;height:'+H+'px;margin:0 auto'; host.appendChild(pstage);
    var bgA=document.createElement('div'), bgB=document.createElement('div'); bgA.className='pbg'; bgB.className='pbg';
    pstage.appendChild(bgA); pstage.appendChild(bgB); pstage._bg=[bgA,bgB]; pstage._bgActive=-1;
    var conn=E('svg',{width:W,height:H,viewBox:'0 0 '+W+' '+H}); conn.style.cssText='position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:1'; pstage.appendChild(conn);
    var pos=u.lessons.map(function(L,j){ return {x:cx+Math.sin(j*0.85)*amp, top:nodeTop(j)}; });
    function seg(a,b,stroke,wd,op,dash){ if(b<=a) return; var d='M '+pos[a].x.toFixed(1)+' '+pos[a].top.toFixed(1);
      for(var k=a+1;k<=b;k++){ var p0=pos[k-1],p1=pos[k],my=(p0.top+p1.top)/2; d+=' C '+p0.x.toFixed(1)+' '+my.toFixed(1)+' '+p1.x.toFixed(1)+' '+my.toFixed(1)+' '+p1.x.toFixed(1)+' '+p1.top.toFixed(1); }
      var pa=E('path',{d:d,fill:'none',stroke:stroke,'stroke-width':wd,'stroke-linecap':'round',opacity:op}); if(dash) pa.setAttribute('stroke-dasharray',dash); conn.appendChild(pa); }
    var lastDone=-1, curIdx=-1;
    u.lessons.forEach(function(L,j){ if(L.doneFlag) lastDone=j; else if(curIdx<0) curIdx=j; });
    seg(0,Math.max(0,lastDone),s.a,3.6,0.62);
    seg(Math.max(0,lastDone),n-1,'#cdcac4',2.6,0.95,'1 7');
    var currentEl=null;
    u.lessons.forEach(function(L,j){
      var isCur=(j===curIdx), cls=isCur?'current':(L.doneFlag?'done':'ahead');
      var node=document.createElement('div'); node.className='node '+(pos[j].x<cx?'t-right':'t-left')+' '+cls;
      node.style.left=pos[j].x+'px'; node.style.top=pos[j].top+'px';
      node.innerHTML='<span class="dot">'+(isCur?PLAY:(L.doneFlag?CHECK:L.no))+'</span><span class="lt">'+(isCur?'<span class="pill">Up next</span><br>':'')+esc(L.t)+'</span>';
      node.addEventListener('click',function(){ openLesson(s,u,L); });
      pstage.appendChild(node);
      if(isCur) currentEl=node;
    });
    applyStage();
  }

  function openLesson(s,u,L){
    toast('<b>'+esc(s.n)+'</b> · '+esc(u.name)+' — opening <b>L'+L.no+'</b> '+esc(L.t));
    // real product would navigate: console shows the resolved URL
    console.log('open lesson', L.url||contentUrl(s.k,u.slug,L.no));
  }

  /* ---------- continue card → drop onto English Lit's path at "up next" ---------- */
  function wireContinue(){
    var s=byShelf['English Literature']; if(!s||!s.lessons.length) return;
    var si=SHELF.indexOf(s);
    var L=null; for(var i=0;i<s.lessons.length;i++){ if(!s.lessons[i].doneFlag){ L=s.lessons[i]; break; } }
    if(!L) L=s.lessons[s.lessons.length-1];
    var ui=0; s.units.forEach(function(u,k){ if(u.lessons.indexOf(L)>=0) ui=k; });
    document.getElementById('contTtl').textContent=L.t;
    document.getElementById('contUnit').textContent=L.uname+' · '+s.done+' of '+s.total+' lessons done';
    document.getElementById('contBar').style.width=Math.round(s.m*100)+'%';
    document.getElementById('contBtn').addEventListener('click',function(){ navExpand(si); showPath(si,ui); });
  }

  /* ===================================================================
     FEATURE TILES — Today's session · Warm-up · Revision Radio · Weak spots
     =================================================================== */
  var ICON_WARM='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/></svg>';
  var ICON_RADIO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2"/><path d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 16.2a6 6 0 0 0 0-8.4M4.9 4.9a10 10 0 0 0 0 14.2M19.1 19.1a10 10 0 0 0 0-14.2"/></svg>';
  var ICON_WAVE='<svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="9.5" width="2.4" height="5" rx="1.2"/><rect x="9" y="5.5" width="2.4" height="13" rx="1.2"/><rect x="14" y="8" width="2.4" height="8" rx="1.2"/><rect x="18.6" y="10.5" width="2.4" height="3" rx="1.2"/></svg>';
  var ICON_PAUSE='<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="3.6" height="14" rx="1.2"/><rect x="14" y="5" width="3.6" height="14" rx="1.2"/></svg>';
  var ICON_PREV='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h2v14H7zM20 5v14l-10-7z"/></svg>';
  var ICON_NEXT='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M15 5h2v14h-2zM4 5l10 7-10 7z"/></svg>';
  var ARROW='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h14"/><path d="M12.5 5.5 19 12l-6.5 6.5"/></svg>';
  var RADIO_BLURB='Press play and Revision Radio streams short audio from your lessons — it starts with whatever you’re working on, then quietly brings back the topics that are starting to slip. No playlists to build, no decisions to make. Perfect for the bus, the walk home, or whenever reading feels like too much.';

  /* ⓘ popovers */
  function infoHTML(t){ return '<span class="info"><button type="button" aria-label="What’s this?">i</button><span class="pop">'+esc(t)+'</span></span>'; }
  function wireInfo(scope){ [].slice.call((scope||document).querySelectorAll('.info')).forEach(function(inf){
    inf.querySelector('button').addEventListener('click',function(e){ e.stopPropagation(); var open=inf.classList.contains('open');
      [].slice.call(document.querySelectorAll('.info.open')).forEach(function(o){o.classList.remove('open');}); if(!open) inf.classList.add('open'); }); }); }
  document.addEventListener('click',function(){ [].slice.call(document.querySelectorAll('.info.open')).forEach(function(o){o.classList.remove('open');}); });

  /* shared helpers */
  function nextLesson(s){ if(!s||!s.lessons.length) return null; var si=SHELF.indexOf(s), L=null;
    for(var i=0;i<s.lessons.length;i++){ if(!s.lessons[i].doneFlag){ L=s.lessons[i]; break; } }
    if(!L) L=s.lessons[s.lessons.length-1];
    var ui=0; s.units.forEach(function(u,k){ if(u.lessons.indexOf(L)>=0) ui=k; });
    return {L:L,si:si,ui:ui,s:s}; }
  function weakSpots(n){ var arr=[];
    SHELF.forEach(function(s,si){ s.units.forEach(function(u,ui){
      if(u.lessons.length>=2 && u.frac>0 && u.frac<0.7) arr.push({si:si,ui:ui,name:u.name,swatch:s.swatch,frac:u.frac,pct:Math.round(u.frac*100)}); }); });
    arr.sort(function(a,b){ return a.frac-b.frac; }); return arr.slice(0,n); }

  /* ---- Today's session ---- */
  function buildToday(){
    var el=document.getElementById('todaySession'); if(!el) return;
    var items=[];
    var cont=nextLesson(byShelf['English Literature']);
    if(cont) items.push({d:cont.s.swatch,t:cont.s.n+' · '+cont.L.t,go:function(){ showPath(cont.si,cont.ui); }});
    var w=weakSpots(1)[0];
    if(w){ var u=SHELF[w.si].units[w.ui], L=u.lessons.filter(function(L){return !L.doneFlag;})[0]||u.lessons[0];
      items.push({d:w.swatch,t:SHELF[w.si].n+' · '+L.t,go:function(){ showPath(w.si,w.ui); }}); }
    items.push({d:'var(--good,#5f8c6d)',t:'14 warm-up questions',go:openWarmup});
    var first=new Date('2027-05-10T09:00:00'), days=Math.max(0,Math.ceil((first-new Date())/86400000));
    el.innerHTML='<div class="tmain"><div class="tk">Today’s session · ~35 min</div><h2>Here’s a plan to keep you on track</h2><div class="plan"></div></div>'+
      '<div class="tside"><div class="tmeta"><b>'+days+' days</b> to your first exam</div>'+
      '<button class="start" id="startToday">Start session '+ARROW+'</button></div>';
    var plan=el.querySelector('.plan');
    items.forEach(function(it){ var c=document.createElement('button'); c.className='chip2'; c.style.setProperty('--cd',it.d);
      c.innerHTML='<span class="d"></span>'+esc(it.t); c.addEventListener('click',it.go); plan.appendChild(c); });
    el.querySelector('#startToday').addEventListener('click',function(){ if(items[0]){ items[0].go(); toast('Starting today’s session — first up: <b>'+esc(items[0].t)+'</b>'); } });
  }

  /* ---- Warm-up ---- */
  function buildWarmup(){
    var el=document.getElementById('warmup'); if(!el) return;
    el.innerHTML='<div class="ch"><span class="ico">'+ICON_WARM+'</span><span class="ct">Warm-up</span>'+
      infoHTML('A quick mix of flashcards and knowledge-check questions, interleaved across your subjects — the shaky ones come round first. A couple of minutes to get your brain in gear before you dig in.')+'</div>'+
      '<p>Ten quick questions across your subjects to get going.</p>'+
      '<div class="mixrow"><div class="mix"><b>6</b><span>Quick checks</span></div><div class="mix"><b>4</b><span>Flashcards</span></div></div>'+
      '<button class="btn" id="warmBtn">Start warm-up '+ARROW+'</button>';
    el.querySelector('#warmBtn').addEventListener('click',openWarmup); wireInfo(el);
  }
  function openWarmup(){
    var checks=WARMUP.filter(function(q){return q.type==='check';}), cards=WARMUP.filter(function(q){return q.type==='card';});
    if(!checks.length && !cards.length){ toast('Warm-up questions are still loading…'); return; }
    var deck=[], ci=0, fi=0;
    for(var n=0;n<10;n++){ if((n===2||n===4||n===7||n===9) && fi<cards.length) deck.push(cards[fi++]); else if(ci<checks.length) deck.push(checks[ci++]); else if(fi<cards.length) deck.push(cards[fi++]); }
    if(!deck.length){ toast('Warm-up questions are still loading…'); return; } runQuiz(deck);
  }
  function praise(p){ return p>=80?'Brain officially warmed up.':p>=50?'Nice — a few of those to firm up.':'Good start — these’ll be your warm-up regulars.'; }
  function runQuiz(deck){
    var modal=document.getElementById('qmodal'), card=document.getElementById('qcard'), idx=0, score=0;
    function close(){ modal.classList.remove('open'); modal.setAttribute('aria-hidden','true'); }
    function render(){
      if(idx>=deck.length){ done(); return; }
      var q=deck[idx], pct=Math.round(idx/deck.length*100);
      var h='<div class="qtop"><span class="qprog">Question '+(idx+1)+' of '+deck.length+'</span><button class="qx" aria-label="Close">×</button></div>'+
        '<div class="qbar"><i style="width:'+pct+'%"></i></div>'+
        '<div class="qtag" style="--cd:'+q.sw+';color:'+q.sw+'"><span class="d"></span>'+esc(q.subj)+' · '+(q.type==='card'?'Flashcard':'Quick check')+'</div>'+
        '<div class="qq">'+esc(q.q)+'</div>'+
        (q.type==='check'?'<div class="qopts"></div>':'<div class="qreveal" id="qrev" hidden></div>')+
        '<div class="qfoot"><button class="qskip">Skip</button><button class="qnext" disabled>Next</button></div>';
      card.innerHTML=h;
      card.querySelector('.qx').onclick=close;
      var nextBtn=card.querySelector('.qnext'); card.querySelector('.qskip').onclick=function(){ idx++; render(); };
      if(q.type==='check'){
        var opts=card.querySelector('.qopts'), answered=false;
        q.options.forEach(function(o,oi){ var b=document.createElement('button'); b.className='qopt'; b.textContent=o;
          b.onclick=function(){ if(answered) return; answered=true;
            [].slice.call(opts.children).forEach(function(x,xi){ x.disabled=true; if(xi===q.correct) x.classList.add('correct'); });
            if(oi!==q.correct) b.classList.add('wrong'); else score++;
            nextBtn.disabled=false; nextBtn.textContent=(idx===deck.length-1?'Finish':'Next'); };
          opts.appendChild(b); });
        nextBtn.onclick=function(){ if(nextBtn.disabled) return; idx++; render(); };
      } else {
        nextBtn.disabled=false; nextBtn.textContent='Show answer'; var revealed=false, rev=card.querySelector('#qrev');
        nextBtn.onclick=function(){ if(!revealed){ revealed=true; rev.textContent=q.a; rev.hidden=false; score++; nextBtn.textContent=(idx===deck.length-1?'Finish':'Next'); } else { idx++; render(); } };
      }
    }
    function done(){ var pct=Math.round(score/deck.length*100);
      card.innerHTML='<div class="qdone"><div class="score">'+score+'/'+deck.length+'</div><p>'+praise(pct)+'</p><button class="qnext" id="qclose">Done</button></div>';
      card.querySelector('#qclose').onclick=close; }
    modal.classList.add('open'); modal.setAttribute('aria-hidden','false'); render();
  }

  /* ---- Revision Radio ---- */
  var RADIO=null, radioTimer=null;
  function fmt(s){ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2); }
  function radioQueue(cont){ var out=[];
    weakSpots(2).forEach(function(w){ var s=SHELF[w.si], u=s.units[w.ui], L=u.lessons.filter(function(L){return L.doneFlag;})[0]||u.lessons[0]; out.push({subj:s.n,sw:s.swatch,title:L.t}); });
    SHELF.forEach(function(s){ if(cont&&s===cont.s) return; var d=s.lessons.filter(function(L){return L.doneFlag;}); if(d.length && out.length<5){ var L=d[Math.floor(d.length*0.4)]; out.push({subj:s.n,sw:s.swatch,title:L.t}); } });
    return out.slice(0,5); }
  function buildRadio(){
    var el=document.getElementById('radio'); if(!el) return;
    var cont=nextLesson(byShelf['English Literature']);
    RADIO={ list:[{subj:cont.s.n,sw:cont.s.swatch,title:cont.L.t}].concat(radioQueue(cont)), idx:0, playing:false, pos:0, dur:630 };
    el.innerHTML='<div class="rtop"><span class="ico">'+ICON_RADIO+'</span><span class="ct">Revision Radio</span>'+infoHTML(RADIO_BLURB)+'<span class="rstand">Starts where you left off, then refreshes what’s fading.</span></div>'+
      '<div class="rbody">'+
        '<div class="rnow"><span class="art" id="rArt">'+ICON_WAVE+'</span><span class="npmeta"><span class="npsub" id="rSub"></span><span class="nptitle" id="rTitle"></span></span></div>'+
        '<div class="rplayer"><div class="ctrls"><button class="sk" id="rPrev" aria-label="Previous">'+ICON_PREV+'</button><button class="pp" id="rPlay" aria-label="Play">'+PLAY+'</button><button class="sk" id="rNext" aria-label="Next">'+ICON_NEXT+'</button></div>'+
          '<div class="scrub" id="rScrub"><i id="rFill"></i></div><div class="time"><span id="rCur">0:00</span><span id="rDur">0:00</span></div></div>'+
        '<div class="rqueue-wrap"><div class="qhead"><span class="ql">Up next · refresh</span><a id="rBrowse">Browse</a></div><div id="rQueue"></div></div>'+
      '</div>';
    wireInfo(el);
    el.querySelector('#rPlay').onclick=radioToggle;
    el.querySelector('#rPrev').onclick=function(){ radioGo(RADIO.idx-1); };
    el.querySelector('#rNext').onclick=function(){ radioGo(RADIO.idx+1); };
    el.querySelector('#rBrowse').onclick=function(){ showSubjects(); window.scrollTo({top:0,behavior:reduceMotion?'auto':'smooth'}); toast('Browse episodes — pick any subject → topic'); };
    el.querySelector('#rScrub').onclick=function(e){ var r=this.getBoundingClientRect(); RADIO.pos=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*RADIO.dur; radioPaint(); };
    radioLoad(0);
  }
  function radioLoad(i){ if(!RADIO) return; RADIO.idx=Math.max(0,Math.min(RADIO.list.length-1,i)); var t=RADIO.list[RADIO.idx];
    RADIO.pos=0; RADIO.dur=600+ (t.title.length%9)*11;
    var el=document.getElementById('radio'); el.querySelector('#rSub').textContent=t.subj; el.querySelector('#rTitle').textContent=t.title;
    el.querySelector('#rArt').style.setProperty('--np',t.sw); renderQueue(); radioPaint(); }
  function radioPaint(){ var el=document.getElementById('radio'); if(!el||!RADIO) return;
    el.querySelector('#rFill').style.width=(RADIO.pos/RADIO.dur*100)+'%';
    el.querySelector('#rCur').textContent=fmt(RADIO.pos); el.querySelector('#rDur').textContent=fmt(RADIO.dur);
    el.querySelector('#rPlay').innerHTML=RADIO.playing?ICON_PAUSE:PLAY; el.classList.toggle('playing',RADIO.playing); }
  function radioTick(){ if(!RADIO||!RADIO.playing) return; RADIO.pos++; if(RADIO.pos>=RADIO.dur){ radioGo(RADIO.idx+1); return; } radioPaint(); }
  function radioToggle(){ if(!RADIO) return; RADIO.playing=!RADIO.playing;
    if(RADIO.playing){ if(!radioTimer) radioTimer=setInterval(radioTick,1000); toast('▶ Revision Radio — <b>'+esc(RADIO.list[RADIO.idx].subj)+'</b>'); } radioPaint(); }
  function radioGo(i){ if(!RADIO) return; if(i<0)i=0; if(i>=RADIO.list.length){ RADIO.playing=false; i=RADIO.list.length-1; } radioLoad(i); radioPaint(); }
  function renderQueue(){ var el=document.getElementById('radio'); if(!el||!RADIO) return; var q=el.querySelector('#rQueue'); q.innerHTML='';
    RADIO.list.forEach(function(t,i){ if(i<=RADIO.idx) return; var row=document.createElement('div'); row.className='qrow'; row.style.setProperty('--qd',t.sw);
      row.innerHTML='<span class="qd"></span><span class="qt">'+esc(t.title)+' <small>· '+esc(t.subj)+'</small></span>';
      row.onclick=function(){ radioGo(i); if(!RADIO.playing) radioToggle(); }; q.appendChild(row); });
    if(!q.children.length) q.innerHTML='<div style="font-family:var(--font-head);font-size:.74rem;color:var(--text-muted);padding:.35rem .3rem">That’s the end of today’s queue.</div>'; }

  function buildPage(){
    wireContinue(); buildToday(); buildWarmup(); buildRadio(); showSubjects();
  }

  document.getElementById('crumbHome').addEventListener('click',showSubjects);
  document.getElementById('brand').style.cursor='pointer';
  document.getElementById('brand').addEventListener('click',showSubjects);

  loadAll();
})();
</script>
