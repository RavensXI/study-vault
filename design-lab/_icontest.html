<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Icon contact sheet</title>
<style>
  body{margin:0;background:#f7f6f4;color:#1d1c1a;font-family:'Schibsted Grotesk',system-ui,sans-serif}
  h1{font-size:1rem;padding:14px 18px;margin:0;border-bottom:1px solid #e6e4e0}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:2px;background:#e6e4e0}
  .cell{background:#fff;padding:10px 8px 12px;text-align:center}
  .cell .row{display:flex;justify-content:center;gap:6px}
  canvas{display:block}
  .lab{font-size:.72rem;color:#7f7c75;margin-top:6px;font-weight:600}
  .k{font-size:.62rem;color:#b8b2a8}
</style></head>
<body>
<h1>StudyVault subject icons — silhouette (left) vs ~210 floaty dots (right)</h1>
<div class="grid" id="grid"></div>
<script>
/* ===== ICON SET — each fills a bold silhouette in a 0..S box. Clarity-first. ===== */
var PAL = {maths:'#3f5e78',stats:'#0369a1',englang:'#7a6a8a',englit:'#991b1b',science:'#16a34a',sciences:'#15803d',
history:'#581c87',geography:'#4f46e5',geology:'#78350f',astronomy:'#312e81',re:'#b45309',psychology:'#0d9488',
sociology:'#7c3aed',citizenship:'#1e3a8a',business:'#475569',economics:'#0369a1',enterprise:'#b45309',retail:'#b45309',
cs:'#1e40af',it:'#1e40af',imedia:'#db2777',media:'#be185d',film:'#991b1b',drama:'#6b21a8',music:'#0d9488',
pe:'#be123c',sport:'#16a34a',food:'#0d9488',hospitality:'#0d9488',dt:'#d97706',engineering:'#475569',
electronics:'#0e7490',construction:'#ca8a04',hsc:'#e11d48',childdev:'#0d9488',classics:'#9a3412',language:'#1d4ed8'};

function tri(c,a,b,cc){c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.lineTo(cc[0],cc[1]);c.closePath();c.fill();}
function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();c.fill();}
function disc(c,x,y,r){c.beginPath();c.arc(x,y,r,0,6.2832);c.fill();}
function hole(c,fn){c.save();c.globalCompositeOperation='destination-out';fn();c.restore();}
function txt(c,s,ch,size,yf){c.font='bold '+Math.round(s*size)+'px Georgia, "Times New Roman", serif';c.textAlign='center';c.textBaseline='middle';c.fillText(ch,s/2,s*(yf||0.54));}

var ICON = {
  maths:function(c,s){ txt(c,s,'π',0.88,0.57); },
  stats:function(c,s){ var b=s*0.84,w=s*0.16; c.fillRect(s*0.14,s*0.6,w,b-s*0.6); c.fillRect(s*0.34,s*0.44,w,b-s*0.44); c.fillRect(s*0.54,s*0.28,w,b-s*0.28); c.fillRect(s*0.74,s*0.5,w,b-s*0.5); c.fillRect(s*0.1,b,s*0.8,s*0.05); },
  englang:function(c,s){ txt(c,s,'Aa',0.5,0.56); },
  englit:function(c,s){ var t=s*0.24,b=s*0.8,mx=s*0.5; c.beginPath();c.moveTo(mx,t);c.lineTo(s*0.1,t*1.5);c.lineTo(s*0.1,b);c.lineTo(mx,b*0.9);c.closePath();c.fill(); c.beginPath();c.moveTo(mx,t);c.lineTo(s*0.9,t*1.5);c.lineTo(s*0.9,b);c.lineTo(mx,b*0.9);c.closePath();c.fill(); },
  science:function(c,s){ /* conical flask */ var nx=s*0.42,nw=s*0.16,ny=s*0.14; c.fillRect(nx,ny,nw,s*0.2); c.beginPath();c.moveTo(nx,ny+s*0.18);c.lineTo(nx+nw,ny+s*0.18);c.lineTo(s*0.82,s*0.82);c.lineTo(s*0.18,s*0.82);c.closePath();c.fill(); c.fillRect(s*0.16,s*0.8,s*0.68,s*0.06); },
  sciences:function(c,s){ /* three test tubes */ for(var i=0;i<3;i++){var x=s*(0.24+i*0.18);c.fillRect(x-s*0.05,s*0.16,s*0.1,s*0.5);disc(c,x,s*0.66,s*0.05);} c.fillRect(s*0.16,s*0.12,s*0.5,s*0.05); },
  history:function(c,s){ var m=s*0.2; tri(c,[m,m],[s-m,m],[s*0.5,s*0.5]); tri(c,[s*0.5,s*0.5],[s-m,s-m],[m,s-m]); c.fillRect(m*0.7,m*0.55,s-m*1.4,s*0.055); c.fillRect(m*0.7,s-m*0.55-s*0.055,s-m*1.4,s*0.055); },
  geography:function(c,s){ var b=s*0.8; tri(c,[s*0.06,b],[s*0.4,s*0.24],[s*0.66,b]); tri(c,[s*0.46,b],[s*0.74,s*0.4],[s*0.96,b]); },
  geology:function(c,s){ /* gem / crystal */ var t=s*0.22; c.beginPath();c.moveTo(s*0.3,t);c.lineTo(s*0.7,t);c.lineTo(s*0.88,s*0.42);c.lineTo(s*0.5,s*0.86);c.lineTo(s*0.12,s*0.42);c.closePath();c.fill(); },
  astronomy:function(c,s){ /* crescent moon + star */ disc(c,s*0.46,s*0.5,s*0.32); hole(c,function(){disc(c,s*0.6,s*0.42,s*0.28);}); var sx=s*0.78,sy=s*0.26,r=s*0.1; c.fillRect(sx-s*0.018,sy-r,s*0.036,r*2); c.fillRect(sx-r,sy-s*0.018,r*2,s*0.036); },
  re:function(c,s){ /* candle flame */ c.beginPath();c.moveTo(s*0.5,s*0.16);c.bezierCurveTo(s*0.74,s*0.42,s*0.7,s*0.66,s*0.5,s*0.74);c.bezierCurveTo(s*0.3,s*0.66,s*0.26,s*0.42,s*0.5,s*0.16);c.closePath();c.fill(); c.fillRect(s*0.4,s*0.74,s*0.2,s*0.12); },
  psychology:function(c,s){ /* head profile */ c.beginPath();c.moveTo(s*0.3,s*0.86);c.lineTo(s*0.3,s*0.5);c.bezierCurveTo(s*0.3,s*0.16,s*0.78,s*0.16,s*0.74,s*0.5);c.lineTo(s*0.66,s*0.5);c.lineTo(s*0.68,s*0.86);c.closePath();c.fill(); hole(c,function(){disc(c,s*0.52,s*0.46,s*0.07);}); },
  sociology:function(c,s){ /* three people */ function p(x,y,r){disc(c,x,y,r);rrect(c,x-r*1.3,y+r*0.6,r*2.6,r*2.4,r*0.8);} p(s*0.5,s*0.26,s*0.12); p(s*0.26,s*0.4,s*0.11); p(s*0.74,s*0.4,s*0.11); },
  citizenship:function(c,s){ /* balance scales */ c.fillRect(s*0.48,s*0.18,s*0.04,s*0.56); c.fillRect(s*0.3,s*0.74,s*0.4,s*0.05); c.fillRect(s*0.2,s*0.26,s*0.6,s*0.04); function pan(x){c.beginPath();c.arc(x,s*0.42,s*0.12,0,Math.PI);c.closePath();c.fill();c.fillRect(x-s*0.001,s*0.28,s*0.002,s*0.14);} pan(s*0.24); pan(s*0.76); disc(c,s*0.5,s*0.2,s*0.05); },
  business:function(c,s){ /* briefcase */ rrect(c,s*0.14,s*0.34,s*0.72,s*0.46,s*0.05); c.fillRect(s*0.38,s*0.24,s*0.24,s*0.12); hole(c,function(){c.fillRect(s*0.4,s*0.26,s*0.2,s*0.08);}); hole(c,function(){c.fillRect(s*0.14,s*0.52,s*0.72,s*0.05);}); },
  economics:function(c,s){ disc(c,s*0.5,s*0.5,s*0.36); hole(c,function(){txt(c,s,'£',0.52,0.55);}); },
  enterprise:function(c,s){ /* lightbulb */ disc(c,s*0.5,s*0.42,s*0.26); c.fillRect(s*0.4,s*0.6,s*0.2,s*0.14); c.fillRect(s*0.42,s*0.74,s*0.16,s*0.06); c.fillRect(s*0.44,s*0.82,s*0.12,s*0.05); },
  retail:function(c,s){ /* shopping bag */ rrect(c,s*0.2,s*0.34,s*0.6,s*0.5,s*0.05); c.lineWidth=s*0.05; hole(c,function(){c.save();c.lineWidth=s*0.06;c.strokeStyle='#000';c.beginPath();c.arc(s*0.5,s*0.34,s*0.13,Math.PI,2*Math.PI);c.stroke();c.restore();}); c.save();c.lineWidth=s*0.055;c.strokeStyle=c.fillStyle;c.beginPath();c.arc(s*0.5,s*0.36,s*0.13,Math.PI,2*Math.PI);c.stroke();c.restore(); },
  cs:function(c,s){ txt(c,s,'</>',0.34,0.56); },
  it:function(c,s){ /* monitor */ rrect(c,s*0.14,s*0.2,s*0.72,s*0.48,s*0.05); hole(c,function(){rrect(c,s*0.2,s*0.26,s*0.6,s*0.36,s*0.03);}); rrect(c,s*0.2,s*0.27,s*0.6,s*0.34,s*0.02); c.fillRect(s*0.44,s*0.68,s*0.12,s*0.1); c.fillRect(s*0.32,s*0.78,s*0.36,s*0.06); },
  imedia:function(c,s){ /* cursor arrow */ c.beginPath();c.moveTo(s*0.3,s*0.2);c.lineTo(s*0.3,s*0.78);c.lineTo(s*0.44,s*0.64);c.lineTo(s*0.54,s*0.86);c.lineTo(s*0.64,s*0.82);c.lineTo(s*0.54,s*0.6);c.lineTo(s*0.74,s*0.6);c.closePath();c.fill(); },
  media:function(c,s){ /* video camera */ rrect(c,s*0.14,s*0.34,s*0.5,s*0.34,s*0.05); c.beginPath();c.moveTo(s*0.64,s*0.44);c.lineTo(s*0.86,s*0.34);c.lineTo(s*0.86,s*0.68);c.lineTo(s*0.64,s*0.58);c.closePath();c.fill(); disc(c,s*0.3,s*0.28,s*0.08); disc(c,s*0.46,s*0.28,s*0.08); },
  film:function(c,s){ /* clapperboard */ c.save();c.translate(s*0.5,s*0.56);c.rotate(-0.06);c.translate(-s*0.5,-s*0.56); c.fillRect(s*0.14,s*0.46,s*0.72,s*0.34); c.beginPath();c.moveTo(s*0.14,s*0.44);c.lineTo(s*0.86,s*0.32);c.lineTo(s*0.86,s*0.2);c.lineTo(s*0.14,s*0.32);c.closePath();c.fill(); hole(c,function(){for(var i=0;i<4;i++){var x=s*(0.2+i*0.18);c.beginPath();c.moveTo(x,s*0.42);c.lineTo(x+s*0.06,s*0.3);c.lineTo(x+s*0.1,s*0.3);c.lineTo(x+s*0.04,s*0.42);c.closePath();c.fill();}}); c.restore(); },
  drama:function(c,s){ /* theatre mask */ c.beginPath();c.moveTo(s*0.22,s*0.26);c.lineTo(s*0.78,s*0.26);c.bezierCurveTo(s*0.78,s*0.7,s*0.64,s*0.84,s*0.5,s*0.84);c.bezierCurveTo(s*0.36,s*0.84,s*0.22,s*0.7,s*0.22,s*0.26);c.closePath();c.fill(); hole(c,function(){disc(c,s*0.38,s*0.44,s*0.06);disc(c,s*0.62,s*0.44,s*0.06);c.beginPath();c.arc(s*0.5,s*0.58,s*0.14,0.15*Math.PI,0.85*Math.PI);c.lineWidth=s*0.05;c.strokeStyle='#000';c.stroke();}); },
  music:function(c,s){ /* eighth note */ disc(c,s*0.36,s*0.74,s*0.13); c.fillRect(s*0.47,s*0.2,s*0.05,s*0.56); c.beginPath();c.moveTo(s*0.52,s*0.2);c.quadraticCurveTo(s*0.78,s*0.28,s*0.7,s*0.5);c.quadraticCurveTo(s*0.74,s*0.32,s*0.52,s*0.32);c.closePath();c.fill(); },
  pe:function(c,s){ /* running figure */ disc(c,s*0.6,s*0.22,s*0.1); c.save();c.lineWidth=s*0.1;c.strokeStyle=c.fillStyle;c.lineCap='round'; c.beginPath();c.moveTo(s*0.56,s*0.34);c.lineTo(s*0.46,s*0.52);c.lineTo(s*0.3,s*0.56);c.moveTo(s*0.46,s*0.52);c.lineTo(s*0.56,s*0.64);c.lineTo(s*0.5,s*0.84);c.moveTo(s*0.56,s*0.64);c.lineTo(s*0.74,s*0.62);c.moveTo(s*0.52,s*0.44);c.lineTo(s*0.7,s*0.4);c.stroke();c.restore(); },
  sport:function(c,s){ /* trophy */ c.beginPath();c.moveTo(s*0.3,s*0.2);c.lineTo(s*0.7,s*0.2);c.lineTo(s*0.66,s*0.46);c.bezierCurveTo(s*0.64,s*0.56,s*0.36,s*0.56,s*0.34,s*0.46);c.closePath();c.fill(); c.save();c.lineWidth=s*0.045;c.strokeStyle=c.fillStyle; c.beginPath();c.arc(s*0.3,s*0.28,s*0.1,0.5*Math.PI,1.5*Math.PI,true);c.stroke(); c.beginPath();c.arc(s*0.7,s*0.28,s*0.1,1.5*Math.PI,0.5*Math.PI,true);c.stroke();c.restore(); c.fillRect(s*0.46,s*0.54,s*0.08,s*0.14); c.fillRect(s*0.36,s*0.68,s*0.28,s*0.07); c.fillRect(s*0.32,s*0.75,s*0.36,s*0.07); },
  food:function(c,s){ /* chef hat */ c.beginPath();c.arc(s*0.34,s*0.4,s*0.15,0,6.2832);c.arc(s*0.5,s*0.32,s*0.18,0,6.2832);c.arc(s*0.66,s*0.4,s*0.15,0,6.2832);c.fill(); c.fillRect(s*0.32,s*0.46,s*0.36,s*0.26); c.fillRect(s*0.3,s*0.7,s*0.4,s*0.08); },
  hospitality:function(c,s){ /* cloche / serving dome */ c.beginPath();c.arc(s*0.5,s*0.66,s*0.34,Math.PI,2*Math.PI);c.closePath();c.fill(); c.fillRect(s*0.12,s*0.66,s*0.76,s*0.07); c.fillRect(s*0.47,s*0.24,s*0.06,s*0.1); disc(c,s*0.5,s*0.24,s*0.05); },
  dt:function(c,s){ /* hammer */ c.save();c.translate(s*0.5,s*0.5);c.rotate(0.7);c.translate(-s*0.5,-s*0.5); c.fillRect(s*0.46,s*0.3,s*0.08,s*0.5); rrect(c,s*0.3,s*0.22,s*0.4,s*0.16,s*0.04); c.restore(); },
  engineering:function(c,s){ /* gear */ var cx=s*0.5,cy=s*0.5,R=s*0.3,t=10; for(var i=0;i<t;i++){var a=i/t*6.2832;c.save();c.translate(cx,cy);c.rotate(a);c.fillRect(-s*0.05,-R-s*0.08,s*0.1,s*0.16);c.restore();} disc(c,cx,cy,R); hole(c,function(){disc(c,cx,cy,s*0.11);}); },
  electronics:function(c,s){ /* microchip */ rrect(c,s*0.28,s*0.28,s*0.44,s*0.44,s*0.04); hole(c,function(){disc(c,s*0.38,s*0.38,s*0.04);}); for(var i=0;i<3;i++){var p=s*(0.36+i*0.14);c.fillRect(p,s*0.16,s*0.06,s*0.12);c.fillRect(p,s*0.72,s*0.06,s*0.12);c.fillRect(s*0.16,p,s*0.12,s*0.06);c.fillRect(s*0.72,p,s*0.12,s*0.06);} },
  construction:function(c,s){ /* hard hat */ c.beginPath();c.arc(s*0.5,s*0.56,s*0.26,Math.PI,2*Math.PI);c.closePath();c.fill(); c.fillRect(s*0.18,s*0.56,s*0.64,s*0.08); c.fillRect(s*0.46,s*0.32,s*0.08,s*0.12); },
  hsc:function(c,s){ /* heart */ c.beginPath();c.moveTo(s*0.5,s*0.8);c.bezierCurveTo(s*0.1,s*0.52,s*0.22,s*0.2,s*0.5,s*0.4);c.bezierCurveTo(s*0.78,s*0.2,s*0.9,s*0.52,s*0.5,s*0.8);c.closePath();c.fill(); },
  childdev:function(c,s){ /* teddy bear */ disc(c,s*0.32,s*0.28,s*0.1); disc(c,s*0.68,s*0.28,s*0.1); disc(c,s*0.5,s*0.4,s*0.2); disc(c,s*0.5,s*0.72,s*0.22); hole(c,function(){disc(c,s*0.43,s*0.38,s*0.03);disc(c,s*0.57,s*0.38,s*0.03);}); },
  classics:function(c,s){ /* greek column */ c.fillRect(s*0.2,s*0.18,s*0.6,s*0.08); c.fillRect(s*0.26,s*0.26,s*0.48,s*0.06); for(var i=0;i<4;i++){c.fillRect(s*(0.3+i*0.12),s*0.32,s*0.07,s*0.46);} c.fillRect(s*0.24,s*0.78,s*0.52,s*0.07); c.fillRect(s*0.18,s*0.85,s*0.64,s*0.07); },
  language:function(c,s){ /* speech bubble */ rrect(c,s*0.14,s*0.2,s*0.72,s*0.5,s*0.1); c.beginPath();c.moveTo(s*0.3,s*0.68);c.lineTo(s*0.3,s*0.86);c.lineTo(s*0.48,s*0.68);c.closePath();c.fill(); hole(c,function(){disc(c,s*0.36,s*0.45,s*0.04);disc(c,s*0.5,s*0.45,s*0.04);disc(c,s*0.64,s*0.45,s*0.04);}); }
};

/* ---- sample filled pixels of an icon → dot points ---- */
function sample(fn,S){var oc=document.createElement('canvas');oc.width=S;oc.height=S;var o=oc.getContext('2d');o.fillStyle='#000';fn(o,S);var d=o.getImageData(0,0,S,S).data,p=[];for(var y=0;y<S;y++)for(var x=0;x<S;x++){if(d[(y*S+x)*4+3]>128)p.push([x,y]);}return p;}

var grid=document.getElementById('grid');
Object.keys(ICON).forEach(function(key){
  var cell=document.createElement('div');cell.className='cell';
  var col=PAL[key]||'#566a72';
  // silhouette
  var c1=document.createElement('canvas');c1.width=c1.height=120;var x1=c1.getContext('2d');x1.fillStyle=col;ICON[key](x1,120);
  // dot version (~210 dots)
  var c2=document.createElement('canvas');c2.width=c2.height=120;var x2=c2.getContext('2d');
  var pts=sample(ICON[key],104),N=210;x2.fillStyle=col;
  for(var i=0;i<N;i++){var p=pts[Math.floor(i*pts.length/N)%pts.length];if(!p)continue;x2.globalAlpha=0.85;x2.beginPath();x2.arc(p[0]/104*120+(Math.random()-.5)*2,p[1]/104*120+(Math.random()-.5)*2,2.1,0,6.2832);x2.fill();}
  var row=document.createElement('div');row.className='row';row.appendChild(c1);row.appendChild(c2);
  cell.appendChild(row);
  var lab=document.createElement('div');lab.className='lab';lab.textContent=key;cell.appendChild(lab);
  var pc=document.createElement('div');pc.className='k';pc.textContent=pts.length+' px';cell.appendChild(pc);
  grid.appendChild(cell);
});
</script>
</body></html>
