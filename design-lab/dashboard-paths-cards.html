<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudyVault — your revision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..800&family=Literata:opsz,wght@7..72,400..600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-body:#f7f6f4; --bg-card:#fff; --text-primary:#1d1c1a; --text-secondary:#54524d; --text-muted:#6e6b64;
    --border-light:#e6e4e0; --border-lighter:#f0eeea; --anchor:#566a72; --wash:#f1efec;
    --acc:#368352; --acc-mute:#5d8a6e;
    --font-head:'Schibsted Grotesk',system-ui,sans-serif; --font-read:'Literata',Georgia,serif;
    --r:6px; --ease:cubic-bezier(.22,1,.36,1);
    --shadow-sm:0 1px 2px rgba(29,28,26,.05);
    --shadow-md:0 2px 4px -2px rgba(29,28,26,.10),0 10px 24px -14px rgba(29,28,26,.16);
    --shadow-lg:0 6px 14px -8px rgba(29,28,26,.18),0 24px 48px -28px rgba(29,28,26,.28);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}   /* class display rules must never override the hidden attribute */
  body{background:var(--bg-body);color:var(--text-primary);font-family:var(--font-read);-webkit-font-smoothing:antialiased;line-height:1.5}
  h1,h2,h3,.ui,button,nav,.kicker,label,input{font-family:var(--font-head)}
  button{cursor:pointer}
  .wrap{max-width:1200px;margin:0 auto;padding:0 clamp(1rem,4vw,2.25rem)}

  /* masthead */
  .mast{display:flex;align-items:center;justify-content:space-between;gap:1rem;height:64px;border-bottom:1px solid var(--border-light);
    position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg-body) 88%,transparent);backdrop-filter:saturate(1.05) blur(7px)}
  .brand{display:inline-flex;align-items:baseline;font-family:var(--font-head);font-weight:500;font-size:1.12rem;letter-spacing:-.012em}
  .brand b{font-weight:800}
  .brand .sv-lock{height:.28em;width:.225em;margin-left:.04em;align-self:baseline;fill:currentColor;flex:none}
  .mast .right{display:flex;align-items:center;gap:.7rem}
  .chip{display:inline-flex;align-items:center;gap:.4rem;white-space:nowrap;font-family:var(--font-head);font-size:.8rem;font-weight:600;color:var(--text-secondary);
    background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--r);padding:.34rem .7rem}
  @media(max-width:620px){ .mast .right #examChip{display:none} }
  @media(max-width:420px){ .mast .right .chip{display:none} }
  .chip svg{width:14px;height:14px;color:var(--text-muted)}
  .chip b{color:var(--text-primary);font-weight:700}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--anchor);color:#fff;font-family:var(--font-head);font-weight:700;font-size:.85rem;display:grid;place-items:center;cursor:pointer}

  /* greeting */
  .hello{margin:1.5rem 0 1.1rem}
  .hello h1{font-size:clamp(1.5rem,2.6vw,1.95rem);font-weight:700;letter-spacing:-.02em}
  .hello p{font-family:var(--font-read);color:var(--text-secondary);font-size:1rem;margin-top:.2rem}

  /* layout */
  .layout{display:grid;grid-template-columns:340px 1fr;gap:1.1rem;align-items:stretch;margin-bottom:1.1rem}
  @media(max-width:900px){ .layout{grid-template-columns:1fr} }
  .card{background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--r);box-shadow:var(--shadow-sm)}
  .col-left{display:flex;flex-direction:column;gap:1.1rem}

  /* continue card */
  .cont{padding:1rem 1.05rem 1.1rem}
  .cont .lbl{font-family:var(--font-head);text-transform:uppercase;letter-spacing:.1em;font-size:.64rem;font-weight:700;color:var(--text-muted);margin-bottom:.7rem}
  .cont .row{display:flex;align-items:center;gap:.7rem}
  .cont .ic{width:44px;height:44px;flex:none;border-radius:5px;display:grid;place-items:center;background:var(--border-lighter)}
  .cont .meta{min-width:0;flex:1}
  .cont .subj{display:block;font-family:var(--font-head);text-transform:uppercase;letter-spacing:.09em;font-size:.62rem;font-weight:700;color:var(--text-muted)}
  .cont .ttl{display:block;font-family:var(--font-read);font-weight:600;font-size:1.05rem;line-height:1.3;color:var(--text-primary);margin-top:.2rem}
  .cont .unit{display:block;font-family:var(--font-head);font-size:.74rem;color:var(--text-muted);margin-top:.32rem}
  .cont .bar{height:4px;border-radius:3px;background:var(--border-lighter);margin:.85rem 0 .9rem;overflow:hidden}
  .cont .bar i{display:block;height:100%;background:var(--anchor);border-radius:3px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;width:100%;padding:.62rem 1rem;border:none;border-radius:var(--r);
    background:var(--anchor);color:#fff;font-family:var(--font-head);font-weight:600;font-size:.95rem;box-shadow:var(--shadow-sm);transition:filter .18s,box-shadow .18s}
  .btn:hover{filter:brightness(.94);box-shadow:var(--shadow-md)}
  .btn svg{width:16px;height:16px;transition:transform .25s var(--ease)}
  .btn:hover svg{transform:translateX(3px)}

  /* ===== navigator (left rail) ===== */
  .nav{padding:.55rem .6rem .55rem}
  .nav-head{display:flex;justify-content:space-between;align-items:baseline;padding:.45rem .55rem .55rem;border-bottom:1px solid var(--border-lighter)}
  .nav-head .kicker{font-family:var(--font-head);text-transform:uppercase;letter-spacing:.1em;font-size:.64rem;font-weight:700;color:var(--text-muted)}
  .nav-head .tally{font-family:var(--font-head);font-size:.72rem;font-weight:600;font-variant-numeric:tabular-nums;color:var(--text-muted)}
  .nav-head .tally b{color:var(--text-secondary);font-weight:700}
  .nav-list{display:flex;flex-direction:column;padding-top:.2rem}
  .srow{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:.6rem;width:100%;padding:.55rem .55rem;border:0;background:transparent;border-radius:var(--r);text-align:left;cursor:pointer;transition:background .14s ease}
  .srow .sw{width:9px;height:9px;border-radius:50%;background:var(--acc);opacity:.82;transition:transform .2s var(--ease),opacity .2s ease}
  .srow .nm{font-family:var(--font-head);font-size:.92rem;font-weight:500;letter-spacing:-.005em;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .14s ease}
  .srow .ct{font-family:var(--font-head);font-size:.8rem;font-variant-numeric:tabular-nums;color:var(--text-muted)}
  .srow .ct b{color:var(--text-primary);font-weight:600}
  .srow .cv{width:13px;height:13px;color:var(--text-muted);transition:transform .3s var(--ease),color .14s ease}
  .srow:hover,.srow:focus-visible{background:var(--wash);outline:none}
  .srow:hover .nm,.srow[aria-expanded="true"] .nm,.srow.is-active .nm{color:var(--text-primary);font-weight:600}
  .srow:hover .sw,.srow[aria-expanded="true"] .sw,.srow.is-active .sw{opacity:1;transform:scale(1.14)}
  .srow[aria-expanded="true"] .cv{transform:rotate(90deg);color:var(--text-secondary)}
  .srow.is-active{background:var(--wash)}
  .srow:focus-visible{outline:2px solid var(--anchor);outline-offset:-2px}

  .units{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .4s var(--ease),visibility 0s linear .4s}
  .srow[aria-expanded="true"]+.units{grid-template-rows:1fr;visibility:visible;transition:grid-template-rows .4s var(--ease),visibility 0s}
  .units>.inner{overflow:hidden;min-height:0;opacity:0;transition:opacity .26s ease .04s;padding:.05rem 0 .3rem}
  .srow[aria-expanded="true"]+.units>.inner{opacity:1}
  .urow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:.4rem;width:100%;padding:.4rem .55rem .4rem 1.5rem;border:0;background:transparent;border-radius:var(--r);text-align:left;cursor:pointer;
    transform:translateY(3px);opacity:0;transition:opacity .24s ease,transform .3s var(--ease),background .14s ease}
  .srow[aria-expanded="true"]+.units .urow{opacity:1;transform:none;transition-delay:calc(var(--i)*22ms)}
  .urow .un{font-family:var(--font-read);font-size:.84rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-secondary);transition:color .14s ease}
  .urow .up{font-family:var(--font-head);font-size:.7rem;font-variant-numeric:tabular-nums;color:var(--text-muted)}
  .urow:hover,.urow:focus-visible{background:var(--wash);outline:none}
  .urow:hover .un,.urow.is-active .un{color:var(--text-primary)}
  .urow.is-active{background:var(--wash)}
  .urow.is-active .un{font-weight:600}
  .urow:focus-visible{outline:2px solid var(--anchor);outline-offset:-2px}
  .nav-loading{padding:1.1rem .55rem;font-family:var(--font-head);font-size:.84rem;color:var(--text-muted)}

  /* ===== stage (right) ===== */
  .stage{position:relative;min-height:620px}
  .screen{overflow:hidden}   /* clip the entrance slide, not the stage (keeps the sticky crumbs in flow) */
  .crumbs{display:flex;align-items:center;gap:.35rem;flex-wrap:wrap;padding:.95rem 1.15rem;border-bottom:1px solid var(--border-lighter);
    position:sticky;top:64px;background:color-mix(in srgb,var(--bg-card) 92%,transparent);backdrop-filter:blur(6px);z-index:8;min-height:48px}
  .crumbs a,.crumbs span{font-family:var(--font-head);font-size:.82rem;font-weight:600;color:var(--text-muted);text-decoration:none}
  .crumbs a{cursor:pointer}
  .crumbs a:hover{color:var(--text-primary)}
  .crumbs .sep{color:var(--border-light);font-weight:400}
  .crumbs .here{color:var(--text-primary)}
  .crumbs .swatch{width:9px;height:9px;border-radius:50%;background:var(--acc);margin-right:.15rem}
  .crumbs .right{margin-left:auto;display:flex;align-items:center;gap:.5rem}

  .screen{padding:1.15rem 1.15rem 1.5rem}
  .screen[hidden]{display:none}
  .screen.in{animation:screenIn .42s var(--ease)}
  @keyframes screenIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* subjects grid */
  .shead{display:flex;align-items:baseline;justify-content:space-between;gap:.6rem;margin:.1rem .15rem 1rem}
  .shead h2{font-family:var(--font-head);font-size:1.12rem;font-weight:700;letter-spacing:-.01em}
  .shead .hint{font-family:var(--font-head);font-size:.76rem;color:var(--text-muted)}
  .subjgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.7rem}
  .subjtile{position:relative;display:flex;flex-direction:column;text-align:left;background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--r);padding:.9rem .95rem 1rem;cursor:pointer;
    transition:transform .18s var(--ease),box-shadow .18s ease,border-color .18s ease}
  .subjtile:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--border-light)}
  .subjtile:focus-visible{outline:2px solid var(--anchor);outline-offset:2px}
  .subjtile .tt{display:flex;align-items:center;gap:.45rem;margin-bottom:.7rem}
  .subjtile .sw{width:10px;height:10px;border-radius:50%;background:var(--ac);flex:none}
  .subjtile .nm{font-family:var(--font-head);font-size:.98rem;font-weight:600;letter-spacing:-.01em;color:var(--text-primary)}
  .subjtile .pbar{height:5px;border-radius:3px;background:var(--border-lighter);overflow:hidden;margin-bottom:.5rem}
  .subjtile .pbar i{display:block;height:100%;border-radius:3px;background:var(--anchor)}
  .subjtile .pm{display:flex;justify-content:space-between;font-family:var(--font-head);font-size:.74rem;color:var(--text-muted);font-variant-numeric:tabular-nums}
  .subjtile .pm b{color:var(--text-secondary);font-weight:700}
  .subjtile .pm .u{color:var(--text-muted);font-weight:500}

  /* topics grid */
  .topicgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:.85rem}
  .topictile{position:relative;text-align:left;background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;
    transition:transform .18s var(--ease),box-shadow .2s ease}
  .topictile:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
  .topictile:focus-visible{outline:2px solid var(--anchor);outline-offset:2px}
  .topictile .thumb{height:96px;background:var(--border-lighter) center/cover no-repeat;position:relative;border-bottom:1px solid var(--border-lighter)}
  .topictile .body{display:flex;flex-direction:column;padding:.7rem .8rem .85rem}
  .topictile .un{font-family:var(--font-head);font-size:.92rem;font-weight:600;letter-spacing:-.005em;color:var(--text-primary);line-height:1.25}
  .topictile .nx{font-family:var(--font-read);font-size:.78rem;color:var(--text-muted);margin-top:.3rem;min-height:1.1em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topictile .pbar{height:4px;border-radius:3px;background:var(--border-lighter);overflow:hidden;margin-top:.6rem}
  .topictile .pbar i{display:block;height:100%;border-radius:3px;background:var(--anchor)}
  .topictile .pm{font-family:var(--font-head);font-size:.72rem;color:var(--text-muted);font-variant-numeric:tabular-nums;margin-top:.4rem}
  .topictile .pm b{color:var(--text-secondary);font-weight:700}

  /* ===== path screen ===== */
  .pathwrap{position:relative;scroll-margin-top:124px}
  @media(prefers-reduced-motion:reduce){ .pbg{transition:none} }

  /* ===== V2: stacked thin landscape lanes (units down, lessons across) ===== */
  .lanes{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:1.4rem;align-items:start;padding-bottom:1.4rem}
  .lane{scroll-margin-top:96px;background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--r);box-shadow:var(--shadow-sm);overflow:hidden;display:flex;flex-direction:column}
  .lane-cap{display:flex;align-items:center;gap:.6rem;padding:.55rem .8rem .55rem;margin:0}
  .lc-nm{font-family:var(--font-head);font-size:.96rem;font-weight:600;color:var(--text-primary);flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lc-ct{font-family:var(--font-head);font-size:.73rem;color:var(--text-muted);font-variant-numeric:tabular-nums;flex:none}
  /* dev preview: step the art through sketch / refined / complete */
  .stager{display:inline-flex;gap:.1rem;background:var(--bg-card);border:1px solid var(--border-light);border-radius:7px;padding:2px;flex:none}
  .stbtn{font-family:var(--font-head);font-size:.62rem;font-weight:700;color:var(--text-muted);background:transparent;border:0;border-radius:5px;padding:.22rem .46rem;cursor:pointer;transition:background .14s,color .14s}
  .stbtn:hover{color:var(--text-secondary)}
  .stbtn.on{background:var(--acc);color:#fff}
  .lane-scroller{position:relative}
  .lane-track{overflow-x:auto;overflow-y:hidden;height:104px;border:0;border-top:1px solid rgba(120,112,98,.16);background:#f6f2ea;
    cursor:grab;user-select:none;-webkit-user-select:none;touch-action:pan-y;scrollbar-width:none;-ms-overflow-style:none}
  .lane-track::-webkit-scrollbar{display:none;height:0;width:0}
  .lane-track.dragging{cursor:grabbing}
  .lane-track.dragging .lnode{cursor:grabbing}
  .lane-arrow{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:1px solid var(--border-light);
    background:rgba(255,255,255,.84);backdrop-filter:blur(4px);color:var(--text-secondary);display:grid;place-items:center;cursor:pointer;z-index:6;
    box-shadow:var(--shadow-md);opacity:.92;transition:opacity .16s var(--ease),background .16s,transform .16s,color .16s}
  .lane-arrow svg{width:18px;height:18px}
  .lane-arrow:hover{background:#fff;color:var(--text-primary);transform:translateY(-50%) scale(1.06)}
  .lane-arrow:active{transform:translateY(-50%) scale(.94)}
  .lane-arrow.l{left:10px} .lane-arrow.r{right:10px}
  .lane-arrow.hide{opacity:0;pointer-events:none;transform:translateY(-50%) scale(.9)}
  /* CARD: full hero at its natural aspect on top; lessons scroll on the rail beneath */
  .lane-hero{position:relative;width:100%;aspect-ratio:3 / 2;overflow:hidden;background:#eceae5;order:0}
  .lane-hero:not(.hasart){background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 12%,#fff),color-mix(in srgb,var(--acc) 4%,#fff))}
  .la-layer{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat;opacity:0;transition:opacity .9s ease}
  .la-layer.show{opacity:1}
  .lane-cap{order:1}
  .lane-scroller{order:2}
  .lane-rail{position:relative;flex:none;height:104px}
  /* nodes: smaller, harmonised with the muted art; the current stop is the one thing that pops */
  .lnode{position:absolute;transform:translate(-50%,-50%);cursor:pointer;z-index:2}
  .lnode .dot{border-radius:50%;display:grid;place-items:center;transition:transform .16s var(--ease),box-shadow .18s;font-family:var(--font-head);font-weight:700}
  .lnode:hover .dot{transform:scale(1.09)}
  .lnode.done .dot{width:31px;height:31px;background:var(--sc,#8a857c);color:#fff;box-shadow:0 1px 3px rgba(29,28,26,.2)}
  .lnode.done .dot svg{width:16px;height:16px}
  .lnode.ahead .dot{width:27px;height:27px;background:rgba(255,255,255,.92);border:1.5px solid #cdc9c2;color:var(--text-muted);font-size:.76rem}
  .lnode.current{z-index:3}
  .lnode.current .dot{width:44px;height:44px;background:var(--acc);color:#fff;box-shadow:0 4px 14px -4px color-mix(in srgb,var(--acc) 55%,transparent),0 0 0 5px color-mix(in srgb,var(--acc) 14%,transparent);animation:lpulse 2.6s var(--ease) infinite}
  .lnode.current .dot svg{width:20px;height:20px}
  @keyframes lpulse{0%,100%{box-shadow:0 4px 14px -4px color-mix(in srgb,var(--acc) 55%,transparent),0 0 0 4px color-mix(in srgb,var(--acc) 16%,transparent)}
    50%{box-shadow:0 4px 14px -4px color-mix(in srgb,var(--acc) 55%,transparent),0 0 0 9px color-mix(in srgb,var(--acc) 5%,transparent)}}
  /* labels: two lines max, fixed width centred under each stop on the clean rail — never overlap */
  .lnode .lt{position:absolute;left:50%;transform:translateX(-50%);width:118px;text-align:center;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    font-family:var(--font-head);font-size:.73rem;font-weight:500;line-height:1.2;color:var(--text-secondary);pointer-events:none}
  .lnode.t-down .lt{top:calc(50% + 19px)}
  .lnode.current .lt{font-weight:700;color:var(--text-primary)}
  .lnode .lt .pill{display:block;font-family:var(--font-head);font-size:.54rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--acc);margin-bottom:.02rem;-webkit-line-clamp:none}

  .pcol{max-width:540px;margin:.2rem auto 0;padding:0 .5rem}
  .pstage-host{position:relative}
  /* two stacked backdrop layers → cross-fade in place (aligned img2img states sharpen, don't morph) */
  .pbg{position:absolute;inset:0;background-position:top center;background-size:100% auto;background-repeat:repeat-y;opacity:0;transition:opacity 1.15s ease;z-index:0;pointer-events:none}
  .pbg.show{opacity:1}
  .node{position:absolute;transform:translate(-50%,-50%);cursor:pointer;z-index:2}
  .node .dot{border-radius:50%;display:grid;place-items:center;transition:transform .18s var(--ease),box-shadow .18s}
  .node:hover .dot{transform:scale(1.07)}
  .node .lt{position:absolute;top:50%;transform:translateY(-50%);font-family:var(--font-read);font-size:.78rem;line-height:1.22;max-width:150px;
    text-shadow:0 0 3px var(--bg-card),0 0 6px var(--bg-card),0 0 11px var(--bg-card),0 0 11px var(--bg-card)}
  .pstage.haspaper .node .lt{text-shadow:0 0 3px var(--bg-body),0 0 6px var(--bg-body),0 0 11px var(--bg-body),0 0 11px var(--bg-body)}
  .node.t-right .lt{left:calc(50% + 34px);text-align:left}
  .node.t-left .lt{right:calc(50% + 34px);text-align:right}
  /* the big "up next" node is 62px — push its label clear so it isn't cramped against the play button */
  .node.current.t-right .lt{left:calc(50% + 47px)}
  .node.current.t-left .lt{right:calc(50% + 47px)}
  .node.done .dot{width:46px;height:46px;background:var(--acc-mute);color:#fff;box-shadow:var(--shadow-sm)}
  .node.done .dot svg{width:22px;height:22px}
  .node.done .lt{color:var(--text-secondary)}
  .node.ahead .dot{width:42px;height:42px;background:var(--bg-card);border:2px solid var(--border-light);color:var(--text-muted);font-family:var(--font-head);font-weight:700;font-size:.9rem}
  .node.ahead .lt{color:var(--text-muted)}
  .node.current{z-index:3}
  .node.current .dot{width:62px;height:62px;background:var(--acc);color:#fff;box-shadow:0 6px 22px -6px color-mix(in srgb,var(--acc) 60%,transparent),0 0 0 6px color-mix(in srgb,var(--acc) 16%,transparent)}
  .node.current .dot svg{width:26px;height:26px}
  .node.current .lt{font-family:var(--font-head);font-weight:700;font-size:.92rem;color:var(--text-primary)}
  .node.current .pill{display:inline-block;font-family:var(--font-head);font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);margin-bottom:.18rem}
  .node.current .dot{animation:pulse 2.6s var(--ease) infinite}
  @keyframes pulse{0%,100%{box-shadow:0 6px 22px -6px color-mix(in srgb,var(--acc) 60%,transparent),0 0 0 5px color-mix(in srgb,var(--acc) 18%,transparent)}
    50%{box-shadow:0 6px 22px -6px color-mix(in srgb,var(--acc) 60%,transparent),0 0 0 11px color-mix(in srgb,var(--acc) 6%,transparent)}}
  .pfoot{display:flex;align-items:center;gap:.8rem;max-width:540px;margin:0 auto;padding:.2rem .5rem 0}
  .pfoot .line{flex:1;height:1px;background:var(--border-light)}
  .pfoot .lbl{font-family:var(--font-head);text-transform:uppercase;letter-spacing:.11em;font-size:.66rem;font-weight:700;color:var(--text-muted);white-space:nowrap}
  .pfoot .ct{font-family:var(--font-head);font-size:.66rem;font-weight:600;color:var(--text-muted);font-variant-numeric:tabular-nums}

  @media(prefers-reduced-motion:reduce){
    .node.current .dot{animation:none} .node:hover .dot{transform:none}
    .screen.in{animation:none} .units,.units>.inner,.urow{transition:none!important}
  }

  /* toast */
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(14px);background:rgba(29,28,26,.94);color:#f5f3f0;
    font-family:var(--font-head);font-size:.84rem;font-weight:600;padding:.6rem .9rem;border-radius:8px;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;
    transition:opacity .2s ease,transform .3s var(--ease);z-index:50;max-width:90vw}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast b{color:#fff}

  /* week strip */
  .week{margin:0 0 2.4rem;display:flex;align-items:center;justify-content:space-between;gap:1rem 1.4rem;flex-wrap:wrap;
    background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--r);box-shadow:var(--shadow-sm);padding:.9rem 1.5rem}
  .week .wlbl{font-family:var(--font-head);text-transform:uppercase;letter-spacing:.1em;font-size:.64rem;font-weight:700;color:var(--text-muted)}
  .week .stat{font-family:var(--font-head);font-size:.92rem;color:var(--text-secondary)}
  .week .stat b{color:var(--text-primary);font-weight:700}

  /* ===== ⓘ info popover (shared) ===== */
  .info{position:relative;display:inline-flex;flex:none}
  .info > button{width:16px;height:16px;border-radius:50%;border:1px solid var(--border-light);background:var(--bg-card);color:var(--text-muted);
    font-family:var(--font-head);font-style:italic;font-weight:700;font-size:.66rem;line-height:1;display:grid;place-items:center;cursor:pointer;transition:color .14s,border-color .14s}
  .info > button:hover{color:var(--text-secondary);border-color:var(--text-muted)}
  .info .pop{position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%) translateY(-4px);width:min(280px,72vw);z-index:40;
    background:var(--text-primary);color:#f3f1ee;font-family:var(--font-read);font-size:.78rem;line-height:1.45;padding:.7rem .8rem;border-radius:8px;box-shadow:var(--shadow-lg);
    opacity:0;visibility:hidden;transition:opacity .16s ease,transform .2s var(--ease),visibility 0s linear .16s}
  .info.open .pop{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0);transition:opacity .16s ease,transform .2s var(--ease)}
  .info .pop::before{content:"";position:absolute;bottom:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-bottom-color:var(--text-primary)}

  /* ===== Today's session ===== */
  .today{background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--r);box-shadow:var(--shadow-sm);
    padding:1.05rem 1.25rem;margin:0 0 1.1rem;display:flex;align-items:center;gap:1.2rem 1.5rem;flex-wrap:wrap}
  .today .tmain{flex:1;min-width:260px}
  .today .tk{font-family:var(--font-head);text-transform:uppercase;letter-spacing:.1em;font-size:.64rem;font-weight:700;color:var(--text-muted);display:flex;align-items:center;gap:.5rem}
  .today h2{font-family:var(--font-head);font-size:1.18rem;font-weight:700;letter-spacing:-.015em;margin:.32rem 0 .55rem}
  .today .plan{display:flex;flex-wrap:wrap;gap:.4rem}
  .today .chip2{display:inline-flex;align-items:center;gap:.4rem;font-family:var(--font-head);font-size:.78rem;font-weight:600;color:var(--text-secondary);
    background:var(--bg-body);border:1px solid var(--border-light);border-radius:30px;padding:.34rem .7rem}
  .today .chip2 .d{width:7px;height:7px;border-radius:50%;background:var(--cd,var(--anchor));flex:none}
  .today .tside{display:flex;flex-direction:column;align-items:flex-end;gap:.6rem}
  .today .tmeta{font-family:var(--font-head);font-size:.76rem;color:var(--text-muted);text-align:right;line-height:1.5}
  .today .tmeta b{color:var(--text-secondary);font-weight:700}
  .today .start{display:inline-flex;align-items:center;gap:.5rem;padding:.7rem 1.3rem;border:none;border-radius:var(--r);background:var(--anchor);color:#fff;
    font-family:var(--font-head);font-weight:700;font-size:1rem;box-shadow:var(--shadow-sm);transition:filter .18s,box-shadow .18s}
  .today .start:hover{filter:brightness(.94);box-shadow:var(--shadow-md)}
  .today .start svg{width:17px;height:17px}
  @media(max-width:560px){ .today .tside{align-items:stretch;width:100%} .today .start{justify-content:center} }

  /* ===== card headers (warm-up / radio) ===== */
  .ch{display:flex;align-items:center;gap:.5rem;margin-bottom:.55rem}
  .ch .ct{font-family:var(--font-head);font-size:1rem;font-weight:700;letter-spacing:-.01em}
  .ch .ico{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;background:var(--border-lighter);color:var(--text-secondary);flex:none}
  .ch .ico svg{width:17px;height:17px}

  /* ===== Warm-up ===== */
  .warmup{padding:1rem 1.05rem 1.1rem}
  .warmup p{font-family:var(--font-read);font-size:.85rem;color:var(--text-secondary);margin:0 0 .85rem;line-height:1.45}
  .warmup .mixrow{display:flex;gap:.45rem;margin-bottom:.9rem}
  .warmup .mix{flex:1;text-align:center;background:var(--bg-body);border:1px solid var(--border-light);border-radius:var(--r);padding:.5rem .3rem}
  .warmup .mix b{display:block;font-family:var(--font-head);font-size:1.1rem;font-weight:700;color:var(--text-primary)}
  .warmup .mix span{font-family:var(--font-head);font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted)}

  /* ===== Revision Radio ===== */
  .radio{padding:1rem 1.05rem 1.05rem}
  .radio .stand{font-family:var(--font-read);font-size:.78rem;color:var(--text-muted);margin:-.2rem 0 .8rem;line-height:1.4}
  .radio .np{display:flex;align-items:center;gap:.7rem;margin-bottom:.7rem}
  .radio .art{width:50px;height:50px;border-radius:8px;flex:none;display:grid;place-items:center;color:#fff;position:relative;overflow:hidden;
    background:var(--np,var(--anchor))}
  .radio .art svg{width:22px;height:22px;opacity:.92}
  .radio .npmeta{min-width:0;flex:1}
  .radio .npsub{font-family:var(--font-head);text-transform:uppercase;letter-spacing:.08em;font-size:.6rem;font-weight:700;color:var(--text-muted)}
  .radio .nptitle{font-family:var(--font-read);font-weight:600;font-size:.92rem;line-height:1.25;color:var(--text-primary);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:.1rem}
  .radio .scrub{height:4px;border-radius:3px;background:var(--border-lighter);overflow:hidden;margin:.2rem 0 .35rem;cursor:pointer}
  .radio .scrub i{display:block;height:100%;width:0%;background:var(--anchor);border-radius:3px}
  .radio .time{display:flex;justify-content:space-between;font-family:var(--font-head);font-size:.66rem;color:var(--text-muted);font-variant-numeric:tabular-nums;margin-bottom:.5rem}
  .radio .ctrls{display:flex;align-items:center;justify-content:center;gap:.9rem;margin-bottom:.85rem}
  .radio .ctrls button{background:transparent;border:0;color:var(--text-secondary);cursor:pointer;display:grid;place-items:center;border-radius:50%;transition:color .14s,background .14s}
  .radio .ctrls button:hover{color:var(--text-primary);background:var(--wash)}
  .radio .ctrls .sk{width:34px;height:34px} .radio .ctrls .sk svg{width:18px;height:18px}
  .radio .ctrls .pp{width:48px;height:48px;background:var(--anchor);color:#fff;box-shadow:var(--shadow-sm)} .radio .ctrls .pp:hover{background:var(--anchor);filter:brightness(.94)} .radio .ctrls .pp svg{width:22px;height:22px}
  .radio .qhead{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--border-lighter);padding-top:.6rem;margin-bottom:.3rem}
  .radio .qhead .ql{font-family:var(--font-head);text-transform:uppercase;letter-spacing:.09em;font-size:.6rem;font-weight:700;color:var(--text-muted)}
  .radio .qhead a{font-family:var(--font-head);font-size:.72rem;font-weight:600;color:var(--anchor);cursor:pointer;text-decoration:none}
  .radio .qrow{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:.55rem;padding:.4rem .3rem;border-radius:var(--r);cursor:pointer;transition:background .14s}
  .radio .qrow:hover{background:var(--wash)}
  .radio .qrow .qd{width:8px;height:8px;border-radius:50%;background:var(--qd,var(--anchor));opacity:.8}
  .radio .qrow .qt{font-family:var(--font-read);font-size:.8rem;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .radio .qrow .qt small{color:var(--text-muted);font-family:var(--font-head);font-size:.66rem}
  .radio.playing .art::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 120%,rgba(255,255,255,.32),transparent 60%);animation:pl 2.4s ease-in-out infinite}
  @keyframes pl{0%,100%{opacity:.4}50%{opacity:.9}}

  /* ===== Weak spots strip ===== */
  .weakspots{background:var(--bg-body);border:1px solid var(--border-light);border-radius:var(--r);padding:.7rem .85rem;margin:0 .15rem 1rem;
    display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
  .weakspots .wl{font-family:var(--font-head);text-transform:uppercase;letter-spacing:.09em;font-size:.62rem;font-weight:700;color:var(--text-muted);display:inline-flex;align-items:center;gap:.4rem}
  .weakspots .wl svg{width:14px;height:14px;color:var(--weak,#a16e63)}
  .weakspots .ws{display:inline-flex;align-items:center;gap:.4rem;font-family:var(--font-head);font-size:.78rem;font-weight:600;color:var(--text-secondary);
    background:var(--bg-card);border:1px solid var(--border-light);border-radius:30px;padding:.32rem .7rem;cursor:pointer;transition:border-color .14s,color .14s}
  .weakspots .ws:hover{border-color:var(--text-muted);color:var(--text-primary)}
  .weakspots .ws .d{width:7px;height:7px;border-radius:50%;background:var(--cd,var(--anchor))}

  /* ===== Warm-up quiz modal ===== */
  .qmodal{position:fixed;inset:0;z-index:60;background:rgba(29,28,26,.55);backdrop-filter:blur(3px);display:grid;place-items:center;padding:1rem;
    opacity:0;visibility:hidden;transition:opacity .2s ease,visibility 0s linear .2s}
  .qmodal.open{opacity:1;visibility:visible;transition:opacity .2s ease}
  .qcard{width:min(560px,96vw);background:var(--bg-card);border:1px solid var(--border-light);border-radius:12px;box-shadow:var(--shadow-lg);padding:1.3rem 1.4rem 1.4rem;
    transform:translateY(10px);transition:transform .26s var(--ease)}
  .qmodal.open .qcard{transform:none}
  .qcard .qtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem}
  .qcard .qprog{font-family:var(--font-head);font-size:.72rem;font-weight:700;color:var(--text-muted);font-variant-numeric:tabular-nums}
  .qcard .qx{background:transparent;border:0;color:var(--text-muted);cursor:pointer;font-size:1.1rem;line-height:1}
  .qcard .qbar{height:4px;border-radius:3px;background:var(--border-lighter);overflow:hidden;margin-bottom:1rem}
  .qcard .qbar i{display:block;height:100%;background:var(--anchor);border-radius:3px;transition:width .3s var(--ease)}
  .qcard .qtag{font-family:var(--font-head);text-transform:uppercase;letter-spacing:.08em;font-size:.62rem;font-weight:700;margin-bottom:.5rem;display:inline-flex;align-items:center;gap:.4rem}
  .qcard .qtag .d{width:8px;height:8px;border-radius:50%;background:var(--cd,var(--anchor))}
  .qcard .qq{font-family:var(--font-read);font-size:1.12rem;font-weight:600;line-height:1.4;color:var(--text-primary);margin-bottom:1rem}
  .qcard .qopts{display:flex;flex-direction:column;gap:.5rem}
  .qcard .qopt{text-align:left;font-family:var(--font-read);font-size:.92rem;color:var(--text-primary);background:var(--bg-body);border:1.5px solid var(--border-light);
    border-radius:var(--r);padding:.7rem .85rem;cursor:pointer;transition:border-color .14s,background .14s}
  .qcard .qopt:hover{border-color:var(--text-muted)}
  .qcard .qopt.correct{border-color:var(--good,#5f8c6d);background:color-mix(in srgb,var(--good,#5f8c6d) 12%,var(--bg-card))}
  .qcard .qopt.wrong{border-color:var(--weak,#a16e63);background:color-mix(in srgb,var(--weak,#a16e63) 12%,var(--bg-card))}
  .qcard .qopt[disabled]{cursor:default}
  .qcard .qreveal{font-family:var(--font-read);font-size:.95rem;color:var(--text-secondary);background:var(--bg-body);border:1px solid var(--border-light);border-radius:var(--r);padding:.85rem;line-height:1.5}
  .qcard .qfoot{display:flex;justify-content:space-between;align-items:center;margin-top:1.1rem;gap:.6rem}
  .qcard .qskip{background:transparent;border:0;font-family:var(--font-head);font-size:.82rem;font-weight:600;color:var(--text-muted);cursor:pointer}
  .qcard .qnext{display:inline-flex;align-items:center;gap:.45rem;padding:.6rem 1.15rem;border:none;border-radius:var(--r);background:var(--anchor);color:#fff;
    font-family:var(--font-head);font-weight:600;font-size:.92rem;cursor:pointer;box-shadow:var(--shadow-sm)}
  .qcard .qnext[disabled]{opacity:.4;cursor:default}
  .qcard .qdone{text-align:center;padding:1rem 0 .4rem}
  .qcard .qdone .score{font-family:var(--font-head);font-size:2.4rem;font-weight:800;letter-spacing:-.02em}
  .qcard .qdone p{font-family:var(--font-read);color:var(--text-secondary);margin:.3rem 0 1.1rem}

  /* ===== left rail: Continue + Warm-up fill the column as two even tiles ===== */
  .col-left{max-height:660px}   /* cap so they don't stretch tall on the long path screen */
  .col-left > .card{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-between}

  /* ===== Revision Radio — full-width player bar along the bottom ===== */
  .radio.bar{margin:0 0 1.1rem;padding:.95rem 1.25rem 1.05rem;min-height:0}
  .radio.bar .rtop{display:flex;align-items:center;gap:.55rem;margin-bottom:.75rem;flex-wrap:wrap}
  .radio.bar .rtop .ico{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;background:var(--border-lighter);color:var(--text-secondary);flex:none}
  .radio.bar .rtop .ico svg{width:17px;height:17px}
  .radio.bar .rtop .ct{font-family:var(--font-head);font-size:1rem;font-weight:700;letter-spacing:-.01em}
  .radio.bar .rstand{font-family:var(--font-read);font-size:.78rem;color:var(--text-muted);margin-left:.2rem}
  @media(max-width:620px){ .radio.bar .rstand{display:none} }
  .radio.bar .rmain{display:grid;grid-template-columns:1fr 2fr;gap:1.6rem;align-items:center;margin-bottom:.9rem}
  @media(max-width:760px){ .radio.bar .rmain{grid-template-columns:1fr;gap:.9rem} }
  .radio.bar .rnow{display:flex;align-items:center;gap:.7rem;min-width:0}
  .radio.bar .rnow .nptitle{-webkit-line-clamp:1}
  .radio.bar .rplayer{min-width:0}
  .radio.bar .rplayer .ctrls{margin:0 0 .4rem}
  .radio.bar .rplayer .scrub{margin:.1rem 0 .3rem}
  .radio.bar .rqhead{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--border-lighter);padding-top:.7rem;margin-bottom:.55rem}
  .radio.bar .rqhead .ql{font-family:var(--font-head);text-transform:uppercase;letter-spacing:.09em;font-size:.6rem;font-weight:700;color:var(--text-muted)}
  .radio.bar .rqhead a{font-family:var(--font-head);font-size:.72rem;font-weight:600;color:var(--anchor);cursor:pointer;text-decoration:none}
  .radio.bar #rQueue{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
  @media(max-width:760px){ .radio.bar #rQueue{grid-template-columns:1fr} }
  .radio.bar #rQueue .qrow{background:var(--bg-body);border:1px solid var(--border-light);padding:.5rem .6rem}

  /* =========================================================
     HOME v2 — two doors, one screen, no page scroll
     ========================================================= */
  .home{max-width:1180px;margin:0 auto;height:calc(100dvh - 65px);display:flex;flex-direction:column;padding:1rem clamp(1rem,4vw,2.25rem) 1.15rem;gap:.85rem;overflow:hidden}
  .home .hi{font-family:var(--font-head);font-size:1.45rem;font-weight:700;letter-spacing:-.02em;flex:none}
  @media(max-height:680px){ .home .hi{font-size:1.2rem} }
  .doors{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1.25fr 1fr;gap:.95rem}
  @media(max-width:820px){ .doors{grid-template-columns:1fr} }
  .kick{font-family:var(--font-head);text-transform:uppercase;letter-spacing:.12em;font-size:.64rem;font-weight:700;color:var(--text-muted)}

  /* GUIDED — the hero */
  .guided{display:flex;flex-direction:column;padding:1.4rem 1.5rem;min-height:0}
  .guided h2{font-family:var(--font-head);font-size:1.5rem;font-weight:700;letter-spacing:-.02em;margin:.45rem 0 1.1rem}
  @media(max-height:720px){ .guided{padding:1.15rem 1.3rem} .guided h2{font-size:1.3rem;margin:.35rem 0 .85rem} }
  .plan{list-style:none;margin:0 0 auto;padding:0;display:flex;flex-direction:column;gap:.15rem}
  .plan li{display:grid;grid-template-columns:30px 1fr;align-items:center;gap:.85rem;padding:.62rem .4rem;border-radius:var(--r);cursor:pointer;transition:background .14s}
  .plan li:hover{background:var(--wash)}
  .plan li .n{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--border-light);display:grid;place-items:center;font-family:var(--font-head);font-weight:700;font-size:.82rem;color:var(--text-secondary)}
  .plan li b{font-family:var(--font-read);font-weight:600;font-size:1rem;color:var(--text-primary);display:block;line-height:1.25}
  .plan li small{font-family:var(--font-head);font-size:.74rem;color:var(--text-muted)}
  .guided .gfoot{display:flex;align-items:center;gap:1.1rem;margin-top:1.05rem;flex-wrap:wrap}
  .guided .gstart{display:inline-flex;align-items:center;gap:.5rem;padding:.72rem 1.5rem;border:none;border-radius:var(--r);background:var(--anchor);color:#fff;font-family:var(--font-head);font-weight:700;font-size:1.02rem;box-shadow:var(--shadow-sm);transition:filter .18s,box-shadow .18s}
  .guided .gstart:hover{filter:brightness(.94);box-shadow:var(--shadow-md)}
  .guided .gstart svg{width:16px;height:16px}
  .guided .gmeta{font-family:var(--font-head);font-size:.78rem;color:var(--text-muted)}

  /* REVISION — the calm library */
  .revision{display:flex;flex-direction:column;padding:1.1rem 1.2rem 1rem;min-height:0}
  .revision h2{font-family:var(--font-head);font-size:1.05rem;font-weight:700;letter-spacing:-.01em;margin:.4rem 0 .7rem}
  .subjlist{list-style:none;margin:0;padding:0 .15rem;overflow:auto;flex:1;min-height:0}
  .subjrow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:.35rem .8rem;width:100%;text-align:left;background:transparent;border:0;cursor:pointer;padding:.5rem .45rem;border-radius:var(--r);transition:background .14s}
  .subjrow:hover{background:var(--wash)}
  .subjrow .snm{font-family:var(--font-head);font-size:.92rem;font-weight:500;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .subjrow:hover .snm{font-weight:600}
  .subjrow .sct{font-family:var(--font-head);font-size:.78rem;font-variant-numeric:tabular-nums;color:var(--text-muted)}
  .subjrow .sbar{grid-column:1/-1;height:3px;border-radius:2px;background:var(--border-lighter);overflow:hidden;margin-top:.18rem}
  .subjrow .sbar i{display:block;height:100%;border-radius:2px;background:var(--sc,#a7a39b);opacity:.85}

  /* REVISION RADIO — slim one-line bar */
  .rbar{flex:none;display:flex;align-items:center;gap:1rem;background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--r);box-shadow:var(--shadow-sm);padding:.55rem .9rem}
  .rbar .rlab{display:flex;align-items:center;gap:.5rem;flex:none}
  .rbar .rlab .ico{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;background:var(--border-lighter);color:var(--text-secondary);flex:none}
  .rbar .rlab .ico svg{width:17px;height:17px}
  .rbar .rlab .ct{font-family:var(--font-head);font-size:.92rem;font-weight:700;white-space:nowrap}
  .rbar .rnow{display:flex;align-items:baseline;gap:.45rem;min-width:0;flex:1}
  .rbar .rnow .npsub{font-family:var(--font-head);text-transform:uppercase;letter-spacing:.07em;font-size:.58rem;font-weight:700;color:var(--text-muted);flex:none}

  // smooth horizontal scroll via setInterval (native smooth + rAF are unreliable on these tracks)

  function buildProgress(){
    var TD=0,TL=0; SHELF.forEach(function(s){ TD+=s.done; TL+=s.total; });
    var pct=TL?Math.round(TD/TL*100):0;
    var stat=document.getElementById('progStat');
    if(stat) stat.textContent='You’ve revised '+TD+' of '+TL+' lessons across '+SHELF.length+' subjects. Here’s where you stand and what’s slipping.';
    var pf=document.getElementById('poFill'); if(pf) pf.style.width=pct+'%';
    var pt=document.getElementById('potxt'); if(pt) pt.textContent=pct+'%';
    /* momentum strip (this-week / streak are demo until per-activity tracking lands) */
    var days=Math.max(0,Math.round((new Date('2027-05-11T09:00:00')-new Date())/86400000));
    var stats=[ {b:String(TD), s:'lessons revised'}, {b:'+6', s:'this week'}, {b:String(SHELF.length), s:'subjects on the go'}, {b:String(days), s:'days to your first GCSE'} ];
    var ps=document.getElementById('pstats'); if(ps){ ps.innerHTML='';
      stats.forEach(function(c){ var d=document.createElement('div'); d.className='pstat'; d.innerHTML='<b>'+esc(c.b)+'</b><span>'+esc(c.s)+'</span>'; ps.appendChild(d); }); }
    /* where you stand — subjects, strongest first */
    var sl=document.getElementById('standList'); if(sl){ sl.innerHTML='';
      SHELF.map(function(s,i){ return {s:s,i:i,p:s.total?s.done/s.total:0}; })
        .sort(function(a,b){ return b.p-a.p; })
        .forEach(function(o){ var s=o.s, p=Math.round(o.p*100);
          var b=document.createElement('button'); b.className='standrow'; b.style.setProperty('--sc',s.swatch);
          b.innerHTML='<span class="srtop"><span class="snm">'+esc(s.n)+'</span><span class="spc">'+p+'%</span></span>'+
            '<span class="srbar"><i style="width:'+p+'%"></i></span>'+
            '<span class="src">'+s.done+' / '+s.total+' lessons</span>';
          b.addEventListener('click',function(){ showTopics(o.i); });
          sl.appendChild(b); }); }
    /* needs a look — the topics fading fastest, click straight into them */
    var wl=document.getElementById('weakList'); if(wl){ wl.innerHTML='';
      var ws=weakSpots(5);
      if(!ws.length){ wl.innerHTML='<p class="wempty">Nothing slipping right now — keep it up.</p>'; }
      ws.forEach(function(w){ var s=SHELF[w.si];
        var b=document.createElement('button'); b.className='weakrow'; b.style.setProperty('--sc',w.swatch);
        b.innerHTML='<span class="wsub">'+esc(s.n)+'</span><span class="wnm">'+esc(w.name)+'</span>'+
          '<span class="wmeta">'+w.pct+'% done · pick this back up</span>';
        b.addEventListener('click',function(){ showPath(w.si,w.ui); });
        wl.appendChild(b); }); }
  }

  function buildPage(){
    buildGuided(); buildRevisionList(); buildRadio(); showHome();
  }

  document.getElementById('crumbHome').addEventListener('click',showHome);
  document.getElementById('brand').style.cursor='pointer';
  document.getElementById('brand').addEventListener('click',showHome);
  (function(){ var pb=document.getElementById('progHome'); if(pb) pb.addEventListener('click',showHome);
    var av=document.querySelector('.avatar'); if(av){ av.style.cursor='pointer'; av.title='Your progress'; av.addEventListener('click',showProgress); } })();

  loadAll();
})();
</script>
</body>
</html>
