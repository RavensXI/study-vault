<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Learning path — StudyVault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..800&family=Literata:opsz,wght@7..72,400..600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-body:#f7f6f4; --bg-card:#fff; --text-primary:#1d1c1a; --text-secondary:#54524d; --text-muted:#6e6b64;
    --border-light:#e6e4e0; --border-lighter:#f0eeea; --anchor:#566a72;
    --acc:#368352; --acc-mute:#5d8a6e;
    --font-head:'Schibsted Grotesk',system-ui,sans-serif; --font-read:'Literata',Georgia,serif;
    --r:6px; --ease:cubic-bezier(.22,1,.36,1);
    --shadow-sm:0 1px 2px rgba(29,28,26,.05);
    --shadow-md:0 2px 4px -2px rgba(29,28,26,.10),0 10px 24px -14px rgba(29,28,26,.16);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg-body);color:var(--text-primary);font-family:var(--font-read);-webkit-font-smoothing:antialiased;line-height:1.5}
  h1,h2,h3,.ui{font-family:var(--font-head)}

  /* header */
  .phead{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg-body) 90%,transparent);backdrop-filter:saturate(1.05) blur(8px);
    border-bottom:1px solid var(--border-light)}
  .phead-in{max-width:560px;margin:0 auto;padding:.9rem 1.25rem;display:flex;align-items:center;gap:.8rem}
  .back{font-family:var(--font-head);font-size:.82rem;font-weight:600;color:var(--text-muted);text-decoration:none;display:inline-flex;align-items:center;gap:.3rem}
  .back svg{width:14px;height:14px}
  .phead .mid{flex:1;text-align:center}
  .phead h1{font-size:1.02rem;font-weight:500;letter-spacing:-.012em}
  .phead h1 b{font-weight:800}
  .phead .prog{font-family:var(--font-head);font-size:.72rem;font-weight:600;color:var(--text-muted);font-variant-numeric:tabular-nums}
  .swatch{width:11px;height:11px;border-radius:50%;background:var(--acc);flex:none}

  /* path column */
  .wrap{max-width:560px;margin:0 auto;padding:1.4rem 1rem 5rem}
  .chapter{display:flex;align-items:center;gap:.8rem;margin:1.6rem 0 .4rem}
  .chapter:first-child{margin-top:.4rem}
  .chapter .line{flex:1;height:1px;background:var(--border-light)}
  .chapter .lbl{font-family:var(--font-head);text-transform:uppercase;letter-spacing:.11em;font-size:.66rem;font-weight:700;color:var(--text-muted);white-space:nowrap}
  .chapter .ct{font-family:var(--font-head);font-size:.66rem;font-weight:600;color:var(--text-muted);font-variant-numeric:tabular-nums}

  .unit{position:relative;width:100%}
  .unit svg.conn{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}

  .node{position:absolute;transform:translate(-50%,-50%);cursor:pointer}
  .node .dot{border-radius:50%;display:grid;place-items:center;transition:transform .18s var(--ease),box-shadow .18s}
  .node:hover .dot{transform:scale(1.07)}
  /* lesson title sits in a frosted-paper chip so it reads cleanly over the sketch */
  .node .lt{position:absolute;top:50%;transform:translateY(-50%);font-family:var(--font-read);font-size:.78rem;line-height:1.22;max-width:150px;
    background:rgba(247,246,244,.74);-webkit-backdrop-filter:blur(2.5px) saturate(1.05);backdrop-filter:blur(2.5px) saturate(1.05);
    padding:.18rem .46rem;border-radius:6px}
  .node.t-right .lt{left:calc(50% + 34px);text-align:left}
  .node.t-left .lt{right:calc(50% + 34px);text-align:right}

  /* node states */
  .node.done .dot{width:46px;height:46px;background:var(--acc-mute);color:#fff;box-shadow:var(--shadow-sm)}
  .node.done .dot svg{width:22px;height:22px}
  .node.done .lt{color:var(--text-secondary)}

  .node.ahead .dot{width:42px;height:42px;background:var(--bg-card);border:2px solid var(--border-light);color:var(--text-muted);font-family:var(--font-head);font-weight:700;font-size:.9rem}
  .node.ahead .lt{color:var(--text-muted)}

  .node.current{z-index:3}
  .node.current .dot{width:62px;height:62px;background:var(--acc);color:#fff;box-shadow:0 6px 22px -6px color-mix(in srgb,var(--acc) 60%,transparent),0 0 0 6px color-mix(in srgb,var(--acc) 16%,transparent)}
  .node.current .dot svg{width:26px;height:26px}
  .node.current .lt{font-family:var(--font-head);font-weight:700;font-size:.92rem;color:var(--text-primary)}
  .node.current .pill{display:inline-block;font-family:var(--font-head);font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);margin-bottom:.18rem}
  .node.current .dot{animation:pulse 2.6s var(--ease) infinite}
  @keyframes pulse{0%,100%{box-shadow:0 6px 22px -6px color-mix(in srgb,var(--acc) 60%,transparent),0 0 0 5px color-mix(in srgb,var(--acc) 18%,transparent)}
    50%{box-shadow:0 6px 22px -6px color-mix(in srgb,var(--acc) 60%,transparent),0 0 0 11px color-mix(in srgb,var(--acc) 6%,transparent)}}
  @media(prefers-reduced-motion:reduce){ .node.current .dot{animation:none} .node:hover .dot{transform:none} }

  .loading{max-width:560px;margin:3rem auto;text-align:center;font-family:var(--font-head);color:var(--text-muted)}
  .note{max-width:560px;margin:1rem auto 0;padding:0 1rem;font-family:var(--font-head);font-size:.74rem;color:var(--text-muted);text-align:center}
  .bgtoggle{position:fixed;top:62px;left:50%;transform:translateX(-50%);z-index:30;display:flex;flex-wrap:wrap;justify-content:center;gap:3px;max-width:min(94vw,760px);background:rgba(255,255,255,.94);border:1px solid var(--border-light);border-radius:9px;padding:4px;box-shadow:var(--shadow-md);backdrop-filter:blur(6px)}
  .bgtoggle button{font-family:var(--font-head);font-size:.74rem;font-weight:600;color:var(--text-muted);background:transparent;border:0;border-radius:6px;padding:.42rem .8rem;cursor:pointer;transition:background .12s,color .12s}
  .bgtoggle button:hover{background:var(--border-lighter);color:var(--text-secondary)}
  .bgtoggle button.on{background:var(--acc);color:#fff}
</style>
</head>
<body>
  <header class="phead">
    <div class="phead-in">
      <a class="back" href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>All subjects</a>
      <span class="mid"><h1 id="subjName">Combined Science</h1><span class="prog" id="prog">—</span></span>
      <span class="swatch" id="swatch"></span>
    </div>
  </header>

  <div class="bgtoggle" id="bgtoggle">
    <button data-bg="">No backdrop</button>
    <button data-bg="path-bg-sketch.png">Sketch</button>
    <button data-bg="path-bg-engraving.png">Engraving</button>
    <button data-bg="path-bg-riso.png">Riso</button>
    <button data-bg="path-bg-watercolour.png">Watercolour</button>
    <button data-bg="path-bg-line.png">Single-line</button>
    <button data-bg="path-bg-stipple.png">Stipple</button>
    <button data-bg="path-bg-starmap.png">Star-map</button>
    <button data-bg="path-bg-blueprint.png">Blueprint</button>
  </div>

  <main class="wrap" id="path"><div class="loading">Loading your path…</div></main>
  <p class="note">Prototype · winding learning path · real lessons · nodes need no bespoke art (Duolingo-style)</p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function(){
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // ---- which subject (override with ?subject=slug&accent=hex&name=...&mastery=0.42) ----
  var qs=new URLSearchParams(location.search);
  var SUBJECT={
    slug: qs.get('subject')||'science-aqa',
    name: qs.get('name')||'Combined Science',
    accent: qs.get('accent')||'#368352',
    mastery: parseFloat(qs.get('mastery')||'0.42'),
    keep: qs.get('keep')? qs.get('keep').split('|') : null,
    keepRe: qs.get('subject')? null : /Paper/,     // default science → the 6 papers
    bg: qs.get('bg')||null                          // ?bg=path-bg-sketch.png → lay the path over a generated backdrop
  };
  document.documentElement.style.setProperty('--acc', SUBJECT.accent);
  // a muted partner for done nodes
  (function(){ function hx(h){h=h.replace('#','');return[parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
    var a=hx(SUBJECT.accent), g=[138,135,128], m=[Math.round(a[0]+(g[0]-a[0])*0.18),Math.round(a[1]+(g[1]-a[1])*0.18),Math.round(a[2]+(g[2]-a[2])*0.18)];
    document.documentElement.style.setProperty('--acc-mute','rgb('+m.join(',')+')'); })();
  (function(){ var p=SUBJECT.name.split(' '), last=p.pop();   // weight-split like the wordmark: emphasis on the key noun
    document.getElementById('subjName').innerHTML=(p.length?p.join(' ')+' ':'')+'<b>'+last+'</b>'; })();

  var sb=window.supabase.createClient('https://baipckgywpnwapobwtsy.supabase.co','sb_publishable_PYj2nvjclOsUWmZPolhRuA_1OvYhnc2');
  var CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>';
  var PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>';
  function esc(t){ return (t==null?'':String(t)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  sb.from('lessons').select('lesson_number, title, units!inner(slug, name, subjects!inner(slug, school_id))')
    .eq('status','live').is('units.subjects.school_id',null).eq('units.subjects.slug',SUBJECT.slug).limit(800)
    .then(function(res){
      var rows=res.data||[];
      if(SUBJECT.keep) rows=rows.filter(function(r){ return SUBJECT.keep.indexOf(r.units.name)>=0; });
      else if(SUBJECT.keepRe) rows=rows.filter(function(r){ return SUBJECT.keepRe.test(r.units.name); });
      if(!rows.length){ document.getElementById('path').innerHTML='<div class="loading">No lessons found.</div>'; return; }
      // group by unit, order, flatten
      var byU={}, order=[];
      rows.forEach(function(r){ var u=r.units; if(!byU[u.slug]){ byU[u.slug]={name:u.name,lessons:[]}; order.push(u.slug); } byU[u.slug].lessons.push({no:r.lesson_number,t:r.title}); });
      var units=order.map(function(k){ return byU[k]; });
      units.sort(function(a,b){ return a.name<b.name?-1:(a.name>b.name?1:0); });
      units.forEach(function(u){ u.lessons.sort(function(a,b){ return a.no-b.no; }); });
      var total=0; units.forEach(function(u){ total+=u.lessons.length; });
      var done=Math.round(SUBJECT.mastery*total), gi=0;
      units.forEach(function(u){ u.lessons.forEach(function(L){ L.gi=gi++; L.done=L.gi<done; L.current=(L.gi===done); }); });
      document.getElementById('prog').textContent=done+' of '+total+' lessons';
      render(units);
    }, function(){ document.getElementById('path').innerHTML='<div class="loading">Could not load.</div>'; });

  /* ---- a clean winding path; the generated backdrop carries the topic, the path just climbs ---- */
  var NS='http://www.w3.org/2000/svg';
  function E(tag,a){ var e=document.createElementNS(NS,tag); for(var k in a) e.setAttribute(k,a[k]); return e; }

  function render(units){
    var host=document.getElementById('path'); host.innerHTML='';
    var W=Math.min(host.clientWidth,520), cx=W/2, amp=Math.min(64,(W-300)/2), vGap=96, chGap=74, unitGap=52, botPad=74, topPad=48;
    var total=0; units.forEach(function(u,ui){ total += chGap + u.lessons.length*vGap + (ui<units.length-1?unitGap:0); });
    var H=total+botPad+topPad;
    function Y(yb){ return H-botPad-yb; }        // lesson 1 at the BOTTOM; you climb up
    var stage=document.createElement('div'); stage.id='pstage'; stage.style.cssText='position:relative;width:'+W+'px;height:'+H+'px;margin:0 auto'; host.appendChild(stage);
    var conn=E('svg',{width:W,height:H,viewBox:'0 0 '+W+' '+H}); conn.style.cssText='position:absolute;inset:0;pointer-events:none;overflow:visible'; stage.appendChild(conn);
    var yb=0, gidx=0, currentEl=null;
    units.forEach(function(u,ui){
      var n=u.lessons.length, base=yb+chGap;
      var pos=u.lessons.map(function(L,j){ return {x:cx+Math.sin((gidx+j)*0.85)*amp, top:Y(base+j*vGap)}; });   // gentle weave, stays in the clear central lane
      // one smooth winding path: walked part solid, the rest a faint dashed trail ahead
      function seg(a,b,stroke,wd,op,dash){ if(b<=a) return; var d='M '+pos[a].x.toFixed(1)+' '+pos[a].top.toFixed(1); for(var k=a+1;k<=b;k++){ var p0=pos[k-1],p1=pos[k],my=(p0.top+p1.top)/2; d+=' C '+p0.x.toFixed(1)+' '+my.toFixed(1)+' '+p1.x.toFixed(1)+' '+my.toFixed(1)+' '+p1.x.toFixed(1)+' '+p1.top.toFixed(1); } var pa=E('path',{d:d,fill:'none',stroke:stroke,'stroke-width':wd,'stroke-linecap':'round',opacity:op}); if(dash) pa.setAttribute('stroke-dasharray',dash); conn.appendChild(pa); }
      var lastDone=-1; u.lessons.forEach(function(L,j){ if(L.done) lastDone=j; });
      seg(0,Math.max(0,lastDone),SUBJECT.accent,3.6,0.6);
      seg(Math.max(0,lastDone),n-1,'#cdcac4',2.6,0.95,'1 7');
      // chapter label (foot of the unit — you climb up into it)
      var doneInUnit=u.lessons.filter(function(L){return L.done;}).length;
      var ch=document.createElement('div'); ch.className='chapter'; ch.style.cssText='position:absolute;left:0;width:100%;margin:0;top:'+(Y(yb+chGap*0.5)-9)+'px';
      ch.innerHTML='<span class="line"></span><span class="lbl">'+esc(u.name)+'</span><span class="ct">'+doneInUnit+' / '+n+'</span><span class="line"></span>';
      stage.appendChild(ch);
      // nodes (weaving; title sits toward the centre, clear of the margin art)
      u.lessons.forEach(function(L,j){
        var node=document.createElement('div'); node.className='node '+(pos[j].x<cx?'t-right':'t-left')+' '+(L.current?'current':(L.done?'done':'ahead'));
        node.style.left=pos[j].x+'px'; node.style.top=pos[j].top+'px';
        node.innerHTML='<span class="dot">'+(L.current?PLAY:(L.done?CHECK:L.no))+'</span><span class="lt">'+(L.current?'<span class="pill">Up next</span><br>':'')+esc(L.t)+'</span>';
        node.addEventListener('click',function(){ console.log('open lesson',L.no,L.t); });
        stage.appendChild(node);
        if(L.current) currentEl=node;
      });
      gidx+=n; yb=base+n*vGap+(ui<units.length-1?unitGap:0);
    });
    if(currentEl) setTimeout(function(){ currentEl.scrollIntoView({block:'center',behavior:reduce?'auto':'smooth'}); },140);
    applyBg(SUBJECT.bg||'');
  }
  function applyBg(bg){
    var st=document.getElementById('pstage'); if(st) st.style.background = bg?('url(assets/'+bg+') top center / 100% auto repeat-y'):'none';
    var bar=document.getElementById('bgtoggle'); if(bar) [].slice.call(bar.children).forEach(function(b){ b.classList.toggle('on',(b.getAttribute('data-bg')||'')===(bg||'')); });
  }
  (function(){ var bar=document.getElementById('bgtoggle'); if(bar) [].slice.call(bar.children).forEach(function(b){ b.addEventListener('click',function(){ applyBg(b.getAttribute('data-bg')); }); }); })();
})();
</script>
</body>
</html>
