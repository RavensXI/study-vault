<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stage 1 — top-5 misconception widgets</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
 :root{--accent:#8a6a4f}
 body{background:#faf8f5;color:#2d2a26;font-family:Inter,system-ui,sans-serif;margin:0;padding:1.1rem;max-width:760px}
 h1{font-family:'Source Serif 4',serif;font-size:1.3rem;margin:0 0 .2rem}
 p.note{color:#8d8880;font-size:.84rem;margin:0 0 1.2rem;line-height:1.5}
 .ref{font-size:.71rem;text-transform:uppercase;letter-spacing:.09em;color:#8d8880;font-weight:700;margin:1.6rem 0 .45rem}
 .holder{background:#fff;border:1px solid #e8e3db;border-radius:16px;padding:1rem;box-shadow:0 1px 2px rgba(45,42,38,.04)}
 .fail{background:#fbeee9;border:1px solid #e3c4b8;border-radius:12px;padding:.8rem 1rem;color:#9a3a25;font-size:.86rem}
 .m{font-size:.72rem;color:#8d8880;margin:.35rem 0 0}
</style></head><body>
<h1>Stage 1 — top-5 misconception widgets</h1>
<p class="note">One widget per canonical misconception, reused across every lesson that carries it. Opus subagents on the subscription, harness-verified. 50 lesson placements from these five builds.</p>
<div id="mount"></div>
<script>
(async function(){
 const F=[['greenhouse-effect-reemission-not-blanket','Re-emitted, not trapped · 12 lessons · science, geography, astronomy','#0e7490'],
          ['current-not-used-up','Current is not used up · 12 lessons · science, electronics, engineering','#ea580c'],
          ['state-change-energy-plateau','The temperature plateau · 9 lessons · combined + separate sciences','#7c3aed'],
          ['synapse-electrical-to-chemical','Crossing the synapse · 9 lessons · biology + psychology','#be185d'],
          ['conservation-of-energy-dispersal','Dispersed, not destroyed · 8 lessons · combined + separate sciences','#b45309']];
 const m=document.getElementById('mount');
 for(const [id,ref,acc] of F){
  const h=document.createElement('div'); h.className='ref'; h.textContent=ref.replace(/&amp;/g,'&'); m.appendChild(h);
  const box=document.createElement('div'); box.className='holder'; box.style.setProperty('--accent',acc); m.appendChild(box);
  try{
   const src=await fetch('/scripts/widget_pipeline/builds/'+id+'.js?t='+Date.now()).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text();});
   const t=document.createElement('script'); t.textContent=src; document.head.appendChild(t);
   if(!window.SVWidget||!window.SVWidget.mount) throw new Error('no SVWidget.mount');
   const root=document.createElement('div'); box.appendChild(root);
   window.SVWidget.mount(root,{accent:acc,reducedMotion:false});
   window.SVWidget=null;
   const mm=document.createElement('p'); mm.className='m';
   mm.textContent='measured height: '+Math.round(box.getBoundingClientRect().height)+'px at '+window.innerWidth+'px wide';
   m.appendChild(mm);
  }catch(e){ box.innerHTML='<div class="fail">'+id+' — '+e.message+'</div>'; }
 }
})();
</script></body></html>
