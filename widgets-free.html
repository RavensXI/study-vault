<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unconstrained interactives — review</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{ --accent:#8a6a4f; }
  body{background:#faf8f5;color:#2d2a26;font-family:Inter,system-ui,sans-serif;
    max-width:780px;margin:0;padding:1.2rem}
  h1{font-family:'Source Serif 4',serif;font-size:1.35rem;margin:0 0 .3rem}
  p.note{color:#8d8880;font-size:.85rem;margin:0 0 1.4rem;line-height:1.5}
  .ref{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;
    color:#8d8880;font-weight:700;margin:2rem 0 .5rem}
  .holder{background:#fff;border:1px solid #e8e3db;border-radius:16px;padding:1.1rem;
    box-shadow:0 1px 2px rgba(45,42,38,.04)}
  .fail{background:#fbeee9;border:1px solid #e3c4b8;border-radius:12px;
    padding:.8rem 1rem;color:#9a3a25;font-size:.88rem}
</style>
</head>
<body>
<h1>Unconstrained interactives</h1>
<p class="note">Same lessons, same specs — but the builder was free to use the whole browser
instead of painting everything into one canvas. Nothing constrains the design now except
"one self-contained file, mounts into a div, no network".</p>
<div id="mount"></div>
<script>
(async function () {
  const FILES = [
    ['match-the-minister', 'History AQA · Elizabethan England L2 · Key ministers', '#b45309'],
    ['insulate-to-target', 'Combined Science AQA · Physics P1 L2 · Efficiency', '#ea580c']
  ];
  const mount = document.getElementById('mount');
  for (const [id, ref, accent] of FILES) {
    const h = document.createElement('div');
    h.className = 'ref'; h.textContent = ref; mount.appendChild(h);
    const holder = document.createElement('div');
    holder.className = 'holder';
    holder.style.setProperty('--accent', accent);
    mount.appendChild(holder);
    try {
      const src = await fetch('/scripts/widget_pipeline/builds/' + id + '.js?t=' + Date.now())
        .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); });
      const tag = document.createElement('script');
      tag.textContent = src;
      document.head.appendChild(tag);
      if (!window.SVWidget || !window.SVWidget.mount) throw new Error('no window.SVWidget.mount');
      const root = document.createElement('div');
      holder.appendChild(root);
      window.SVWidget.mount(root, { accent: accent, reducedMotion: false });
      window.SVWidget = null;
    } catch (e) {
      holder.innerHTML = '<div class="fail">' + id + ' — ' + e.message + '</div>';
    }
  }
})();
</script>
</body>
</html>
