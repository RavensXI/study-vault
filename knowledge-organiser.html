<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revision Notes — StudyVault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <meta name="theme-color" content="#2d2a26">
  <style>
    .ko-page{max-width:880px;margin:0 auto;padding:24px 20px 80px}

    .ko-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;margin-bottom:20px;background:var(--bg-card,#fff);border:1px solid rgba(45,42,38,.06);border-radius:12px;font-size:.86rem;position:sticky;top:12px;z-index:50;box-shadow:0 2px 10px rgba(20,18,15,.05)}
    .ko-toolbar a,.ko-toolbar button{background:transparent;border:1px solid rgba(45,42,38,.12);color:var(--text-primary,#2d2a26);font-family:inherit;font-size:.86rem;padding:6px 12px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
    .ko-toolbar a:hover,.ko-toolbar button:hover{background:#faf8f5}
    body.dark-mode .ko-toolbar a:hover,body.dark-mode .ko-toolbar button:hover{background:#3a3631}
    .ko-toolbar button[aria-pressed="true"]{background:var(--text-primary,#2d2a26);color:var(--bg-body,#faf8f5);border-color:var(--text-primary,#2d2a26)}
    .ko-print-btn{background:var(--text-primary,#2d2a26) !important;color:var(--bg-body,#faf8f5) !important;border-color:var(--text-primary,#2d2a26) !important;font-weight:600;margin-left:auto}
    .ko-print-btn:hover{background:#1f1c19 !important}
    .ko-toolbar-sep{width:1px;height:22px;background:rgba(45,42,38,.1);margin:0 4px}
    .ko-toolbar-label{font-size:.78rem;color:var(--text-secondary,#7a7367);font-weight:500}

    .ko-paper{background:#fff;border-radius:14px;padding:36px 40px;border:1px solid rgba(45,42,38,.06);box-shadow:0 4px 18px rgba(20,18,15,.05);min-height:60vh;transition:max-width .2s ease}
    body.dark-mode .ko-paper{background:#2a2826;border-color:rgba(245,241,236,.08)}
    /* Annotation mode — narrow column + extra vertical gap so students have
       room to write notes by hand around / between the highlights. */
    body.ko-annotate-mode .ko-paper{max-width:560px;margin-left:auto;margin-right:auto}
    body.ko-annotate-mode .ko-item{margin-bottom:24px;padding-bottom:14px;border-bottom:1px dashed rgba(45,42,38,.12)}
    body.dark-mode.ko-annotate-mode .ko-item{border-bottom-color:rgba(245,241,236,.15)}
    body.ko-annotate-mode .ko-item:last-child{border-bottom:none}
    /* Ink saver — strip the full-bleed highlight background; keep only the
       coloured edge bar so it's still obvious which colour each note was. */
    body.ko-ink-saver .ko-snippet{background:transparent !important;padding-left:14px}
    body.ko-ink-saver .ko-snippet-bar{width:4px}

    .ko-header{margin-bottom:24px;border-bottom:2px solid var(--text-primary,#2d2a26);padding-bottom:14px}
    body.dark-mode .ko-header{border-bottom-color:#f5f1ec}
    .ko-title{font-family:'Source Serif 4',Georgia,serif;font-weight:700;font-size:1.8rem;margin:0 0 6px;color:var(--text-primary,#2d2a26);outline:none;min-height:1.2em}
    .ko-title:focus{background:rgba(45,42,38,.04);border-radius:4px;padding:0 4px}
    body.dark-mode .ko-title:focus{background:rgba(245,241,236,.06)}
    .ko-subline{font-size:.92rem;color:var(--text-secondary,#5d564b);margin:0;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
    .ko-subline span{outline:none}
    .ko-subline span:focus{background:rgba(45,42,38,.04);border-radius:4px;padding:0 4px}

    .ko-subject{margin-bottom:28px;page-break-inside:avoid}
    .ko-subject-name{font-family:'Source Serif 4',Georgia,serif;font-weight:700;font-size:1.2rem;color:var(--text-primary,#2d2a26);margin:0 0 14px;padding-bottom:5px;border-bottom:1px solid rgba(45,42,38,.18)}
    body.dark-mode .ko-subject-name{border-bottom-color:rgba(245,241,236,.2)}
    .ko-unit{margin-bottom:22px}
    .ko-unit-name{font-family:'Source Serif 4',Georgia,serif;font-weight:600;font-size:1.05rem;color:var(--text-primary,#2d2a26);margin:0 0 12px;letter-spacing:.005em}
    body.dark-mode .ko-unit-name{color:#f5f1ec}

    .ko-lesson{margin-bottom:18px;page-break-inside:avoid}
    .ko-lesson-title{font-weight:600;font-size:.95rem;color:var(--text-secondary,#5d564b);margin:0 0 10px;font-style:italic}
    body.dark-mode .ko-lesson-title{color:#c8c2ba}

    .ko-items{display:flex;flex-direction:column;gap:9px}
    .ko-item{padding:7px 0;break-inside:avoid;page-break-inside:avoid}
    .ko-snippet{position:relative;padding:7px 11px 7px 14px;border-radius:6px;font-size:.94rem;line-height:1.55;color:#2d2a26}
    .ko-snippet--yellow{background:#fef9c3}
    .ko-snippet--green{background:#dcfce7}
    .ko-snippet--pink{background:#fce7f3}
    .ko-snippet--blue{background:#dbeafe}
    body.dark-mode .ko-snippet{color:#f5f1ec}
    body.dark-mode .ko-snippet--yellow{background:rgba(234,179,8,.55)}
    body.dark-mode .ko-snippet--green{background:rgba(34,197,94,.45)}
    body.dark-mode .ko-snippet--pink{background:rgba(236,72,153,.45)}
    body.dark-mode .ko-snippet--blue{background:rgba(59,130,246,.5)}
    .ko-snippet-bar{position:absolute;left:0;top:4px;bottom:4px;width:3px;border-radius:2px}
    .ko-snippet-bar--yellow{background:#eab308}
    .ko-snippet-bar--green{background:#22c55e}
    .ko-snippet-bar--pink{background:#ec4899}
    .ko-snippet-bar--blue{background:#3b82f6}
    .ko-note{margin:5px 0 0 14px;padding:5px 10px;background:transparent;font-size:.86rem;color:var(--text-primary,#3d3a35);border-left:2px solid rgba(45,42,38,.3);font-style:italic;line-height:1.5}
    body.dark-mode .ko-note{color:#dcd6cc;border-left-color:rgba(245,241,236,.35)}

    .ko-empty{text-align:center;padding:60px 20px;color:var(--text-secondary,#5d564b)}
    .ko-empty h2{font-family:'Source Serif 4',Georgia,serif;font-weight:600;margin:0 0 8px;color:var(--text-primary,#2d2a26)}

    .ko-disclaimer{margin-top:36px;padding-top:14px;border-top:1px dashed rgba(45,42,38,.18);font-size:.78rem;color:var(--text-secondary,#7a7367);text-align:center;letter-spacing:.02em}
    body.dark-mode .ko-disclaimer{border-top-color:rgba(245,241,236,.18)}

    /* --- Print stylesheet --- */
    @media print {
      body.ko-annotate-mode .ko-paper { max-width: 14cm !important; }
      body.ko-annotate-mode .ko-item { margin-bottom: 1.4cm; padding-bottom: 0.6cm; border-bottom: 1px dashed #999; }
      body.ko-ink-saver .ko-snippet { background: transparent !important; padding-left: 14px; }
      body.ko-ink-saver .ko-snippet-bar { width: 4px; }
      html, body { background: #fff !important; color: #000 !important; }
      .no-print, .page-header, .ko-toolbar { display: none !important; }
      .ko-page { max-width: none; margin: 0; padding: 12mm 14mm; }
      .ko-paper { background: #fff !important; border: none !important; box-shadow: none !important; padding: 0 !important; }
      .ko-title, .ko-subject-name, .ko-lesson-title, .ko-snippet, .ko-note, .ko-subline, .ko-disclaimer { color: #000 !important; }
      .ko-subject-name, .ko-header { border-color: #000 !important; }
      /* Strip overlay tints for paper — they waste ink and look strange */
      body[class*="overlay-"] { background: #fff !important; }
      /* Drop highlight saturation slightly for paper so ink isn't lurid */
      .ko-snippet--yellow { background: #fef9c3 !important; }
      .ko-snippet--green { background: #dcfce7 !important; }
      .ko-snippet--pink { background: #fce7f3 !important; }
      .ko-snippet--blue { background: #dbeafe !important; }
      @page { margin: 0; }
    }

    @media (max-width: 640px) {
      .ko-paper { padding: 24px 20px; }
    }
  </style>

  <script>
  (function () {
    try {
      var p = JSON.parse(localStorage.getItem('studyvault-a11y') || '{}');
      var classes = [];
      if (p.darkMode) classes.push('dark-mode');
      if (p.dyslexia) classes.push('dyslexia-font');
      if (p.fontSize === -1) classes.push('font-size-down-1');
      else if (p.fontSize === 1) classes.push('font-size-up-1');
      else if (p.fontSize === 2) classes.push('font-size-up-2');
      // Note: overlay deliberately NOT applied on KO page by default — it
      // clashes with the highlight colours visually. User can re-enable it
      // via the toolbar if they want, but the print stylesheet always strips it.
      if (classes.length) document.documentElement.setAttribute('data-a11y-classes', classes.join(' '));
    } catch (e) {}
  })();
  </script>
</head>
<body>

  <main class="ko-page">
    <div class="ko-toolbar no-print">
      <a href="/highlights.html">← Back to highlights</a>
      <span class="ko-toolbar-sep"></span>
      <span class="ko-toolbar-label">Reading:</span>
      <button id="ko-dark" type="button" aria-pressed="false">Dark mode</button>
      <button id="ko-dys" type="button" aria-pressed="false">Dyslexia font</button>
      <span class="ko-toolbar-sep"></span>
      <button id="ko-notes" type="button" aria-pressed="true" title="Include the notes you wrote alongside each highlight">Show notes</button>
      <button id="ko-annotate" type="button" aria-pressed="false" title="Narrow the page and add extra space between highlights so you can write annotations by hand">Annotation space</button>
      <button id="ko-ink" type="button" aria-pressed="false" title="Strip the highlight backgrounds — saves ink when printing, keeps the coloured edge bar so you can still tell which colour each note was">Ink saver</button>
      <button class="ko-print-btn" id="ko-print" type="button">Print</button>
    </div>

    <article class="ko-paper">
      <header class="ko-header">
        <h1 class="ko-title" contenteditable="true" spellcheck="false">Revision Notes</h1>
        <div class="ko-subline">
          <span contenteditable="true" spellcheck="false" id="ko-name">Name: </span>
          <span contenteditable="true" spellcheck="false" id="ko-date"></span>
        </div>
      </header>

      <div id="ko-content"></div>

      <p class="ko-disclaimer">For revision only. Not for use in an exam.</p>
    </article>
  </main>

  <script>
  (function () {
    var A11Y_KEY = 'studyvault-a11y';
    var KO_DATA_KEY = 'sv-ko-data';

    // ---- a11y ----
    function loadA11y() {
      try { return JSON.parse(localStorage.getItem(A11Y_KEY) || '{}'); } catch (e) { return {}; }
    }
    function saveA11y(p) { localStorage.setItem(A11Y_KEY, JSON.stringify(p)); }
    function applyA11y(p) {
      var b = document.body;
      b.classList.toggle('dark-mode', !!p.darkMode);
      b.classList.toggle('dyslexia-font', !!p.dyslexia);
      b.className = b.className.replace(/\bfont-size-\S+/g, '').trim();
      if (p.fontSize === -1) b.classList.add('font-size-down-1');
      else if (p.fontSize === 1) b.classList.add('font-size-up-1');
      else if (p.fontSize === 2) b.classList.add('font-size-up-2');
      document.getElementById('ko-dark').setAttribute('aria-pressed', !!p.darkMode);
      document.getElementById('ko-dys').setAttribute('aria-pressed', !!p.dyslexia);
    }
    document.getElementById('ko-dark').addEventListener('click', function () {
      var p = loadA11y(); p.darkMode = !p.darkMode; saveA11y(p); applyA11y(p);
    });
    document.getElementById('ko-dys').addEventListener('click', function () {
      var p = loadA11y(); p.dyslexia = !p.dyslexia; saveA11y(p); applyA11y(p);
    });

    // ---- notes toggle ----
    var showNotes = true;
    document.getElementById('ko-notes').addEventListener('click', function () {
      showNotes = !showNotes;
      this.setAttribute('aria-pressed', showNotes);
      document.querySelectorAll('.ko-note').forEach(function (n) {
        n.style.display = showNotes ? '' : 'none';
      });
    });

    document.getElementById('ko-annotate').addEventListener('click', function () {
      var on = this.getAttribute('aria-pressed') !== 'true';
      this.setAttribute('aria-pressed', on);
      document.body.classList.toggle('ko-annotate-mode', on);
    });

    document.getElementById('ko-ink').addEventListener('click', function () {
      var on = this.getAttribute('aria-pressed') !== 'true';
      this.setAttribute('aria-pressed', on);
      document.body.classList.toggle('ko-ink-saver', on);
    });

    document.getElementById('ko-print').addEventListener('click', function () {
      window.print();
    });

    // ---- render ----
    function esc(s) {
      return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function todayStr() {
      var d = new Date();
      var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      return 'Date: ' + d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
    }

    function render() {
      document.getElementById('ko-date').textContent = todayStr();

      var raw;
      try { raw = sessionStorage.getItem(KO_DATA_KEY); } catch (e) {}
      var data = raw ? JSON.parse(raw) : null;
      var content = document.getElementById('ko-content');

      if (!data || !data.subjects || !data.subjects.length) {
        content.innerHTML =
          '<div class="ko-empty">' +
            '<h2>Nothing selected yet</h2>' +
            '<p>Go back to <a href="/highlights.html">My Highlights</a>, tick the ones you want to bring forward, then click <strong>Build revision notes</strong>.</p>' +
          '</div>';
        return;
      }

      // Render one lesson — flat list of highlights, no category grouping.
      function renderLesson(lesson) {
        var out = '<div class="ko-lesson">';
        out +=     '<h4 class="ko-lesson-title">' + esc(lesson.lesson_title) + '</h4>';
        out +=     '<div class="ko-items">';
        lesson.highlights.forEach(function (h) {
          var color = h.color || 'yellow';
          out += '<div class="ko-item">';
          out +=   '<div class="ko-snippet ko-snippet--' + esc(color) + '">';
          out +=     '<span class="ko-snippet-bar ko-snippet-bar--' + esc(color) + '"></span>';
          out +=     esc(h.text);
          out +=   '</div>';
          if (h.note) {
            out += '<p class="ko-note">' + esc(h.note) + '</p>';
          }
          out += '</div>';
        });
        out +=     '</div>';
        out += '</div>';
        return out;
      }

      // Support both new 3-level payload (subject → units → lessons) and
      // legacy 2-level (subject → lessons) just in case an older highlights
      // page produced the data before this update shipped.
      var html = '';
      data.subjects.forEach(function (subj) {
        html += '<section class="ko-subject">';
        html +=   '<h2 class="ko-subject-name">' + esc(subj.name) + '</h2>';
        if (subj.units && subj.units.length) {
          subj.units.forEach(function (unit) {
            html += '<div class="ko-unit">';
            html +=   '<h3 class="ko-unit-name">' + esc(unit.name) + '</h3>';
            unit.lessons.forEach(function (lesson) { html += renderLesson(lesson); });
            html += '</div>';
          });
        } else if (subj.lessons) {
          subj.lessons.forEach(function (lesson) { html += renderLesson(lesson); });
        }
        html += '</section>';
      });
      content.innerHTML = html;
    }

    applyA11y(loadA11y());
    render();
  })();
  </script>
</body>
</html>
