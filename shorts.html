<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StudyVault — Shorts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..800&family=Literata:ital,opsz,wght@0,7..72,400..600;1,7..72,400..500&family=Young+Serif&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f2efe9; --card:#ffffff; --ink:#1d1c1a; --sec:#54524d; --mut:#7f7c75; --line:#e7e3dc;
    --r:16px; --acc:#566a72;
    --font-head:'Schibsted Grotesk',system-ui,sans-serif;
    --font-read:'Literata',Georgia,serif;
    --shadow:0 1px 2px rgba(29,28,26,.05), 0 30px 60px -34px rgba(29,28,26,.55);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);font-family:var(--font-head);color:var(--ink);overscroll-behavior:none}

  /* soft brand rail top-left, doesn't fight the feed */
  .brand{position:fixed;top:14px;left:20px;z-index:30;font-family:'Young Serif',serif;font-weight:400;font-size:1.05rem;color:#1d1c1a;opacity:.9;pointer-events:none}
  .brand .brandlock{height:.30em;width:auto;margin-left:1px;vertical-align:baseline}
  /* narrow view: the card spans the brand's column, so drop the wordmark a
     touch and start the card below it — keeps it off the progress bar */
  @media (max-width:820px){
    .brand{top:17px}
    .slide{padding-top:54px}
  }

  .feed{height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
  .feed::-webkit-scrollbar{display:none}
  .slide{height:100dvh;scroll-snap-align:start;display:grid;place-items:center;padding:2.4vh 1rem}

  /* ---- a short: framed portrait card floating on the warm ground ---- */
  .short{position:relative;height:100%;aspect-ratio:9/16;max-width:min(94vw,52vh);border-radius:var(--r);overflow:hidden;
    background:#0d0d0f;box-shadow:var(--shadow);border:1px solid color-mix(in srgb,var(--acc) 34%,var(--line))}
  .short video{width:100%;height:100%;object-fit:cover;display:block;background:#0d0d0f}
  .short .scrim{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(to bottom,rgba(0,0,0,.62) 0%,rgba(0,0,0,.24) 17%,transparent 38%,transparent 100%)}
  .short .prog{position:absolute;top:0;left:0;right:0;height:3px;background:rgba(255,255,255,.22)}
  .short .prog i{display:block;height:100%;width:0;background:var(--acc)}
  .short .meta{position:absolute;left:1rem;right:4.4rem;top:.9rem;color:#fff}
  .short .subj{display:inline-flex;align-items:center;gap:.35rem;font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;
    background:color-mix(in srgb,var(--acc) 92%,#000);padding:.24rem .55rem;border-radius:6px;margin-bottom:.55rem}
  .short .topic{font-weight:700;font-size:1.12rem;line-height:1.16;text-shadow:0 1px 10px rgba(0,0,0,.55);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .short .lesson{font-family:var(--font-read);font-size:.82rem;color:rgba(255,255,255,.86);margin-top:.25rem;text-shadow:0 1px 8px rgba(0,0,0,.55)}
  .short .rail{position:absolute;right:.7rem;top:.9rem;display:flex;flex-direction:column;gap:.8rem;align-items:center}
  .railbtn{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.13);backdrop-filter:blur(7px);
    border:1px solid rgba(255,255,255,.22);color:#fff;display:grid;place-items:center;cursor:pointer;transition:transform .15s,background .15s}
  .railbtn:hover{background:rgba(255,255,255,.24);transform:scale(1.06)}
  .railbtn:active{transform:scale(.94)}
  .railbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .railbtn.on{background:var(--acc);border-color:var(--acc)}
  .rail small{display:block;text-align:center;font-size:.56rem;font-weight:600;color:rgba(255,255,255,.8);margin-top:.25rem;text-shadow:0 1px 4px rgba(0,0,0,.6)}
  .railwrap{display:flex;flex-direction:column;align-items:center}
  .tap-hint{position:absolute;inset:auto 0 42%;text-align:center;color:#fff;font-size:.8rem;opacity:0;transition:opacity .3s;pointer-events:none;text-shadow:0 1px 8px rgba(0,0,0,.6)}
  .short.muted .tap-hint{opacity:.9}
  /* chrome (meta + rail + scrim) fades after CHROME_MS of playback; back on any touch */
  .short .scrim,.short .meta,.short .rail{transition:opacity .45s ease}
  .short.chrome-hidden .scrim,.short.chrome-hidden .meta,.short.chrome-hidden .rail{opacity:0}
  .short.chrome-hidden .rail{pointer-events:none}
  /* big play glyph while the student has the short paused */
  .short .playpause{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .18s ease}
  .short.paused .playpause{opacity:1}
  .short .playpause span{width:74px;height:74px;border-radius:50%;background:rgba(0,0,0,.4);backdrop-filter:blur(3px);display:grid;place-items:center}
  .short .playpause svg{width:32px;height:32px;fill:#fff;margin-left:4px}

  /* ---- a recall check: native warm card in the same scroll ---- */
  .check{position:relative;height:100%;aspect-ratio:9/16;max-width:min(94vw,52vh);border-radius:var(--r);
    background:var(--card);box-shadow:var(--shadow);border:1px solid var(--line);
    display:flex;flex-direction:column;padding:1.9rem 1.5rem}
  .check .kick{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--acc);display:flex;align-items:center;gap:.4rem}
  .check .from{font-family:var(--font-read);font-size:.82rem;color:var(--mut);margin:.15rem 0 1.2rem}
  .check .q{font-family:var(--font-read);font-size:1.3rem;line-height:1.32;color:var(--ink);margin-bottom:1.3rem}
  .opt{font-family:var(--font-head);font-weight:500;font-size:.98rem;text-align:left;width:100%;background:var(--bg);
    border:1px solid var(--line);border-radius:11px;padding:.85rem .95rem;margin-bottom:.65rem;cursor:pointer;color:var(--ink);
    transition:border-color .15s,background .15s,transform .1s}
  .opt:hover{border-color:color-mix(in srgb,var(--acc) 45%,var(--line))}
  .opt:active{transform:scale(.99)}
  .opt.correct{border-color:#2f7d57;background:#edf6f0;color:#1e5b3e;font-weight:600}
  .opt.wrong{border-color:#c0533a;background:#fbeee9;color:#9a3a25}
  .check .foot{margin-top:auto;font-family:var(--font-read);font-size:.82rem;color:var(--mut);min-height:1.2em}
  .check .foot b{color:var(--ink)}
  .check .nextq{display:block;margin-top:.65rem;font-family:var(--font-head);font-weight:600;font-size:.88rem;
    background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:.55rem 1.05rem;cursor:pointer}
  .check .nextq:hover{border-color:color-mix(in srgb,var(--acc) 45%,var(--line))}
  .swipe{position:absolute;left:0;right:0;bottom:.7rem;text-align:center;font-size:.72rem;color:var(--mut);opacity:0;transition:opacity .3s}
  .check.answered .swipe{opacity:1}

  /* ---- done for today ---- */
  .done{height:100%;aspect-ratio:9/16;max-width:min(94vw,52vh);border-radius:var(--r);background:var(--card);
    box-shadow:var(--shadow);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:2rem;gap:.2rem}
  .done .flame{font-size:2.4rem}
  .done h2{font-family:var(--font-head);font-weight:800;font-size:1.6rem;margin:.4rem 0 .1rem;color:var(--ink)}
  .done p{font-family:var(--font-read);font-size:1rem;color:var(--sec);max-width:22ch;line-height:1.4;margin:.2rem 0 1.3rem}
  .done .stat{display:flex;gap:1.6rem;margin-bottom:1.6rem}
  .done .stat div{font-family:var(--font-head)} .done .stat b{display:block;font-size:1.5rem;font-weight:800;color:var(--acc)}
  .done .stat small{font-size:.72rem;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
  .done button{font-family:var(--font-head);font-weight:600;font-size:.92rem;background:transparent;color:var(--sec);border:1px solid var(--line);border-radius:10px;padding:.7rem 1.3rem;cursor:pointer}
  .done button:hover:not(:disabled){border-color:color-mix(in srgb,var(--acc) 45%,var(--line))}
  .done button:disabled{opacity:.55;cursor:default}

  /* ---- fullscreen toggle (desktop + Android; hidden on phones, which are
     edge-to-edge automatically) ---- */
  .fsbtn{position:fixed;right:18px;bottom:18px;z-index:30;width:44px;height:44px;border-radius:12px;
    background:var(--card);border:1px solid var(--line);color:var(--sec);display:grid;place-items:center;
    cursor:pointer;box-shadow:0 1px 2px rgba(29,28,26,.06);transition:border-color .15s,transform .1s}
  .fsbtn:hover{border-color:color-mix(in srgb,var(--acc) 45%,var(--line))}
  .fsbtn:active{transform:scale(.95)}
  .fsbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  body.imm .fsbtn{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.22);color:#fff;backdrop-filter:blur(7px);
    right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px))}

  /* ---- immersive: the card becomes the screen. Applied on phones via
     media query and everywhere via the fullscreen API (body.imm). ---- */
  body.imm .brand{display:none}
  body.imm .slide{padding:0}
  body.imm .short,body.imm .check,body.imm .done{
    width:100vw;max-width:none;height:100dvh;aspect-ratio:auto;border-radius:0;border:none}
  body.imm .short .prog{top:env(safe-area-inset-top,0px)}
  body.imm .short .meta{top:calc(1.1rem + env(safe-area-inset-top,0px));left:calc(1rem + env(safe-area-inset-left,0px))}
  body.imm .short .rail{top:calc(1.1rem + env(safe-area-inset-top,0px));right:calc(.7rem + env(safe-area-inset-right,0px))}
  body.imm .check{padding:calc(2.2rem + env(safe-area-inset-top,0px)) 1.5rem calc(1.9rem + env(safe-area-inset-bottom,0px));
    max-width:520px;margin:0 auto}
  body.imm .swipe{bottom:calc(.7rem + env(safe-area-inset-bottom,0px))}
</style>
</head>
<body>
  <div class="brand">StudyVault<img class="brandlock" src="assets/studyvault-lock-rust.svg" alt=""></div>
  <div class="feed" id="feed"></div>
  <button class="fsbtn" id="fsbtn" title="Fullscreen" style="display:none"></button>

<script src="/js/account-sync.js"></script>
  <script src="/js/free-user.js"></script>
<script src="/js/school-session.js"></script>
<script>
const MANIFEST = "/data/_shorts_manifest.json";
const QUESTIONS_URL = "/data/_shorts_questions.json";
const SITE = "https://www.studyvault.co.uk";   // Lesson deep-links (design-lab has no /lesson router)
const CHECK_EVERY = 3;    // a check card appears after this many genuinely-watched shorts
const QS_PER_CHECK = 2;   // questions per check card (drawn from that window's shorts)
const WATCH_FRAC = 0.5;   // count a short as watched once past half (or played to the end)
const CHROME_MS = 10000;  // chrome fades this long after a short starts playing
const DAILY_TARGET = 20;  // today's session: this many shorts, then the done card

// ---- persistence (free-user pattern: localStorage) ----
const LS = { watched:'sv_shorts_watched', saved:'sv_shorts_saved', day:'sv_shorts_day', streak:'sv_shorts_streak' };
function lsGet(k,fb){ try{ const v=JSON.parse(localStorage.getItem(k)); return v==null?fb:v; }catch(e){ return fb; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function yesterdayStr(){ return new Date(Date.now()-864e5).toISOString().slice(0,10); }
function keyOf(s){ return s.lesson_id+':'+(s.topic_index==null?'g':s.topic_index); }

const ICON = {
  book:'<svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16l-7-3-7 3z"/><path d="M18 3a2 2 0 0 1 2 2v14"/></svg>',
  save:'<svg viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>',
  mute:'<svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M22 9l-6 6M16 9l6 6"/></svg>',
  vol:'<svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M16 8a5 5 0 0 1 0 8M19 5a9 9 0 0 1 0 14"/></svg>',
  play:'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
  expand:'<svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>',
  compress:'<svg viewBox="0 0 24 24"><path d="M3 8h3a2 2 0 0 0 2-2V3M21 8h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3M21 16h-3a2 2 0 0 0-2 2v3"/></svg>',
};

const SUBJ_NAMES={ 'ict':'ICT','it':'IT','construction-built-environment':'Construction',
  'child-development':'Child Development','sport-and-coaching-principles':'Sport & Coaching' };
function subjName(slug){
  const s=slug.replace(/^l12-/,'').replace(/^cambridge-nationals-/,'').replace(/-(aqa|ocr|edexcel|eduqas|wjec|ncfe)$/,'');
  return SUBJ_NAMES[s] || s.split('-').map(w=>w[0].toUpperCase()+w.slice(1)).join(' ').replace(/\bAnd\b/,'&');
}
// BRIEF v2: one muted accent per subject — same map the reader skin uses
// (skin-switcher.js ACCENTS; ships later via subjects.color)
const ACCENTS = {
  'history':'#3f5e78','geography':'#5f7155','science':'#44696c','combined-science':'#44696c',
  'separate-sciences':'#44696c','maths':'#535f8a','mathematics':'#535f8a','statistics':'#535f8a',
  'english-literature':'#71506b','english-language':'#4a708c','business':'#8a6c42','economics':'#6e6440',
  'psychology':'#84576b','sociology':'#5e6a7d','religious-education':'#6f5b91','religious-studies':'#6f5b91',
  'computer-science':'#3f6478','physical-education':'#3e6e5f','sport-science':'#3e6e5f',
  'sport-coaching-principles':'#3e6e5f','drama':'#8a4f5c','music':'#5b5286','music-technology':'#5b5286',
  'spanish':'#9a5b38','french':'#4c5f93','german':'#6e5640','food-technology':'#8c5e3a',
  'food-preparation-nutrition':'#8c5e3a','design-technology':'#5f666f','engineering':'#5f666f',
  'electronics':'#5f666f','creative-imedia':'#54486e','media-studies':'#54486e','film-studies':'#54486e',
  'astronomy':'#3d5a78','citizenship':'#6b5a45','geology':'#6e6248','retail-business':'#8a6c42',
  'health-social-care':'#84576b','it':'#3f6478','ict':'#3f6478',
  'construction-built-environment':'#75604a','child-development':'#84576b',
};
function accent(slug){
  const base = slug.replace(/^l12-/,'').replace(/^cambridge-nationals-/,'')
                   .replace(/-(aqa|edexcel|ocr|ocr-b|eduqas|wjec|ncfe)$/,'');
  const c = ACCENTS[base] || ACCENTS[base.replace(/-and-/g,'-')];
  if (c) return c;
  let h=0; for(const ch of slug) h=(h*31+ch.charCodeAt(0))>>>0; return `hsl(${h%360} 25% 42%)`;
}
function titleCase(s){ return s.replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase()); }
// poster frame mirrors the R2 video key under shorts/posters/ on R2, .mp4 -> .webp
function posterFor(url){ const m=url.split('.r2.dev/'); if(m.length<2) return ''; return 'https://pub-aeb94e100e5a48f4a133be5bf206aecb.r2.dev/shorts/posters/'+m[1].replace(/^shorts\//,'').replace(/\.mp4$/,'.webp'); }

// today's playlist: least-recently-watched first within each subject (never-watched
// leads), round-robined across subjects, starting subject rotated daily
// QA hook: ?newest=1 plays the manifest tail-first (most recently generated
// shorts first), whole pool, no recall checks — for reviewing fresh batches.
const QA_NEWEST = new URLSearchParams(location.search).has('newest');
function buildPlaylist(items, n){
  if(QA_NEWEST){
    const fresh = items.filter(e=>!inFeed.has(keyOf(e)));
    return fresh.slice(-n).reverse();
  }
  const w = lsGet(LS.watched, {});
  const by = {};
  items.forEach(e=>{ if(!inFeed.has(keyOf(e))) (by[e.subject]=by[e.subject]||[]).push(e); });
  const queues = Object.values(by);
  if(!queues.length) return [];
  queues.forEach(q=>q.sort((a,b)=>{ const da=w[keyOf(a)]||'', db=w[keyOf(b)]||''; return da<db?-1:da>db?1:0; }));
  let seed=0; for(const c of todayStr()) seed=(seed*31+c.charCodeAt(0))>>>0;
  for(let i=0;i<seed%queues.length;i++) queues.push(queues.shift());
  const out=[];
  while(out.length<n && queues.some(q=>q.length))
    for(const q of queues){ if(q.length && out.length<n) out.push(q.shift()); }
  return out;
}

// placeholder recall question (real ones get mapped from the lesson's QA'd bank later)
function sampleCheck(short){
  return { q:`Which of these is the key idea of “${short.topic}”?`,
    opts:['The correct exam-critical point from this short','A plausible-but-wrong distractor','Another distractor','A third distractor'],
    correct:0 };
}
// the real recall question mapped to this short (its lesson's QA'd knowledge check); placeholder if unmapped
function mappedCheck(s){
  const m=QUESTIONS[s.lesson_id], q=m&&m[String(s.topic_index)];
  return (q && Array.isArray(q.opts) && typeof q.correct==='number') ? q : null;
}
function realCheck(s){
  const q=mappedCheck(s);
  return q ? { q:q.q, opts:q.opts, correct:q.correct } : sampleCheck(s);
}

// the student's chosen subjects — the feed interleaves ONLY across these.
// order of truth: explicit ?subjects= override -> free-user picks -> school
// subscription -> null (no known selection, fall back to the whole pool).
function mySubjectSlugs(){
  const qp = new URLSearchParams(location.search).get('subjects');
  if(qp) return qp.split(',').map(s=>s.trim()).filter(Boolean);
  try{ if(window.FreeUser){ const s=FreeUser.getSubjectSlugs(); if(s&&s.length) return s; } }catch(e){}
  try{ if(window.SchoolSession){ const s=SchoolSession.get();
        if(s){ const list=[].concat(s.subscribed_subjects||[], s.bespoke_subjects||[]); if(list.length) return list; } } }catch(e){}
  return null;
}

let slides=[], current=-1;
let watchedSinceCheck=0, watchedQueue=[];   // a check appears after CHECK_EVERY genuinely-watched shorts
let pool=[];                                // the full manifest; playlists draw from it
const inFeed=new Set();                     // keys already placed in the feed this session
const savedSet=new Set(lsGet(LS.saved,[])); // persisted saves
let feedInited=false;
let QUESTIONS={};                           // lesson_id -> { topic_index: {q,opts,correct} }, from _shorts_questions.json
// sound is ON by default; browsers just won't let the FIRST short play unmuted
// until the user has interacted (scroll/tap). After that first gesture, every
// short plays with sound and stays that way.
let wantSound=true, gestured=false, currentVideo=null;

function refreshSoundUI(){
  if(!currentVideo) return;
  const short=currentVideo.closest('.short'); if(!short) return;
  const m=currentVideo.muted;
  short.classList.toggle('muted', m);
  const b=short.querySelector('.r-mute');
  if(b){ b.innerHTML=m?ICON.mute:ICON.vol; b.classList.toggle('on',!m); }
}
function applySound(){ if(!currentVideo) return; currentVideo.muted=!(wantSound&&gestured); refreshSoundUI(); }
function toggleSound(){ gestured=true; wantSound=!wantSound; applySound(); }        // rail button / tap
function markGesture(){ if(gestured) return; gestured=true; applySound(); if(currentVideo) currentVideo.play().catch(()=>{}); }
['keydown','wheel'].forEach(ev=>addEventListener(ev,markGesture,{passive:true}));   // taps route through onTap; scroll handles mobile unmute

// meta + rail + scrim show when a short starts (and on any touch), then fade after CHROME_MS
let hideTimer=0;
function revealChrome(){
  if(!currentVideo) return;
  const short=currentVideo.closest('.short'); if(!short) return;
  short.classList.remove('chrome-hidden');
  clearTimeout(hideTimer);
  if(!currentVideo.paused)
    hideTimer=setTimeout(()=>{ if(currentVideo && !currentVideo.paused) currentVideo.closest('.short').classList.add('chrome-hidden'); }, CHROME_MS);
}

function togglePlay(){
  if(!currentVideo) return;
  const sh=currentVideo.closest('.short');
  if(currentVideo.paused){ currentVideo.play().catch(()=>{}); sh&&sh.classList.remove('paused'); }
  else { currentVideo.pause(); sh&&sh.classList.add('paused'); }
  revealChrome();
}
function onTap(){                     // first tap turns sound on; after that, tap = pause/play
  if(!gestured){ gestured=true; applySound(); if(currentVideo) currentVideo.play().catch(()=>{}); revealChrome(); }
  else togglePlay();
}

function render(items){
  pool=items;
  appendBatch(buildPlaylist(pool, DAILY_TARGET));
  // QA hook: ?forcecheck=1 splices a check card straight after the first slide
  // (seeded from the head of the playlist) so the card can be staged without
  // sitting through CHECK_EVERY videos. Harmless if a student ever finds it.
  if(new URLSearchParams(location.search).get('forcecheck')){
    watchedQueue=pool.slice(0,Math.max(CHECK_EVERY,QS_PER_CHECK));
    insertCheckAfter(document.getElementById('feed').children[0]);
  }
}

// append a playlist batch + a fresh done card at the end (checks are inserted live,
// once CHECK_EVERY shorts are actually watched)
function appendBatch(batch){
  const feed=document.getElementById('feed');
  batch.forEach(s=>{ inFeed.add(keyOf(s)); feed.appendChild(makeShort(s)); });
  feed.appendChild(makeDone()); updateDone();
  slides=[].slice.call(feed.children);
  if(!feedInited){ feedInited=true; setupAutoplay(); } else activate();
}

// "Keep going anyway": swap the done card for the next batch (the first new short
// lands exactly where the done card was, so the scroll position carries over)
function loadMore(){
  const feed=document.getElementById('feed');
  const next=buildPlaylist(pool, DAILY_TARGET);
  const doneSlide=feed.querySelector('.done')?.closest('.slide');
  if(doneSlide) doneSlide.remove();
  appendBatch(next);
}

function makeShort(s){
  const acc=accent(s.subject);
  const el=document.createElement('div'); el.className='slide';
  el.innerHTML=`<div class="short muted" style="--acc:${acc}">
    <video src="${s.url}" poster="${posterFor(s.url)}" muted playsinline preload="metadata"></video>
    <div class="scrim"></div>
    <div class="prog"><i></i></div>
    <div class="playpause"><span>${ICON.play}</span></div>
    <div class="tap-hint">tap for sound</div>
    <div class="meta">
      <span class="subj">${subjName(s.subject)}</span>
      <div class="topic">${s.topic||titleCase(s.unit)}</div>
      <div class="lesson">${s.title} · Lesson ${s.lesson_number}</div>
    </div>
    <div class="rail">
      <div class="railwrap"><button class="railbtn r-lesson" title="Open the full lesson">${ICON.book}</button><small>Lesson</small></div>
      <div class="railwrap"><button class="railbtn r-save" title="Save to revise">${ICON.save}</button><small>Save</small></div>
      <div class="railwrap"><button class="railbtn r-mute" title="Sound">${ICON.mute}</button><small>Sound</small></div>
    </div>
  </div>`;
  const short=el.querySelector('.short'), vid=el.querySelector('video');
  const countWatch=()=>{
    if(el.dataset.counted) return;
    el.dataset.counted='1'; watchedQueue.push(s);
    recordWatch(s); updateDone();
    if(!QA_NEWEST && ++watchedSinceCheck>=CHECK_EVERY) insertCheckAfter(el);
  };
  vid.addEventListener('timeupdate',()=>{
    if(!vid.duration) return;
    el.querySelector('.prog i').style.width=(vid.currentTime/vid.duration*100)+'%';
    if(vid.currentTime/vid.duration>=WATCH_FRAC) countWatch();   // watched past half -> counts
  });
  // finishing a short counts it, then glides to the next slide (a freshly inserted
  // check if this hit CHECK_EVERY; checks/done have no video, so they wait)
  vid.addEventListener('ended',()=>{ countWatch(); const nxt=el.nextElementSibling; if(nxt) glideTo(el.parentElement, nxt.offsetTop); });
  vid.addEventListener('play',()=>{ short.classList.remove('paused'); if(vid===currentVideo) revealChrome(); });   // (re)start the fade timer
  vid.addEventListener('pause',()=>{ short.classList.remove('chrome-hidden'); if(vid===currentVideo) clearTimeout(hideTimer); });
  vid.addEventListener('click',onTap);   // tap = pause/play (first tap turns the sound on)
  el.querySelector('.r-mute').addEventListener('click',e=>{e.stopPropagation();toggleSound();});
  const saveBtn=el.querySelector('.r-save');
  if(savedSet.has(keyOf(s))) saveBtn.classList.add('on');
  saveBtn.addEventListener('click',e=>{
    e.stopPropagation();
    const k=keyOf(s), on=e.currentTarget.classList.toggle('on');
    on ? savedSet.add(k) : savedSet.delete(k);
    lsSet(LS.saved,[...savedSet]);
  });
  el.querySelector('.r-lesson').addEventListener('click',e=>{
    e.stopPropagation();
    window.open(`${SITE}/lesson/${s.subject}/${s.unit}/${s.lesson_number}`,'_blank');
  });
  return el;
}

// a short counts toward the next check only once genuinely watched; the check is
// then spliced in right after it, seeded from the pool of recently-watched shorts
function insertCheckAfter(afterEl){
  const already=afterEl.nextElementSibling && afterEl.nextElementSibling.querySelector('.check');
  if(!already && watchedQueue.length){
    afterEl.insertAdjacentElement('afterend', makeCheck(pickSeeds(watchedQueue, QS_PER_CHECK)));
  }
  watchedSinceCheck=0; watchedQueue=[];
}

// up to n distinct seed shorts from the watched window, real mapped questions first
function pickSeeds(queue,n){
  const shuffle=a=>{ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
  const real=shuffle(queue.filter(s=>mappedCheck(s)));
  const rest=shuffle(queue.filter(s=>!mappedCheck(s)));
  return real.concat(rest).slice(0,Math.max(1,n));
}

// one card, QS_PER_CHECK questions asked in sequence ("1 of 2" -> "2 of 2");
// swipe-on affordance only unlocks after the last answer
function makeCheck(seeds){
  const el=document.createElement('div'); el.className='slide';
  el.innerHTML=`<div class="check">
    <div class="kick"></div>
    <div class="from"></div>
    <div class="q"></div>
    <div class="opts"></div>
    <div class="foot"></div>
    <div class="swipe">swipe up to continue ↑</div>
  </div>`;
  const check=el.querySelector('.check');
  let i=0, locked=false;
  const renderQ=()=>{
    const s=seeds[i], c=realCheck(s), topic=s.topic||titleCase(s.unit);
    locked=false;
    check.style.setProperty('--acc',accent(s.subject));
    check.querySelector('.kick').textContent=`◆ Quick check${seeds.length>1?` · ${i+1} of ${seeds.length}`:''}`;
    check.querySelector('.from').textContent=`from a short you just watched — ${subjName(s.subject)} · ${topic}`;
    check.querySelector('.q').textContent=c.q;
    check.querySelector('.foot').textContent='Answer to keep your streak going.';
    const opts=check.querySelector('.opts');
    opts.innerHTML=c.opts.map((o,k)=>`<button class="opt" data-i="${k}"></button>`).join('');
    [...opts.children].forEach((b,k)=>{ b.textContent=c.opts[k]; b.addEventListener('click',()=>answer(b,c)); });
  };
  const answer=(b,c)=>{
    if(locked) return; locked=true;
    const ok=+b.dataset.i===c.correct;
    try{ const s=seeds[i], lg=JSON.parse(localStorage.getItem('sv-shorts-checks'))||[];
      const rec={d:new Date().toISOString().slice(0,10),lid:s.lesson_id,sub:s.subject,unit:s.unit,n:s.lesson_number,ti:s.topic_index,topic:s.topic,ok:ok};
      if(!ok){ rec.q=(c.q||'').slice(0,160); rec.chose=String(c.opts[+b.dataset.i]||'').slice(0,90); rec.right=String(c.opts[c.correct]||'').slice(0,90); }
      lg.unshift(rec);
      localStorage.setItem('sv-shorts-checks',JSON.stringify(lg.slice(0,300))); }catch(e){}
    b.classList.add(ok?'correct':'wrong');
    if(!ok) check.querySelector(`.opt[data-i="${c.correct}"]`).classList.add('correct');
    const foot=check.querySelector('.foot');
    const verdict= ok?'<b>Nice — that one stuck.</b>':'<b>Worth another look.</b> This topic comes back soon.';
    if(i<seeds.length-1){
      foot.innerHTML=`${verdict}<button class="nextq">Next question →</button>`;
      foot.querySelector('.nextq').addEventListener('click',()=>{ i++; renderQ(); });
    } else {
      foot.innerHTML=verdict;
      check.classList.add('answered');
    }
  };
  renderQ();
  return el;
}

// ---- watched log, today's stats, streak (all localStorage — survive refresh) ----
function recordWatch(s){
  const k=keyOf(s), t=todayStr();
  const w=lsGet(LS.watched,{}); w[k]=t; lsSet(LS.watched,w);
  const day=lsGet(LS.day,{});
  if(day.date!==t){ day.date=t; day.keys=[]; day.subjects=[]; }
  if(!day.keys.includes(k)) day.keys.push(k);
  if(!day.subjects.includes(s.subject)) day.subjects.push(s.subject);
  lsSet(LS.day,day);
  const st=lsGet(LS.streak,{last:'',n:0});
  if(st.last!==t){ st.n = st.last===yesterdayStr() ? st.n+1 : 1; st.last=t; lsSet(LS.streak,st); }
}
function todayStats(){
  const day=lsGet(LS.day,{});
  return day.date===todayStr() ? {t:(day.keys||[]).length, n:(day.subjects||[]).length} : {t:0,n:0};
}
function streakNow(){
  const st=lsGet(LS.streak,{last:'',n:0});
  return (st.last===todayStr()||st.last===yesterdayStr()) ? st.n : 0;
}

function makeDone(){
  const el=document.createElement('div'); el.className='slide';
  el.innerHTML=`<div class="done" style="--acc:#566a72">
    <div class="flame">🔥</div>
    <h2>Done for today</h2>
    <p class="d-line"></p>
    <div class="stat">
      <div><b class="d-topics">0</b><small>topics</small></div>
      <div><b class="d-subjects">0</b><small>subjects</small></div>
      <div><b class="d-streak">0</b><small>day streak</small></div>
    </div>
    <button class="d-more" onclick="loadMore()">Keep going anyway →</button>
  </div>`;
  return el;
}

// the done card reflects what was genuinely watched today (persisted), not feed size
function updateDone(){
  const d=document.querySelector('.done'); if(!d) return;
  const {t,n}=todayStats();
  d.querySelector('.d-line').textContent = t===0
    ? 'Scroll back up — nothing counted as watched yet.'
    : `You revised ${t} ${t===1?'topic':'topics'} across ${n} ${n===1?'subject':'subjects'}.`;
  d.querySelector('.d-topics').textContent=t;
  d.querySelector('.d-subjects').textContent=n;
  d.querySelector('.d-streak').textContent=streakNow();
  const left=pool.filter(e=>!inFeed.has(keyOf(e))).length;
  const btn=d.querySelector('.d-more');
  if(left===0){ btn.disabled=true; btn.textContent='That’s everything for now'; }
  else btn.textContent=`Keep going anyway → (${Math.min(left,DAILY_TARGET)} more)`;
}

// mandatory scroll-snap cancels programmatic smooth scroll, so animate it ourselves
function glideTo(feed, top){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){ feed.scrollTop=top; return; }
  feed.style.scrollSnapType='none';
  const start=feed.scrollTop, dist=top-start, dur=440; let t0=null;
  function step(now){
    if(t0===null) t0=now;
    const p=Math.min(1,(now-t0)/dur);
    const e=p<0.5?2*p*p:1-Math.pow(-2*p+2,2)/2;   // easeInOutQuad
    feed.scrollTop=start+dist*e;
    if(p<1) requestAnimationFrame(step); else feed.style.scrollSnapType='y mandatory';
  }
  requestAnimationFrame(step);
}

// play the slide centred in the feed, pause the rest — deterministic in a snap scroller
function activate(){
  const feed=document.getElementById('feed');
  const mid=feed.scrollTop + feed.clientHeight/2;
  let best=null, bestDist=Infinity;
  for(const s of feed.children){ const c=s.offsetTop+s.offsetHeight/2, d=Math.abs(c-mid); if(d<bestDist){ bestDist=d; best=s; } }
  for(const s of feed.children){
    const v=s.querySelector('video'), sh=s.querySelector('.short');
    if(s===best && v){
      const changed=currentVideo!==v;
      currentVideo=v;
      v.muted=!(wantSound&&gestured);
      if(v.paused) v.play().catch(()=>{ v.muted=true; v.play().catch(()=>{}); });
      refreshSoundUI();
      if(changed) revealChrome();          // new short -> chrome visible for CHROME_MS
    } else {
      if(v && !v.paused){ v.pause(); v.currentTime=0; }
      if(sh) sh.classList.remove('chrome-hidden');   // reset off-screen shorts to visible
    }
  }
}
function setupAutoplay(){
  const feed=document.getElementById('feed');
  activate();
  let raf=0;
  feed.addEventListener('scroll',()=>{ markGesture(); if(raf) return; raf=requestAnimationFrame(()=>{ raf=0; activate(); }); });
  feed.addEventListener('pointerdown', revealChrome);   // any touch brings the chrome back
}

// keyboard paging for desktop demo
addEventListener('keydown',e=>{
  const feed=document.getElementById('feed'); const h=feed.clientHeight;
  const i=Math.round(feed.scrollTop/h);
  if(['ArrowDown',' ','PageDown'].includes(e.key)){ e.preventDefault(); glideTo(feed,(i+1)*h); }
  if(['ArrowUp','PageUp'].includes(e.key)){ e.preventDefault(); glideTo(feed,Math.max(0,i-1)*h); }
});

Promise.all([
  fetch(MANIFEST).then(r=>r.json()),
  fetch(QUESTIONS_URL).then(r=>r.ok?r.json():{}).catch(()=>({}))
]).then(([m,q])=>{
  QUESTIONS=q||{};
  if(!m.length){ document.getElementById('feed').innerHTML='<div class="slide"><div class="check"><div class="q">No shorts banked yet.</div></div></div>'; return; }
  // Scope the feed to the student's chosen subjects AND their chosen UNITS — a
  // History student who picked America + Conflict must never see a Germany
  // short. scope = { subjectSlug: [unitSlug,...] }, sent by the dashboard from
  // its sculpted units. Fall back to subject-level (?subjects=) for older
  // callers. Shorts are a teach/preview format, so we include ALL lessons of
  // the chosen units, studied or not; the playlist leads with never-watched.
  let pool=m;
  if(!QA_NEWEST){
    let scope=null;
    try{ const s=new URLSearchParams(location.search).get('scope'); if(s) scope=JSON.parse(s); }catch(e){}
    if(scope){
      pool=m.filter(e=> scope[e.subject] && scope[e.subject].indexOf(e.unit)>=0 );
    } else {
      const mine=mySubjectSlugs();
      if(mine && mine.length){ const set=new Set(mine); pool=m.filter(e=>set.has(e.subject)); }
    }
  }
  if(!pool.length){
    document.getElementById('feed').innerHTML='<div class="slide"><div class="check"><div class="q">No shorts for your topics yet &mdash; they&rsquo;re on the way.</div></div></div>';
    return;
  }
  render(pool);
}).catch(err=>{ document.getElementById('feed').innerHTML='<div class="slide"><div class="check"><div class="q">Could not load shorts.</div></div></div>'; });

// ── fullscreen / immersive ─────────────────────────────────────────────
// Phones get the edge-to-edge layout automatically (media query drives
// body.imm). The button covers desktop and Android via the fullscreen API.
// iOS Safari has no element fullscreen — and needs none, the narrow layout
// is already immersive, so the button simply stays hidden there.
const fsBtn=document.getElementById('fsbtn');
const mqImm=matchMedia('(max-width:640px)');
function syncImm(){
  const fs=!!document.fullscreenElement;
  document.body.classList.toggle('imm', mqImm.matches||fs);
  fsBtn.style.display=(document.fullscreenEnabled&&!mqImm.matches)?'grid':'none';
  fsBtn.innerHTML=fs?ICON.compress:ICON.expand;
  fsBtn.title=fs?'Exit fullscreen':'Fullscreen';
}
fsBtn.addEventListener('click',()=>{
  // fullscreen the whole document, not the feed: only the fullscreened
  // element renders, and this button must survive to toggle back out
  if(document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen({navigationUI:'hide'}).catch(()=>{});
});
mqImm.addEventListener('change',syncImm);
document.addEventListener('fullscreenchange',syncImm);
syncImm();
</script>
