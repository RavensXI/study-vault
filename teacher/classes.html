<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Classes — StudyVault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/js/auth-gate.js" data-role="admin,teacher" data-auth="teacher"></script>
  <style>
    /* The teacher area used to be three pages in two visual languages: an old
       slate-and-purple dashboard, a newer prototype, and a classes screen I
       first built to match the OLD one. This uses the tokens the student site
       actually ships (welcome.html), so staff and students see one product. */
    :root{
      --paper:#f6f1e7; --card:#fffdf8; --ink:#26231e; --sec:#57534a; --mut:#84806f;
      --line:#e4dfd2; --linel:#efeadf; --anchor:#5b4632;
      --good:#2f6f4f; --bad:#a8412f; --warn:#8a6d1f;
      --head:'Schibsted Grotesk',system-ui,sans-serif;
      --read:'Literata',Georgia,serif;
      --ease:cubic-bezier(.22,1,.36,1);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{background:var(--paper)}
    body{font-family:var(--head);color:var(--ink);background:var(--paper);line-height:1.55;
         -webkit-font-smoothing:antialiased}

    /* ---- masthead ---- */
    .top{border-bottom:1px solid var(--line);background:var(--paper)}
    .top-in{max-width:1120px;margin:0 auto;padding:0 26px;height:62px;
            display:flex;align-items:center;justify-content:space-between;gap:20px}
    .brand{font-size:1.24rem;font-weight:500;color:#3d3428;text-decoration:none;letter-spacing:-.01em}
    .brand b{font-weight:800}
    .top nav{display:flex;align-items:center;gap:18px;font-size:.87rem}
    .top nav a{color:var(--sec);text-decoration:none}
    .top nav a:hover{color:var(--ink)}
    .top nav a.auth-logout-btn{color:var(--anchor)!important;font-weight:600}

    .wrap{max-width:1120px;margin:0 auto;padding:30px 26px 80px}

    h1{font-family:var(--read);font-size:1.85rem;font-weight:600;letter-spacing:-.012em}
    .sub{color:var(--sec);font-size:.95rem;margin:.35rem 0 0;max-width:64ch}

    /* ---- the class bar: one place for picking, creating and the code ----
       Tom's note: the dropdown, the create flow and the code belong together.
       Splitting them across two screens was what made this feel like two
       products bolted together. */
    .classbar{background:var(--card);border:1px solid var(--line);border-radius:16px;
              padding:16px 18px;margin:22px 0 0;
              display:flex;align-items:center;gap:18px;flex-wrap:wrap;
              box-shadow:0 1px 2px rgba(38,35,30,.04)}
    .pickwrap{display:flex;align-items:center;gap:10px}
    .pickwrap label{font-size:.8rem;font-weight:600;color:var(--mut)}
    select,input{font:inherit;font-size:.95rem;color:var(--ink);background:#fff;
                 border:1px solid var(--line);border-radius:10px;padding:9px 12px}
    select:focus,input:focus{outline:2px solid var(--anchor);outline-offset:-1px}
    #classSelect{font-weight:600;min-width:230px}
    .roll{font-size:.88rem;color:var(--sec)}

    .codewrap{display:flex;align-items:center;gap:10px}
    /* only pushed right inside the class bar; the same block is reused in the
       "class is ready" panel, where it should sit under the heading */
    .classbar .codewrap{margin-left:auto}
    .made .codewrap{margin-top:4px}
    .codelabel{font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
    /* read out to a room, so it is large and unambiguous */
    .code{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:1.42rem;
          font-weight:700;letter-spacing:.17em;color:var(--anchor);
          background:#f0e9db;border:1px solid var(--line);padding:7px 14px;border-radius:11px}
    .copy{border:1px solid var(--line);background:#fff;color:var(--sec);border-radius:10px;
          padding:8px 13px;font:inherit;font-size:.82rem;cursor:pointer}
    .copy:hover{border-color:var(--anchor);color:var(--ink)}
    .copy.done{background:#e9f2ec;border-color:#bcd8c7;color:var(--good)}
    .shut{font-size:.76rem;color:var(--bad);background:#f7ece9;border:1px solid #eddcd7;
          padding:3px 9px;border-radius:20px}

    /* ---- create ---- */
    .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;
           padding:22px;margin-top:16px;max-width:660px;box-shadow:0 1px 2px rgba(38,35,30,.04)}
    .panel h2{font-family:var(--read);font-size:1.16rem;font-weight:600;margin-bottom:14px}
    .fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .field{display:flex;flex-direction:column;gap:5px}
    .field.wide{grid-column:1/-1}
    label{font-size:.8rem;font-weight:600;color:var(--mut)}
    .btn{font:inherit;font-size:.93rem;font-weight:600;cursor:pointer;background:var(--anchor);
         color:#fdfaf3;border:1px solid var(--anchor);border-radius:11px;padding:10px 22px}
    .btn:hover{background:#4a3829;border-color:#4a3829}
    .btn[disabled]{opacity:.55;cursor:not-allowed}
    .btn.ghost{background:transparent;color:var(--sec);border-color:var(--line)}
    .btn.ghost:hover{background:#f0e9db;color:var(--ink)}
    .actions{display:flex;align-items:center;gap:12px;margin-top:16px}
    .note{font-size:.85rem;color:var(--sec)}
    .err{color:var(--bad);font-size:.86rem}

    .made{background:#eef4ef;border:1px solid #cfe1d5;border-radius:16px;padding:18px 20px;margin-top:16px}
    .made h2{font-family:var(--read);font-size:1.1rem;font-weight:600;color:#1f4d36;margin-bottom:8px}
    .made p{font-size:.9rem;color:#28553d;margin-top:8px}

    /* ---- the class itself ---- */
    .section{margin-top:30px}
    .section h3{font-size:.78rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
                color:var(--mut);margin-bottom:10px}
    .bars{display:flex;flex-wrap:wrap;gap:8px}
    .pill{font-size:.83rem;background:var(--card);border:1px solid var(--line);border-radius:20px;
          padding:5px 13px;color:var(--sec)}
    .pill b{color:var(--ink);font-weight:700}

    .sheet{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;
           box-shadow:0 1px 2px rgba(38,35,30,.04)}
    .scroller{overflow-x:auto}
    table{width:100%;border-collapse:collapse;font-size:.89rem}
    th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);
       font-weight:700;padding:12px 14px;background:#f4eee2;border-bottom:1px solid var(--line);white-space:nowrap}
    td{padding:11px 14px;border-top:1px solid var(--linel);vertical-align:top}
    tr:first-child td{border-top:none}
    td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
    .wrong{color:var(--bad);font-weight:600}
    .right{color:var(--good);font-weight:600}
    .where{color:var(--mut);font-size:.78rem}
    .thin{color:var(--sec);font-size:.89rem}

    .empty{color:var(--sec);font-size:.94rem;background:var(--card);border:1px dashed var(--line);
           border-radius:16px;padding:30px;text-align:center}
    .empty a{color:var(--anchor);font-weight:600}
    .loading{color:var(--mut);font-size:.9rem;padding:22px 0}
    [hidden]{display:none!important}

    @media (max-width:660px){
      .fields{grid-template-columns:1fr}
      .codewrap{margin-left:0;width:100%}
      .classbar{gap:12px}
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="top-in">
      <a class="brand" href="/">Study<b>Vault</b></a>
      <!-- admin-nav is the hook js/auth-gate.js looks for when injecting its
           Sign out control. Without one of its two class names the button is
           never added, and a stale session admits you forever. -->
      <nav class="admin-nav">
        <a href="/teacher/review">Review content</a>
        <a href="/teacher/editor">Edit lessons</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <h1>Your classes</h1>
    <p class="sub">Pick a class to see how they are getting on, or make a new one and read
      the code out. Students join as ordinary StudyVault users — there is nothing for your
      IT department to set up.</p>

    <div class="classbar" id="classbar" hidden>
      <div class="pickwrap">
        <label for="classSelect">Class</label>
        <select id="classSelect"></select>
      </div>
      <span class="roll" id="roll"></span>
      <div class="codewrap" id="codewrap">
        <span class="codelabel">Join code</span>
        <span class="code" id="code">——————</span>
        <button class="copy" id="copyBtn" type="button">Copy</button>
      </div>
    </div>

    <div id="made"></div>

    <!-- Create sits in the same place as the picker, because "make a class" and
         "look at a class" are the same job at different moments. -->
    <section class="panel" id="createPanel" hidden>
      <h2>New class</h2>
      <div class="fields">
        <div class="field">
          <label for="cname">Class name</label>
          <input id="cname" maxlength="40" placeholder="10 Set 1" autocomplete="off">
        </div>
        <div class="field">
          <label for="cyear">Year group</label>
          <select id="cyear">
            <option value="">Not set</option>
            <option value="7">Year 7</option><option value="8">Year 8</option>
            <option value="9">Year 9</option><option value="10">Year 10</option>
            <option value="11" selected>Year 11</option>
          </select>
        </div>
        <div class="field wide">
          <label for="csubject">Subject</label>
          <select id="csubject"><option value="">Loading…</option></select>
        </div>
      </div>
      <div class="actions">
        <button class="btn" id="make" type="button">Create class</button>
        <button class="btn ghost" id="cancelCreate" type="button">Cancel</button>
        <span class="note" id="makenote"></span>
      </div>
    </section>

    <div id="view" class="loading">Loading…</div>
  </main>

<script>
(function () {
  var SUPA = 'https://baipckgywpnwapobwtsy.supabase.co';
  var ANON = 'sb_publishable_PYj2nvjclOsUWmZPolhRuA_1OvYhnc2';
  var NEW = '__new__';

  var viewEl    = document.getElementById('view');
  var subjEl    = document.getElementById('csubject');
  var selEl     = document.getElementById('classSelect');
  var barEl     = document.getElementById('classbar');
  var createEl  = document.getElementById('createPanel');
  var codeEl    = document.getElementById('code');
  var rollEl    = document.getElementById('roll');
  var codeWrap  = document.getElementById('codewrap');

  var CLASSES = [];

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  /* Credentials: three ways to be signed in as staff, and the page must find
     whichever applies or say plainly that none does. */
  var token = null, pw = null;
  async function credentials() {
    try {
      var sb = window.supabase.createClient(SUPA, ANON);
      var s = await sb.auth.getSession();
      if (s && s.data && s.data.session) token = s.data.session.access_token;
    } catch (e) {}
    if (!token) {
      try {
        var raw = localStorage.getItem('sb-baipckgywpnwapobwtsy-auth-token');
        if (raw) token = JSON.parse(raw).access_token || null;
      } catch (e) {}
    }
    try {
      var saved = JSON.parse(sessionStorage.getItem('studyvault-auth') ||
                             localStorage.getItem('studyvault-auth') || 'null');
      if (saved && saved.pw) pw = saved.pw;
    } catch (e) {}
    return !!(token || pw);
  }

  async function api(path, body) {
    var headers = { 'Content-Type': 'application/json' };
    if (token) headers['Authorization'] = 'Bearer ' + token;
    else if (pw) headers['X-Admin-Password'] = pw;
    var opts = { headers: headers };
    if (body !== undefined) {
      opts.method = 'POST';
      if (pw && !token) body._admin_password = pw;
      opts.body = JSON.stringify(body);
    }
    var r = await fetch(path, opts);
    var d = await r.json();
    if (!r.ok) throw new Error(d.error || d.detail || ('Request failed (' + r.status + ')'));
    return d;
  }

  /* ---- the class view -----------------------------------------------------
     Everything here comes from /api/teacher/class-progress, which enforces the
     data boundary server-side: attainment through, last-active bucketed, study
     habits never sent. Nothing below tries to be cleverer than that. */
  function viewHtml(d) {
    var act = d.activity || {};
    var order = ['this week','last week','this month','over a month','never'];
    var pills = order.filter(function (k) { return act[k]; }).map(function (k) {
      return '<span class="pill"><b>' + act[k] + '</b> ' + esc(k) + '</span>';
    }).join('');

    var h = '<div class="section"><h3>Last worked on ' + esc(d.class.subject || 'this subject') + '</h3>' +
            '<div class="bars">' + (pills || '<span class="thin">No activity recorded yet.</span>') + '</div></div>';

    h += '<div class="section"><h3>Questions the class gets wrong</h3>';
    if (!(d.missedItems || []).length) {
      h += '<div class="empty">Nothing yet that two or more of them missed. One wrong answer is ' +
           'a pupil having an off day, so it is not shown here.</div>';
    } else {
      h += '<div class="sheet"><div class="scroller"><table><thead><tr>' +
           '<th>Question</th><th>They chose</th><th>Answer</th><th class="num">Students</th>' +
           '</tr></thead><tbody>';
      d.missedItems.forEach(function (q) {
        h += '<tr><td>' + esc(q.question) + '<br><span class="where">' + esc(q.where) + '</span></td>' +
             '<td class="wrong">' + esc(q.commonWrongAnswer || '—') +
             (q.commonWrongCount > 1 ? ' <span class="where">×' + q.commonWrongCount + '</span>' : '') + '</td>' +
             '<td class="right">' + esc(q.right || '—') + '</td>' +
             '<td class="num">' + q.students + '</td></tr>';
      });
      h += '</tbody></table></div></div>';
    }
    h += '</div>';

    h += '<div class="section"><h3>Weakest units</h3>';
    if (!(d.weakestUnits || []).length) {
      h += '<div class="empty">Not enough warm-up attempts yet to say.</div>';
    } else {
      h += '<div class="sheet"><div class="scroller"><table><thead><tr><th>Unit</th>' +
           '<th class="num">Accuracy</th><th class="num">Attempts</th></tr></thead><tbody>';
      d.weakestUnits.forEach(function (u) {
        h += '<tr><td>' + esc(u.unit) + '</td><td class="num">' + u.accuracy + '%</td>' +
             '<td class="num">' + u.attempts + '</td></tr>';
      });
      h += '</tbody></table></div></div>';
    }
    h += '</div>';

    h += '<div class="section"><h3>Students</h3><div class="sheet"><div class="scroller"><table><thead><tr>' +
         '<th>Name</th><th class="num">Lessons done</th><th class="num">Quiz accuracy</th>' +
         '<th class="num">Practice</th><th>Last active</th></tr></thead><tbody>';
    (d.students || []).forEach(function (s) {
      h += '<tr><td>' + esc(s.name) + '</td>' +
           '<td class="num">' + s.lessonsComplete + '</td>' +
           '<td class="num">' + (s.quizAccuracy == null ? '—' : s.quizAccuracy + '%') + '</td>' +
           '<td class="num">' + s.practiceAnswered + '</td>' +
           '<td>' + esc(s.lastActive) + '</td></tr>';
    });
    h += '</tbody></table></div></div></div>';
    return h;
  }

  function showCreate(on) {
    createEl.hidden = !on;
    if (on) {
      viewEl.innerHTML = '';
      codeWrap.hidden = true;
      rollEl.textContent = '';
      document.getElementById('cname').focus();
    } else {
      codeWrap.hidden = false;
    }
  }

  async function selectClass(id) {
    if (id === NEW) { showCreate(true); return; }
    showCreate(false);
    var c = CLASSES.filter(function (x) { return x.id === id; })[0];
    if (!c) return;

    sessionStorage.setItem('sv-teacher-class', id);
    codeEl.textContent = c.joinCode || '——————';
    document.getElementById('copyBtn').setAttribute('data-code', c.joinCode || '');
    rollEl.textContent = c.size + (c.size === 1 ? ' student' : ' students') +
                         (c.subject ? ' · ' + c.subject : '');
    var badge = document.getElementById('shutBadge');
    if (badge) badge.remove();
    if (!c.joinOpen) {
      codeWrap.insertAdjacentHTML('beforeend', '<span class="shut" id="shutBadge">Closed</span>');
    }

    if (!c.size) {
      viewEl.className = '';
      viewEl.innerHTML = '<div class="empty">Nobody has joined <strong>' + esc(c.name) +
        '</strong> yet. Read out <strong>' + esc(c.joinCode) + '</strong> — they sign in, ' +
        'open Classes, and enter it.</div>';
      return;
    }

    viewEl.className = 'loading';
    viewEl.textContent = 'Loading ' + c.name + '…';
    try {
      var d = await api('/api/teacher/class-progress?class_id=' + encodeURIComponent(id));
      viewEl.className = '';
      viewEl.innerHTML = viewHtml(d);
    } catch (e) {
      viewEl.className = '';
      viewEl.innerHTML = '<div class="empty">Could not load that class. ' + esc(e.message) + '</div>';
    }
  }

  function paintPicker() {
    var opts = CLASSES.map(function (c) {
      return '<option value="' + esc(c.id) + '">' + esc(c.name) +
             (c.subject ? ' · ' + esc(c.subject) : '') + '</option>';
    }).join('');
    selEl.innerHTML = opts + '<option value="' + NEW + '">＋ New class…</option>';
    barEl.hidden = false;
  }

  function paintSubjects(subjects) {
    var own = subjects.filter(function (s) { return s.own; });
    var gen = subjects.filter(function (s) { return !s.own; });
    function opts(list) {
      return list.map(function (s) {
        return '<option value="' + esc(s.id) + '">' + esc(s.name) + '</option>';
      }).join('');
    }
    var html = '<option value="">Choose a subject…</option>';
    if (own.length) html += '<optgroup label="Your school">' + opts(own) + '</optgroup>';
    html += '<optgroup label="' + (own.length ? 'All subjects' : 'Subjects') + '">' + opts(gen) + '</optgroup>';
    subjEl.innerHTML = html;
  }

  async function load(selectId) {
    try {
      var d = await api('/api/teacher/my-classes');
      CLASSES = d.classes || [];
      paintSubjects(d.subjects || []);

      if (!CLASSES.length) {
        barEl.hidden = true;
        viewEl.className = '';
        viewEl.innerHTML = '';
        showCreate(true);
        document.getElementById('makenote').textContent =
          'You have no classes yet — this is where you start.';
        return;
      }

      paintPicker();
      var want = selectId || sessionStorage.getItem('sv-teacher-class');
      if (!CLASSES.some(function (c) { return c.id === want; })) want = CLASSES[0].id;
      selEl.value = want;
      await selectClass(want);
    } catch (e) {
      viewEl.className = '';
      viewEl.innerHTML = '<div class="empty">Could not load your classes. ' + esc(e.message) + '</div>';
    }
  }

  selEl.addEventListener('change', function () { selectClass(this.value); });
  document.getElementById('cancelCreate').addEventListener('click', function () {
    if (!CLASSES.length) return;                       // nothing to go back to
    showCreate(false);
    selEl.value = sessionStorage.getItem('sv-teacher-class') || CLASSES[0].id;
    selectClass(selEl.value);
  });

  document.getElementById('make').addEventListener('click', async function () {
    var btn = this, note = document.getElementById('makenote');
    var name = document.getElementById('cname').value.trim();
    var subject = subjEl.value;
    var year = document.getElementById('cyear').value;

    note.className = 'note'; note.textContent = '';
    if (!name)    { note.className = 'err'; note.textContent = 'Give the class a name.'; return; }
    if (!subject) { note.className = 'err'; note.textContent = 'Choose a subject.'; return; }

    btn.disabled = true; note.textContent = 'Creating…';
    try {
      var d = await api('/api/teacher/create-class',
        { name: name, subject_id: subject, year_group: year || null });
      document.getElementById('made').innerHTML =
        '<div class="made"><h2>' + esc(d.class.name) + ' is ready</h2>' +
        '<div class="codewrap"><span class="code">' + esc(d.class.joinCode) + '</span>' +
        '<button class="copy" data-code="' + esc(d.class.joinCode) + '">Copy</button></div>' +
        '<p>Read that out. Your students sign in, open Classes, and enter it.</p></div>';
      document.getElementById('cname').value = '';
      note.textContent = '';
      await load(d.class.id);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (e) {
      note.className = 'err'; note.textContent = e.message;
    } finally { btn.disabled = false; }
  });

  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('.copy');
    if (!b) return;
    var code = b.getAttribute('data-code') || codeEl.textContent;
    navigator.clipboard.writeText(code).then(function () {
      b.textContent = 'Copied'; b.classList.add('done');
      setTimeout(function () { b.textContent = 'Copy'; b.classList.remove('done'); }, 1600);
    }).catch(function () { b.textContent = code; });
  });

  credentials().then(function (ok) {
    if (!ok) {
      viewEl.className = '';
      viewEl.innerHTML = '<div class="empty">This page needs a teacher sign-in. You are on the ' +
        'site, but not with a teacher account — classes belong to a teacher.<br><br>' +
        '<a href="/teacher/login?signout=1">Sign in as a teacher &rarr;</a></div>';
      subjEl.innerHTML = '<option value="">Sign in to choose a subject</option>';
      return;
    }
    load();
  });
})();
</script>
</body>
</html>
