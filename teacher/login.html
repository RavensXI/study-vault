<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher sign in — StudyVault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&display=swap" rel="stylesheet">
  <!-- The teacher house style, shared with /teacher/classes and the review
       queue. Deliberately NOT css/reskin.css: that is the student reading
       skin and it breaks form layouts. -->
  <link rel="stylesheet" href="/css/teacher-shell.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <link rel="icon" type="image/png" sizes="192x192" href="/images/icon-192.png">
  <link rel="apple-touch-icon" href="/images/icon-192.png">
</head>
<!-- data-staff carries the teacher tokens; .auth-page scopes the sign-in
     styles to this page and signup.html alone. -->
<body class="auth-page" data-staff="teacher">

  <header class="top">
    <div class="top-in">
      <a class="brand" href="/">Study<b>Vault</b></a>
      <nav aria-label="Site"><a href="/">Back to StudyVault</a></nav>
    </div>
  </header>

  <main class="auth-main">
    <div class="card auth-card">
      <h1 class="card-title">Teacher sign in</h1>
      <!-- This subtitle is the FIRST .card-subtitle in the document and the
           script rewrites it by that selector, so nothing else may be
           inserted above it. -->
      <p class="card-subtitle">Sign in to your school&rsquo;s StudyVault.</p>

      <!-- Shown when you are ALREADY signed in. This used to redirect instantly
           instead, which meant a signed-in user could never reach the sign-in
           page — and since no teacher page carried a Sign out control, there
           was no way to get out of the account you were in. -->
      <div id="alreadyIn" style="display:none">
        <p class="card-subtitle">
          You are signed in as <strong id="whoami">…</strong>.
        </p>
        <button type="button" class="form-btn" id="continueBtn">Go to your classes</button>
        <button type="button" class="forgot-link" id="signOutLink">
          Sign out and use a different account
        </button>
      </div>

      <!-- Shown only when arriving from a password-reset email. Until now the
           "Forgot password?" link sent a real email whose link had nowhere to
           land: this page had no recovery handling at all, so the reset could
           never be completed. Hidden by an inline style because the script
           reads style.display to decide whether it has already switched. -->
      <form id="resetForm" style="display:none">
        <div class="form-group">
          <label class="form-label" for="newPassword">New password</label>
          <input class="form-input" id="newPassword" type="password"
                 placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="newPassword2">Confirm new password</label>
          <input class="form-input" id="newPassword2" type="password"
                 placeholder="Type it again" autocomplete="new-password" minlength="8" required>
        </div>
        <div class="form-error" id="resetError" role="alert"></div>
        <div class="form-success" id="resetSuccess" role="status"></div>
        <button type="submit" class="form-btn" id="resetBtn">Set new password</button>
      </form>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="email">Email address</label>
          <input class="form-input" id="email" type="email" placeholder="you@school.ac.uk" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-input" id="password" type="password" placeholder="Your password" autocomplete="current-password" required>
        </div>

        <!-- Live regions: a refused sign-in is announced, not merely drawn. -->
        <div class="form-error" id="errorMsg" role="alert"></div>
        <div class="form-success" id="successMsg" role="status"></div>

        <button type="submit" class="form-btn" id="submitBtn">Sign in</button>
      </form>

      <!-- A button, not a bare anchor without an href: the old markup could
           not be reached by keyboard at all. -->
      <button type="button" class="forgot-link" id="forgotLink">Forgot password?</button>

      <div class="auth-foot">
        <p>Invited by your school? <a href="/teacher/signup">Set up your account</a>.</p>
        <p>Students do not sign in here — they use <a href="/">the main StudyVault site</a>.</p>
      </div>
    </div>
  </main>

  <script>
  (function () {
    /* Read this BEFORE creating the client. supabase-js has detectSessionInUrl
       on by default: it consumes the recovery fragment and clears it, so by the
       time anything below runs the only evidence of why the user is here may
       already be gone. */
    var CAME_FROM_RESET = /type=recovery/.test(window.location.hash) ||
                          /type=recovery/.test(window.location.search);

    var SB_URL = 'https://baipckgywpnwapobwtsy.supabase.co';
    var SB_KEY = 'sb_publishable_PYj2nvjclOsUWmZPolhRuA_1OvYhnc2';
    var sb = window.supabase.createClient(SB_URL, SB_KEY);

    var form = document.getElementById('loginForm');
    var emailInput = document.getElementById('email');
    var passwordInput = document.getElementById('password');
    var errorMsg = document.getElementById('errorMsg');
    var successMsg = document.getElementById('successMsg');
    var submitBtn = document.getElementById('submitBtn');
    var forgotLink = document.getElementById('forgotLink');

    /* ---- password recovery ------------------------------------------------
       Supabase sends the user back with the recovery token in the URL FRAGMENT
       (#access_token=…&type=recovery). supabase-js consumes that fragment and
       fires PASSWORD_RECOVERY, so we listen for the event AND read the hash
       directly — the event can fire before this listener attaches, in which
       case only the hash tells us why the user is here.

       If the link drops you on the home page instead of this one, that is the
       Supabase redirect allow-list, not this code: the URL passed as redirectTo
       must be listed under Authentication -> URL Configuration, or Supabase
       silently falls back to the Site URL. */
    var resetForm = document.getElementById('resetForm');
    var loginFormEl = document.getElementById('loginForm');
    var resetError = document.getElementById('resetError');
    var resetSuccess = document.getElementById('resetSuccess');
    var resetBtn = document.getElementById('resetBtn');
    var recoveryMode = false;

    function enterRecoveryMode() {
      recoveryMode = true;
      if (resetForm.style.display === '') return;
      resetForm.style.display = '';
      loginFormEl.style.display = 'none';
      forgotLink.style.display = 'none';
      document.querySelector('.card-title').textContent = 'Choose a new password';
      document.querySelector('.card-subtitle').textContent =
        'You followed a reset link. Set a new password to finish signing in.';
    }

    if (CAME_FROM_RESET) enterRecoveryMode();
    sb.auth.onAuthStateChange(function (event) {
      if (event === 'PASSWORD_RECOVERY') enterRecoveryMode();
    });

    /* Clear a stale error as soon as they change something. The inputs carry
       minlength, so the browser can block submission before the handler runs —
       leaving the PREVIOUS message on screen, contradicting what they just
       typed ("do not match" under two identical passwords). */
    ['newPassword', 'newPassword2'].forEach(function (id) {
      document.getElementById(id).addEventListener('input', function () {
        resetError.textContent = ''; resetError.style.display = 'none';
      });
    });

    resetForm.addEventListener('submit', async function (e) {
      e.preventDefault();
      resetError.textContent = ''; resetError.style.display = 'none';
      resetSuccess.textContent = ''; resetSuccess.style.display = 'none';

      var a = document.getElementById('newPassword').value;
      var b = document.getElementById('newPassword2').value;

      if (a.length < 8) {
        resetError.textContent = 'Use at least 8 characters.';
        resetError.style.display = 'block'; return;
      }
      if (a !== b) {
        resetError.textContent = 'Those two passwords do not match.';
        resetError.style.display = 'block'; return;
      }

      resetBtn.disabled = true; resetBtn.textContent = 'Saving…';
      try {
        var out = await sb.auth.updateUser({ password: a });
        if (out.error) {
          /* The commonest cause by far is an expired or already-used link. Say
             that, rather than passing Supabase's wording straight through. */
          resetError.innerHTML = out.error.message +
            '<br><br>Reset links expire and can only be used once. ' +
            'Go back and request a new one.';
          resetError.style.display = 'block';
        } else {
          resetSuccess.textContent = 'Password changed. Taking you to your classes…';
          resetSuccess.style.display = 'block';
          history.replaceState(null, '', location.pathname);   // drop the token from the URL
          setTimeout(function () { window.location.href = '/teacher/classes'; }, 1200);
        }
      } catch (err) {
        resetError.textContent = 'Could not change the password. Request a new link and try again.';
        resetError.style.display = 'block';
      }
      resetBtn.disabled = false; resetBtn.textContent = 'Set new password';
    });

    // Check for signup success message in URL
    var params = new URLSearchParams(window.location.search);
    if (params.get('signup') === 'success') {
      showSuccess('Account created. Sign in below.');
    }

    /* An escape hatch that works even if the page below misbehaves:
       /teacher/login?signout=1 clears everything and shows the form. */
    async function signOutFully() {
      try { sessionStorage.removeItem('studyvault-auth'); } catch (e) {}
      try { localStorage.removeItem('studyvault-auth'); } catch (e) {}
      try { await sb.auth.signOut(); } catch (e) {}
      window.location.href = '/teacher/login';
    }

    document.getElementById('signOutLink').addEventListener('click', function (e) {
      e.preventDefault();
      this.textContent = 'Signing out…';
      signOutFully();
    });
    document.getElementById('continueBtn').addEventListener('click', function () {
      window.location.href = '/teacher/classes';
    });

    if (new URLSearchParams(window.location.search).get('signout')) {
      signOutFully();
    } else {
      // Check if already logged in
      sb.auth.getSession().then(function (res) {
        /* NOT during a password reset. The recovery token establishes a real
           session, so this check would see a signed-in user and bounce them to
           the dashboard — throwing them out of the reset form a few seconds
           after it appears, before they can type anything. The session exists
           precisely so updateUser() can change the password; it is not a signal
           that the user is finished here. */
        if (CAME_FROM_RESET || recoveryMode) return;
        if (res.data.session) {
          /* Offer the choice rather than redirecting. Someone who deliberately
             navigated to the SIGN IN page may well want a different account,
             and bouncing them to the dashboard makes that impossible. */
          document.getElementById('whoami').textContent =
            (res.data.session.user && res.data.session.user.email) || 'another account';
          document.getElementById('alreadyIn').style.display = '';
          loginFormEl.style.display = 'none';
          forgotLink.style.display = 'none';
          document.querySelector('.card-title').textContent = 'Already signed in';
          document.querySelector('.card-subtitle').style.display = 'none';
        }
      });
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.add('visible');
      successMsg.classList.remove('visible');
    }

    function showSuccess(msg) {
      successMsg.textContent = msg;
      successMsg.classList.add('visible');
      errorMsg.classList.remove('visible');
    }

    function clearMessages() {
      errorMsg.classList.remove('visible');
      successMsg.classList.remove('visible');
    }

    function setLoading(loading) {
      submitBtn.disabled = loading;
      submitBtn.textContent = loading ? 'Signing in…' : 'Sign in';
    }

    async function verifyTeacher(userId) {
      var resp = await sb.from('profiles').select('role, school_id, full_name').eq('id', userId).single();
      if (resp.data && (resp.data.role === 'teacher' || resp.data.role === 'platform_admin')) {
        // Store session info for auth-gate compatibility
        sessionStorage.setItem('studyvault-auth', JSON.stringify({
          role: resp.data.role,
          teacher_id: userId,
          school_id: resp.data.school_id,
          full_name: resp.data.full_name
        }));
        window.location.href = '/teacher/classes';
        return true;
      }
      return false;
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      clearMessages();
      setLoading(true);

      var email = emailInput.value.trim();
      var password = passwordInput.value;

      if (!email || !password) {
        showError('Enter your email address and password.');
        setLoading(false);
        return;
      }

      try {
        var result = await sb.auth.signInWithPassword({ email: email, password: password });

        if (result.error) {
          showError(result.error.message);
          setLoading(false);
          passwordInput.select();
          return;
        }

        // Verify they have a teacher or admin role
        var profile = await sb.from('profiles').select('role, school_id, full_name').eq('id', result.data.user.id).single();

        if (!profile.data || (profile.data.role !== 'teacher' && profile.data.role !== 'platform_admin')) {
          showError('This account is not a teacher account.');
          await sb.auth.signOut();
          setLoading(false);
          return;
        }

        // Store session info for auth-gate compatibility
        sessionStorage.setItem('studyvault-auth', JSON.stringify({
          role: profile.data.role,
          teacher_id: result.data.user.id,
          school_id: profile.data.school_id,
          full_name: profile.data.full_name
        }));

        window.location.href = '/teacher/classes';
      } catch (err) {
        showError('Could not reach StudyVault. Check your connection and try again.');
        setLoading(false);
      }
    });

    // Forgot password
    forgotLink.addEventListener('click', async function () {
      clearMessages();
      var email = emailInput.value.trim();

      if (!email) {
        showError('Enter your email address above, then click "Forgot password?"');
        emailInput.focus();
        return;
      }

      forgotLink.style.pointerEvents = 'none';
      forgotLink.style.opacity = '0.5';
      forgotLink.textContent = 'Sending…';

      try {
        var result = await sb.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin + '/teacher/login'
        });

        if (result.error) {
          showError(result.error.message);
        } else {
          showSuccess('Password reset email sent. Check your inbox.');
        }
      } catch (err) {
        showError('Could not send reset email. Try again.');
      }

      forgotLink.style.pointerEvents = '';
      forgotLink.style.opacity = '';
      forgotLink.textContent = 'Forgot password?';
    });
  })();
  </script>

</body>
</html>
