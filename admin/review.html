<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content Review - StudyVault Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/js/auth-gate.js" data-role="admin,teacher" data-auth="teacher"></script>
  <style>
    :root { --bg-warm: #faf8f5; --text-color: #2d2a26; --text-muted: #6b6560; }

    .review-layout { max-width: 1280px; margin: 0 auto; padding: 1.5rem 1.5rem 6rem; }

    /* ---- Header ---- */
    .review-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 0.75rem; }
    .review-header h1 { font-family: 'Source Serif 4', serif; font-size: 1.75rem; margin: 0; color: var(--text-color); }

    /* ---- Filters Bar ---- */
    .review-controls { display: flex; gap: 0.75rem; margin-bottom: 1.25rem; flex-wrap: wrap; align-items: center; }
    .review-tabs { display: flex; gap: 0.35rem; }
    .review-tab { padding: 0.4rem 0.9rem; border-radius: 20px; border: 1px solid #ddd; background: white; cursor: pointer; font-size: 0.8rem; font-weight: 500; transition: all 0.15s; font-family: inherit; }
    .review-tab.active { background: var(--text-color); color: white; border-color: var(--text-color); }
    .review-tab:hover:not(.active) { background: #f5f3ff; border-color: #c4b5fd; }
    .review-tab .tab-count { font-weight: 700; margin-left: 0.2rem; }

    .subject-filter { padding: 0.4rem 0.75rem; border: 1px solid #ddd; border-radius: 8px; font-size: 0.8rem; font-family: inherit; background: white; cursor: pointer; }
    .subject-filter:focus { outline: none; border-color: #7c3aed; box-shadow: 0 0 0 2px rgba(124,58,237,0.12); }

    .review-select-all { display: flex; align-items: center; gap: 0.35rem; font-size: 0.78rem; color: var(--text-muted); cursor: pointer; margin-left: auto; }
    .review-select-all input { cursor: pointer; }

    /* ---- Lesson Grid ---- */
    .review-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 0.85rem; }
    .review-card { background: white; border-radius: 12px; box-shadow: 0 1px 6px rgba(0,0,0,0.05); overflow: hidden; transition: box-shadow 0.15s, border-color 0.15s; border: 2px solid transparent; position: relative; }
    .review-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.09); }
    .review-card.selected { border-color: #7c3aed; background: #faf8ff; }

    .review-card-hero { width: 100%; height: 160px; object-fit: cover; object-position: center top; display: block; background: #f0ede8; border-radius: 10px 10px 0 0; }
    .review-card-hero--placeholder { display: flex; align-items: center; justify-content: center; color: #c4b5a8; font-size: 0.75rem; height: 160px; background: linear-gradient(135deg, #f5f0eb 0%, #ede8e2 100%); border-radius: 10px 10px 0 0; }

    .review-card-body { padding: 0.75rem 0.9rem 0.85rem; }
    .review-card-title { font-family: 'Source Serif 4', serif; font-size: 0.95rem; font-weight: 600; margin: 0 0 0.3rem; color: var(--text-color); line-height: 1.3; }
    .review-card-meta { font-size: 0.72rem; color: var(--text-muted); display: flex; flex-wrap: wrap; gap: 0.3rem; align-items: center; }
    .review-card-meta .dot { opacity: 0.4; }

    .review-card-footer { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0.9rem; border-top: 1px solid #f0ede8; }
    .review-card-actions { display: flex; gap: 0.35rem; }

    .review-card-check { position: absolute; top: 8px; left: 8px; z-index: 2; width: 20px; height: 20px; cursor: pointer; accent-color: #7c3aed; }

    /* ---- Status Badges ---- */
    .status-badge { display: inline-block; padding: 0.12rem 0.55rem; border-radius: 10px; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; }
    .status-pending_review { background: #fef3c7; color: #92400e; }
    .status-ready_for_teacher { background: #dbeafe; color: #1e40af; }
    .status-live { background: #dcfce7; color: #166534; }
    .status-draft { background: #f3f4f6; color: #6b7280; }
    .status-review { background: #fef3c7; color: #92400e; }
    .status-approved { background: #d1fae5; color: #065f46; }

    /* ---- Buttons ---- */
    .btn { padding: 0.35rem 0.75rem; border-radius: 8px; border: none; cursor: pointer; font-size: 0.75rem; font-weight: 600; transition: all 0.15s; font-family: inherit; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-sm { padding: 0.25rem 0.6rem; font-size: 0.7rem; }
    .btn-preview { background: #eef2ff; color: #4f46e5; }
    .btn-preview:hover:not(:disabled) { background: #e0e7ff; }
    .btn-approve { background: #dcfce7; color: #16a34a; }
    .btn-approve:hover:not(:disabled) { background: #bbf7d0; }
    .btn-publish { background: #dbeafe; color: #1d4ed8; }
    .btn-publish:hover:not(:disabled) { background: #bfdbfe; }
    .btn-reject { background: #fef2f2; color: #dc2626; }
    .btn-reject:hover:not(:disabled) { background: #fee2e2; }
    .btn-edit { background: #f5f3ff; color: #7c3aed; }
    .btn-edit:hover:not(:disabled) { background: #ede9fe; }
    .btn-apply { background: #2d2a26; color: white; padding: 0.4rem 1rem; }
    .btn-apply:hover { background: #1a1816; }

    /* ---- Batch Action Bar ---- */
    .batch-bar { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 2px solid #e5e7eb; padding: 0.75rem 1.5rem; display: flex; justify-content: center; align-items: center; gap: 0.75rem; z-index: 100; box-shadow: 0 -4px 16px rgba(0,0,0,0.08); transform: translateY(100%); transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
    .batch-bar.visible { transform: translateY(0); }
    .batch-bar-count { font-size: 0.85rem; font-weight: 600; color: var(--text-color); }
    .batch-bar-count span { color: #7c3aed; }

    /* ---- Empty State ---- */
    .review-empty { text-align: center; padding: 4rem 2rem; color: var(--text-muted); }
    .review-empty svg { width: 48px; height: 48px; margin-bottom: 1rem; opacity: 0.3; }
    .review-empty p { font-size: 0.9rem; }

    /* ---- Reject Modal ---- */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .modal-box { background: white; border-radius: 16px; padding: 1.75rem; max-width: 480px; width: 90%; box-shadow: 0 8px 30px rgba(0,0,0,0.15); }
    .modal-box h3 { margin: 0 0 0.75rem; font-family: 'Source Serif 4', serif; font-size: 1.15rem; }
    .modal-box p { font-size: 0.82rem; color: var(--text-muted); margin: 0 0 0.75rem; }
    .modal-box textarea { width: 100%; min-height: 100px; padding: 0.65rem; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; font-size: 0.85rem; resize: vertical; box-sizing: border-box; }
    .modal-box textarea:focus { outline: none; border-color: #7c3aed; box-shadow: 0 0 0 2px rgba(124,58,237,0.12); }
    .modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1rem; }

    /* ---- Loading ---- */
    .review-loading { text-align: center; padding: 4rem; color: var(--text-muted); font-size: 0.9rem; }

    /* ---- Toast ---- */
    .toast { position: fixed; bottom: 5.5rem; left: 50%; transform: translateX(-50%); background: var(--text-color); color: white; padding: 0.6rem 1.25rem; border-radius: 10px; font-size: 0.82rem; font-weight: 600; z-index: 200; box-shadow: 0 4px 16px rgba(0,0,0,0.15); opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    .toast.visible { opacity: 1; }

    @media (max-width: 640px) {
      .review-grid { grid-template-columns: 1fr; }
      .subject-summary { grid-template-columns: 1fr 1fr; }
      .review-header { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>

  <div class="review-layout" id="review-app">
    <div class="review-loading" id="review-loading">Loading review dashboard...</div>
  </div>

  <!-- Batch action bar (hidden by default) -->
  <div class="batch-bar" id="batch-bar">
    <span class="batch-bar-count"><span id="batch-count">0</span> selected</span>
    <button class="btn btn-approve" id="batch-approve">Approve Selected</button>
    <button class="btn btn-publish" id="batch-publish">Publish Selected</button>
    <button class="btn btn-reject" id="batch-reject">Reject Selected</button>
    <button class="btn" id="batch-clear" style="background:#f3f4f6;color:var(--text-muted)">Clear</button>
  </div>

  <!-- Toast notification -->
  <div class="toast" id="toast"></div>

  <script>
  (function () {
    'use strict';

    var sb = window.supabase.createClient(
      'https://baipckgywpnwapobwtsy.supabase.co',
      'sb_publishable_PYj2nvjclOsUWmZPolhRuA_1OvYhnc2'
    );

    var app = document.getElementById('review-app');
    var batchBar = document.getElementById('batch-bar');
    var toastEl = document.getElementById('toast');

    // State
    var currentStatus = 'pending_review';
    var currentSubjectId = '';
    var currentSchoolFilter = '';
    var currentUnitFilter = '';
    var unitsCache = [];
    var selectedIds = new Set();
    var lessonsCache = [];
    var subjectsCache = [];
    var summaryCache = [];
    var countsCache = {};

    // ---- Auth ----
    function getAuthHeaders() {
      var headers = { 'Content-Type': 'application/json' };
      // Check for admin password in sessionStorage
      var session = null;
      try { session = JSON.parse(sessionStorage.getItem('studyvault-auth')); } catch (e) {}
      if (session && session.pw) {
        headers['X-Admin-Password'] = session.pw;
      }
      return headers;
    }

    async function getAccessToken() {
      var result = await sb.auth.getSession();
      if (result.data.session) return result.data.session.access_token;
      return null;
    }

    // ---- API helpers ----
    async function apiGet(params) {
      var headers = getAuthHeaders();
      var token = await getAccessToken();
      if (token) headers['Authorization'] = 'Bearer ' + token;

      var qs = new URLSearchParams(params).toString();
      var resp = await fetch('/api/pipeline/review?' + qs, { headers: headers });
      var data = await resp.json();
      if (!resp.ok) throw new Error(data.error || 'API error');
      return data;
    }

    async function apiPost(body) {
      var headers = getAuthHeaders();
      var token = await getAccessToken();
      if (token) headers['Authorization'] = 'Bearer ' + token;

      var resp = await fetch('/api/pipeline/review', {
        method: 'POST',
        headers: headers,
        body: JSON.stringify(body)
      });
      var data = await resp.json();
      if (!resp.ok) throw new Error(data.error || 'API error');
      return data;
    }

    // ---- Toast ----
    var toastTimer = null;
    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('visible');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toastEl.classList.remove('visible'); }, 3000);
    }

    // ---- Selection ----
    function updateBatchBar() {
      var count = selectedIds.size;
      document.getElementById('batch-count').textContent = count;

      // Show/hide specific buttons based on what's selected
      var statuses = new Set();
      lessonsCache.forEach(function (l) {
        if (selectedIds.has(l.id)) statuses.add(l.status);
      });

      document.getElementById('batch-approve').style.display =
        statuses.has('pending_review') ? '' : 'none';
      document.getElementById('batch-publish').style.display =
        statuses.has('ready_for_teacher') ? '' : 'none';
      document.getElementById('batch-reject').style.display =
        (statuses.has('ready_for_teacher') || statuses.has('pending_review')) ? '' : 'none';

      if (count > 0) {
        batchBar.classList.add('visible');
      } else {
        batchBar.classList.remove('visible');
      }
    }

    function toggleSelection(id) {
      if (selectedIds.has(id)) {
        selectedIds.delete(id);
      } else {
        selectedIds.add(id);
      }
      updateBatchBar();
      // Update checkbox state
      var cb = document.querySelector('.review-card-check[data-id="' + id + '"]');
      if (cb) cb.checked = selectedIds.has(id);
      var card = cb ? cb.closest('.review-card') : null;
      if (card) card.classList.toggle('selected', selectedIds.has(id));
    }

    function selectAll(checked) {
      lessonsCache.forEach(function (l) {
        if (checked) {
          selectedIds.add(l.id);
        } else {
          selectedIds.delete(l.id);
        }
      });
      document.querySelectorAll('.review-card-check').forEach(function (cb) {
        cb.checked = checked;
        var card = cb.closest('.review-card');
        if (card) card.classList.toggle('selected', checked);
      });
      updateBatchBar();
    }

    // ---- Fetch data ----
    async function fetchData() {
      var params = {};
      if (currentStatus && currentStatus !== 'all') params.status = currentStatus;
      if (currentSubjectId) params.subject_id = currentSubjectId;

      var data = await apiGet(params);
      lessonsCache = data.lessons || [];
      subjectsCache = data.subjects || [];
      summaryCache = data.subjectSummary || [];
      countsCache = data.counts || {};
      return data;
    }

    // ---- Render ----
    function renderDashboard() {
      var html = '';

      // Header
      html += '<div class="review-header">';
      html += '<h1>Content Review</h1>';
      html += '</div>';

      // Filter summaries by school + subject
      var filteredSummary = summaryCache.filter(function (s) {
        if (currentSchoolFilter) {
          if (currentSchoolFilter === 'generic' && s.school_id) return false;
          if (currentSchoolFilter !== 'generic' && s.school_id !== currentSchoolFilter) return false;
        }
        if (currentSubjectId && s.id !== currentSubjectId) return false;
        return true;
      });

      // Recalculate tab counts from filtered summaries
      var filteredCounts = { pending_review: 0, ready_for_teacher: 0, live: 0 };
      filteredSummary.forEach(function (s) {
        filteredCounts.pending_review += (s.pending_review || 0);
        filteredCounts.ready_for_teacher += (s.ready_for_teacher || 0);
        filteredCounts.live += (s.live || 0);
      });

      // Controls bar: status tabs + filters
      html += '<div class="review-controls">';

      // Status tabs — use filtered counts
      html += '<div class="review-tabs">';
      var tabs = [
        { key: 'pending_review', label: 'Pending Review', count: filteredCounts.pending_review },
        { key: 'ready_for_teacher', label: 'Ready for Teacher', count: filteredCounts.ready_for_teacher },
        { key: 'live', label: 'Live', count: filteredCounts.live },
        { key: 'all', label: 'All', count: null }
      ];
      tabs.forEach(function (t) {
        var active = currentStatus === t.key ? ' active' : '';
        var countHtml = t.count !== null ? '<span class="tab-count">(' + t.count + ')</span>' : '';
        html += '<button class="review-tab' + active + '" data-status="' + t.key + '">' + t.label + countHtml + '</button>';
      });
      html += '</div>';

      // School filter dropdown
      var schools = {};
      subjectsCache.forEach(function (s) {
        var key = s.school_id || 'generic';
        var label = (s.schools && s.schools.name) ? s.schools.name : (s.school_id ? 'School' : 'Generic');
        if (!schools[key]) schools[key] = label;
      });
      html += '<select class="subject-filter" id="school-filter">';
      html += '<option value="">All Schools</option>';
      Object.keys(schools).forEach(function (key) {
        var sel = currentSchoolFilter === key ? ' selected' : '';
        html += '<option value="' + key + '"' + sel + '>' + esc(schools[key]) + '</option>';
      });
      html += '</select>';

      // Subject filter dropdown (filtered by school if set)
      var filteredSubjects = subjectsCache.filter(function (s) {
        if (!currentSchoolFilter) return true;
        if (currentSchoolFilter === 'generic') return !s.school_id;
        return s.school_id === currentSchoolFilter;
      });
      html += '<select class="subject-filter" id="subject-filter">';
      html += '<option value="">All Subjects</option>';
      filteredSubjects.forEach(function (s) {
        var sel = currentSubjectId === s.id ? ' selected' : '';
        var schoolLabel = s.school_id ? '' : ' (Generic)';
        html += '<option value="' + s.id + '"' + sel + '>' + esc(s.name) + schoolLabel + '</option>';
      });
      html += '</select>';

      // Unit filter dropdown (only if a subject is selected)
      html += '<select class="subject-filter" id="unit-filter"' + (!currentSubjectId ? ' disabled' : '') + '>';
      html += '<option value="">All Units</option>';
      if (currentSubjectId && unitsCache.length > 0) {
        unitsCache.forEach(function (u) {
          var sel = currentUnitFilter === u.id ? ' selected' : '';
          html += '<option value="' + u.id + '"' + sel + '>' + esc(u.name) + '</option>';
        });
      }
      html += '</select>';

      // Apply filters button
      html += '<button class="btn btn-apply" id="apply-filters-btn">Apply</button>';

      // Batch approve all button (for current status + subject)
      if (currentStatus === 'pending_review') {
        var approveLabel = currentSubjectId ? 'Approve All in Subject' : 'Approve All Pending';
        html += '<button class="btn btn-approve" id="approve-all-btn">' + approveLabel + '</button>';
      }
      if (currentStatus === 'ready_for_teacher') {
        var publishLabel = currentSubjectId ? 'Publish All in Subject' : 'Publish All Ready';
        html += '<button class="btn btn-publish" id="publish-all-btn">' + publishLabel + '</button>';
      }

      // Select all
      html += '<label class="review-select-all"><input type="checkbox" id="select-all-cb"> Select all</label>';
      html += '</div>';

      // Lesson grid — filter by unit, sort by lesson_number
      var displayLessons = lessonsCache.slice();
      if (currentUnitFilter) {
        displayLessons = displayLessons.filter(function (l) {
          return l.unit_id === currentUnitFilter;
        });
      }
      displayLessons.sort(function (a, b) {
        // Sort by unit name first, then lesson_number
        var unitA = (a.units || {}).name || '';
        var unitB = (b.units || {}).name || '';
        if (unitA !== unitB) return unitA.localeCompare(unitB);
        return (a.lesson_number || 0) - (b.lesson_number || 0);
      });

      if (displayLessons.length === 0) {
        html += '<div class="review-empty">';
        html += '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>';
        html += '<p>No lessons with this status' + (currentSubjectId ? ' for the selected filters' : '') + '</p>';
        html += '</div>';
      } else {
        html += '<div class="review-grid">';
        displayLessons.forEach(function (lesson) {
          var unit = lesson.units || {};
          var subject = unit.subjects || {};
          var previewUrl = '/lesson/' + subject.slug + '/' + unit.slug + '/' + lesson.lesson_number;
          var editUrl = '/admin/editor?subject=' + encodeURIComponent(subject.slug) + '&unit=' + encodeURIComponent(unit.slug) + '&lesson=' + lesson.lesson_number;
          var isSelected = selectedIds.has(lesson.id);
          var statusLabel = formatStatus(lesson.status);

          html += '<div class="review-card' + (isSelected ? ' selected' : '') + '" data-id="' + lesson.id + '">';

          // Checkbox
          html += '<input type="checkbox" class="review-card-check" data-id="' + lesson.id + '"' + (isSelected ? ' checked' : '') + '>';

          // Hero image (with position matching lesson page)
          if (lesson.hero_image_url) {
            var posStyle = lesson.hero_image_position ? ' style="object-position:' + escAttr(lesson.hero_image_position) + '"' : '';
            html += '<img class="review-card-hero" src="' + escAttr(lesson.hero_image_url) + '"' + posStyle + ' alt="" loading="lazy">';
          } else {
            html += '<div class="review-card-hero--placeholder">No hero image</div>';
          }

          // Body
          html += '<div class="review-card-body">';
          html += '<div class="review-card-title">Lesson ' + lesson.lesson_number + ': ' + esc(lesson.title) + '</div>';
          html += '<div class="review-card-meta">';
          html += '<span>' + esc(subject.name) + '</span>';
          html += '<span class="dot">&middot;</span>';
          html += '<span>' + esc(unit.name) + '</span>';
          html += '<span class="dot">&middot;</span>';
          html += '<span class="status-badge status-' + lesson.status + '">' + statusLabel + '</span>';
          if (lesson.reviewed_at) {
            html += '<span class="dot">&middot;</span>';
            html += '<span>Reviewed ' + formatDate(lesson.reviewed_at) + '</span>';
          }
          if (lesson.published_at) {
            html += '<span class="dot">&middot;</span>';
            html += '<span>Published ' + formatDate(lesson.published_at) + '</span>';
          }
          html += '</div>';

          if (lesson.rejection_notes) {
            html += '<div style="margin-top:0.35rem;font-size:0.72rem;color:#dc2626;font-style:italic;">Rejection note: ' + esc(lesson.rejection_notes) + '</div>';
          }
          html += '</div>';

          // Footer actions
          html += '<div class="review-card-footer">';
          html += '<div class="review-card-actions">';
          html += '<a href="' + previewUrl + '" target="_blank" class="btn btn-sm btn-preview">View</a>';
          html += '<a href="' + editUrl + '" target="_blank" class="btn btn-sm btn-edit">Edit</a>';

          if (lesson.status === 'pending_review') {
            html += '<button class="btn btn-sm btn-approve" data-action="approve" data-id="' + lesson.id + '">Approve</button>';
            html += '<button class="btn btn-sm btn-reject" data-action="reject" data-id="' + lesson.id + '" data-title="' + escAttr(lesson.title) + '">Reject</button>';
          }
          if (lesson.status === 'ready_for_teacher') {
            html += '<button class="btn btn-sm btn-publish" data-action="publish" data-id="' + lesson.id + '">Publish</button>';
            html += '<button class="btn btn-sm btn-reject" data-action="reject" data-id="' + lesson.id + '" data-title="' + escAttr(lesson.title) + '">Send Back</button>';
          }

          html += '</div>';
          html += '<span style="font-size:0.68rem;color:var(--text-muted)">' + formatDate(lesson.updated_at) + '</span>';
          html += '</div>';

          html += '</div>';
        });
        html += '</div>';
      }

      app.innerHTML = html;
      bindEvents();
    }

    // ---- Bind events after render ----
    function bindEvents() {
      // Status tab clicks
      app.querySelectorAll('.review-tab').forEach(function (tab) {
        tab.addEventListener('click', function () {
          currentStatus = tab.dataset.status;
          selectedIds.clear();
          updateBatchBar();
          loadAndRender();
        });
      });

      // School dropdown change — filter subject dropdown immediately
      var schoolFilter = document.getElementById('school-filter');
      if (schoolFilter) {
        schoolFilter.addEventListener('change', function () {
          var schoolVal = this.value;
          var subjectDd = document.getElementById('subject-filter');
          var unitDd = document.getElementById('unit-filter');
          if (!subjectDd) return;

          // Filter subjects by school
          var filtered = subjectsCache.filter(function (s) {
            if (!schoolVal) return true;
            if (schoolVal === 'generic') return !s.school_id;
            return s.school_id === schoolVal;
          });

          subjectDd.innerHTML = '<option value="">All Subjects</option>';
          filtered.forEach(function (s) {
            var schoolLabel = s.school_id ? '' : ' (Generic)';
            subjectDd.innerHTML += '<option value="' + s.id + '">' + esc(s.name) + schoolLabel + '</option>';
          });

          // Reset unit dropdown
          if (unitDd) {
            unitDd.innerHTML = '<option value="">All Units</option>';
            unitDd.disabled = true;
          }
          unitsCache = [];
        });
      }

      // Subject dropdown change — populate unit dropdown immediately
      var subjectFilter = document.getElementById('subject-filter');
      if (subjectFilter) {
        subjectFilter.addEventListener('change', function () {
          var unitDd = document.getElementById('unit-filter');
          if (!unitDd) return;
          var sid = this.value;
          if (sid) {
            unitDd.disabled = true;
            unitDd.innerHTML = '<option value="">Loading\u2026</option>';
            sb.from('units').select('id, slug, name, sort_order').eq('subject_id', sid).order('sort_order')
              .then(function (result) {
                unitsCache = result.data || [];
                unitDd.innerHTML = '<option value="">All Units</option>';
                unitsCache.forEach(function (u) {
                  unitDd.innerHTML += '<option value="' + u.id + '">' + esc(u.name) + '</option>';
                });
                unitDd.disabled = false;
              });
          } else {
            unitsCache = [];
            unitDd.innerHTML = '<option value="">All Units</option>';
            unitDd.disabled = true;
          }
        });
      }

      // Apply filters button
      var applyBtn = document.getElementById('apply-filters-btn');
      if (applyBtn) {
        applyBtn.addEventListener('click', function () {
          var schoolDd = document.getElementById('school-filter');
          var subjectDd = document.getElementById('subject-filter');
          var unitDd = document.getElementById('unit-filter');
          currentSchoolFilter = schoolDd ? schoolDd.value : '';
          currentSubjectId = subjectDd ? subjectDd.value : '';
          currentUnitFilter = unitDd ? unitDd.value : '';
          selectedIds.clear();
          updateBatchBar();
          loadAndRender();
        });
      }

      // Select all checkbox
      var selectAllCb = document.getElementById('select-all-cb');
      if (selectAllCb) {
        selectAllCb.addEventListener('change', function () {
          selectAll(this.checked);
        });
      }

      // Individual checkboxes
      app.querySelectorAll('.review-card-check').forEach(function (cb) {
        cb.addEventListener('change', function (e) {
          e.stopPropagation();
          toggleSelection(cb.dataset.id);
        });
      });

      // Card click to toggle selection (if clicking the card body, not a button/link)
      app.querySelectorAll('.review-card').forEach(function (card) {
        card.addEventListener('click', function (e) {
          // Don't toggle if clicking a button, link, or checkbox
          if (e.target.closest('button') || e.target.closest('a') || e.target.closest('input')) return;
          toggleSelection(card.dataset.id);
        });
      });

      // Individual action buttons
      app.querySelectorAll('[data-action="approve"]').forEach(function (btn) {
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          performAction('approve', [btn.dataset.id]);
        });
      });

      app.querySelectorAll('[data-action="publish"]').forEach(function (btn) {
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          performAction('publish', [btn.dataset.id]);
        });
      });

      app.querySelectorAll('[data-action="reject"]').forEach(function (btn) {
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          showRejectModal([btn.dataset.id], btn.dataset.title);
        });
      });

      // Approve All button
      var approveAllBtn = document.getElementById('approve-all-btn');
      if (approveAllBtn) {
        approveAllBtn.addEventListener('click', function () {
          performBulkAction('approve_all');
        });
      }

      // Publish All button
      var publishAllBtn = document.getElementById('publish-all-btn');
      if (publishAllBtn) {
        publishAllBtn.addEventListener('click', function () {
          performBulkAction('publish_all');
        });
      }
    }

    // ---- Actions ----
    async function performAction(action, ids, notes) {
      try {
        var body = { action: action, lesson_ids: ids };
        if (notes) body.notes = notes;
        var result = await apiPost(body);
        var count = result.updated || result.published || result.approved || result.rejected || 0;
        showToast(capitalize(action) + (action === 'approve' ? 'd' : action === 'publish' ? 'ed' : 'ed') + ' ' + count + ' lesson' + (count !== 1 ? 's' : ''));
        selectedIds.clear();
        updateBatchBar();
        await loadAndRender();
      } catch (err) {
        showToast('Error: ' + err.message);
      }
    }

    async function performBulkAction(action) {
      try {
        var body = { action: action };
        if (currentSubjectId) body.subject_id = currentSubjectId;
        var result = await apiPost(body);
        var count = result.approved || result.published || 0;
        var verb = action === 'approve_all' ? 'Approved' : 'Published';
        showToast(verb + ' ' + count + ' lesson' + (count !== 1 ? 's' : ''));
        selectedIds.clear();
        updateBatchBar();
        await loadAndRender();
      } catch (err) {
        showToast('Error: ' + err.message);
      }
    }

    function showRejectModal(ids, title) {
      var modal = document.createElement('div');
      modal.className = 'modal-overlay';
      modal.innerHTML =
        '<div class="modal-box">' +
          '<h3>Request Changes</h3>' +
          '<p>' + (title ? 'Lesson: ' + esc(title) : ids.length + ' lesson' + (ids.length !== 1 ? 's' : '') + ' selected') + '</p>' +
          '<textarea id="reject-notes" placeholder="What needs to change? (optional)"></textarea>' +
          '<div class="modal-actions">' +
            '<button class="btn" id="reject-cancel" style="background:#f3f4f6">Cancel</button>' +
            '<button class="btn btn-reject" id="reject-confirm">Send Back</button>' +
          '</div>' +
        '</div>';

      document.body.appendChild(modal);

      modal.querySelector('#reject-cancel').addEventListener('click', function () { modal.remove(); });
      modal.querySelector('#reject-confirm').addEventListener('click', function () {
        var notes = modal.querySelector('#reject-notes').value;
        modal.remove();
        performAction('reject', ids, notes);
      });
      modal.addEventListener('click', function (e) {
        if (e.target === modal) modal.remove();
      });
    }

    // ---- Batch bar button handlers ----
    document.getElementById('batch-approve').addEventListener('click', function () {
      var ids = Array.from(selectedIds).filter(function (id) {
        return lessonsCache.some(function (l) { return l.id === id && l.status === 'pending_review'; });
      });
      if (ids.length > 0) performAction('approve', ids);
    });

    document.getElementById('batch-publish').addEventListener('click', function () {
      var ids = Array.from(selectedIds).filter(function (id) {
        return lessonsCache.some(function (l) { return l.id === id && l.status === 'ready_for_teacher'; });
      });
      if (ids.length > 0) performAction('publish', ids);
    });

    document.getElementById('batch-reject').addEventListener('click', function () {
      var ids = Array.from(selectedIds).filter(function (id) {
        return lessonsCache.some(function (l) {
          return l.id === id && (l.status === 'pending_review' || l.status === 'ready_for_teacher');
        });
      });
      if (ids.length > 0) showRejectModal(ids);
    });

    document.getElementById('batch-clear').addEventListener('click', function () {
      selectedIds.clear();
      document.querySelectorAll('.review-card-check').forEach(function (cb) { cb.checked = false; });
      document.querySelectorAll('.review-card.selected').forEach(function (c) { c.classList.remove('selected'); });
      var selectAllCb = document.getElementById('select-all-cb');
      if (selectAllCb) selectAllCb.checked = false;
      updateBatchBar();
    });

    // ---- Helpers ----
    function esc(str) {
      var div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    function escAttr(str) {
      return (str || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function formatStatus(status) {
      var map = {
        'pending_review': 'Pending Review',
        'ready_for_teacher': 'Ready for Teacher',
        'live': 'Live',
        'draft': 'Draft',
        'review': 'Review',
        'approved': 'Approved'
      };
      return map[status] || status;
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      return new Date(dateStr).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    }

    function capitalize(str) {
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    // ---- Load + render ----
    function showLoading() {
      // Keep existing content visible but dim it, show spinner overlay
      app.style.opacity = '0.5';
      app.style.pointerEvents = 'none';
      if (!document.getElementById('review-spinner')) {
        var spinner = document.createElement('div');
        spinner.id = 'review-spinner';
        spinner.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:100;background:white;padding:1rem 1.5rem;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,0.12);font-size:0.85rem;color:#6b6560;font-family:Inter,sans-serif;';
        spinner.textContent = 'Loading\u2026';
        document.body.appendChild(spinner);
      }
    }

    function hideLoading() {
      app.style.opacity = '';
      app.style.pointerEvents = '';
      var spinner = document.getElementById('review-spinner');
      if (spinner) spinner.remove();
    }

    async function loadAndRender() {
      showLoading();
      try {
        await fetchData();
        renderDashboard();
      } catch (err) {
        app.innerHTML = '<div class="review-empty"><p>Failed to load: ' + esc(err.message) + '</p></div>';
      } finally {
        hideLoading();
      }
    }

    // ---- Init ----
    async function init() {
      await loadAndRender();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
  </script>
</body>
</html>
